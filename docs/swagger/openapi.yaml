        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/Departments'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/FeatureFlags'
