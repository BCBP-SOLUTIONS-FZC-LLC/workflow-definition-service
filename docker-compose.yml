services:
  postgres:
    image: postgres:16
    container_name: wf-definition-postgres
    environment:
      POSTGRES_USER: wfdef
      POSTGRES_PASSWORD: wfdef
      POSTGRES_DB: workflow_definition
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wfdef -d workflow_definition"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    container_name: wf-definition-valkey
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
