name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
  GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Go tools
        uses: actions/cache@v4
        id: cache-tools
        with:
          path: .tools
          key: ${{ runner.os }}-go-tools-sqlc-v1.31.1-mockgen-v0.6.0

      - name: Install sqlc and mockgen
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          GOBIN=$PWD/.tools go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          GOBIN=$PWD/.tools go install go.uber.org/mock/mockgen@v0.6.0

      - name: Generate proto, sqlc, and mocks
        run: |
          buf generate
          .tools/sqlc generate
          mkdir -p internal/core/port/mocks
          .tools/mockgen -source=internal/core/port/repository.go  -destination=internal/core/port/mocks/repository_mock.go  -package=mocks
          .tools/mockgen -source=internal/core/port/publisher.go   -destination=internal/core/port/mocks/publisher_mock.go   -package=mocks
          .tools/mockgen -source=internal/core/port/cache.go       -destination=internal/core/port/mocks/cache_mock.go       -package=mocks
          .tools/mockgen -source=internal/core/port/services.go    -destination=internal/core/port/mocks/services_mock.go    -package=mocks
          .tools/mockgen -source=internal/core/port/transactor.go  -destination=internal/core/port/mocks/transactor_mock.go  -package=mocks
          .tools/mockgen -source=internal/core/port/glue.go        -destination=internal/core/port/mocks/glue_mock.go        -package=mocks

      - uses: actions/upload-artifact@v4
        with:
          name: generated
          path: |
            gen/
            internal/adapter/outbound/postgres/db/
            internal/core/port/mocks/


  Build:
    runs-on: ubuntu-latest
    needs: [generate]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - uses: actions/download-artifact@v4
        with:
          name: generated

      - name: Download modules
        run: go mod download

      - run: go build -o /dev/null ./cmd/server
      - run: go build -tags=integration -o /dev/null ./cmd/server

  # vet runs format, tidy-drift, vet, and vulnerability checks.
  # Branch protection requires the "vet" job name — checks are inline since
  # validate.yml is self-contained (generates its own code) and incompatible
  # with the pre-generated artifact pattern used here.
  vet:
    runs-on: ubuntu-latest
    needs: [generate]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - uses: actions/download-artifact@v4
        with:
          name: generated

      - name: Download modules
        run: go mod download

      - name: Format check
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt violations:"
            echo "$files"
            exit 1
          fi

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - run: go vet ./...

      - name: Architecture lint (import direction)
        run: |
          go install github.com/fe3dback/go-arch-lint@latest
          go-arch-lint check --project-path .

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./internal/... ./cmd/...

  Test:
    runs-on: ubuntu-latest
    needs: [generate]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - uses: actions/download-artifact@v4
        with:
          name: generated

      - name: Download modules
        run: go mod download

      - name: Unit Tests & Coverage
        run: |
          mkdir -p .coverage
          EXCLUDE='/postgres/db$\|/postgres$\|/mocks$\|/glue$\|/inbound/http$'
          go test -race -count=1 \
            -coverpkg=$(go list ./internal/... ./cmd/... | grep -v "$EXCLUDE" | tr '\n' ',' | sed 's/,$//') \
            -coverprofile=.coverage/coverage.out -covermode=atomic \
            ./internal/... ./test/unit/...
          grep -v '/postgres/db/\|/postgres/\|/mocks/\|/glue/\|/service/noop_logger.go\|/inbound/http/asyncapi.go\|/inbound/http/swagger' .coverage/coverage.out > .coverage/coverage.out.filtered && mv .coverage/coverage.out.filtered .coverage/coverage.out

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: .coverage/coverage.out

  coverage:
    runs-on: ubuntu-latest
    needs: [Test]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: .coverage

      - run: go tool cover -func=.coverage/coverage.out | tail -1

      # Global floor: 95%. Per-package floors enforced via make cover-check-pkg (mirrors Makefile COVER_PKG_FLOORS).
      - name: Enforce per-package coverage floors
        run: make cover-check-pkg

      - name: Enforce global coverage threshold (≥ 95%)
        run: |
          pct=$(go tool cover -func=.coverage/coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { if (p+0 < 95) { print "FAIL: " p "% is below the 95% threshold"; exit 1 } else { print "PASS: " p "%" } }'

  Iint:
    runs-on: ubuntu-latest
    needs: [generate]
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      DOCKER_HOST: unix:///var/run/docker.sock
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials
      - uses: actions/download-artifact@v4
        with:
          name: generated

      - name: Download modules
        run: go mod download

      - name: Restore Docker image cache
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images.tar.gz
          key: docker-${{ hashFiles('.github/docker-image-versions') }}

      - name: Load or pull testcontainers images
        run: |
          if [ "${{ steps.docker-cache.outputs.cache-hit }}" = "true" ]; then
            docker load < /tmp/docker-images.tar.gz
          else
            docker pull postgres:18-alpine
            docker pull localstack/localstack:3
            docker pull valkey/valkey:8-alpine
            docker save postgres:18-alpine localstack/localstack:3 valkey/valkey:8-alpine \
              | gzip > /tmp/docker-images.tar.gz
          fi

      - name: Integration Tests & Coverage
        run: |
          mkdir -p .coverage
          EXCLUDE='/postgres/db$\|/postgres$\|/mocks$\|/glue$\|/inbound/http$'
          go test -race -count=1 -tags integration \
            -coverpkg=$(go list ./internal/... | grep -v "$EXCLUDE" | tr '\n' ',' | sed 's/,$//') \
            -coverprofile=.coverage/coverage-integration.out \
            -covermode=atomic \
            ./test/integration/... ./test/e2e/...
          grep -v '/postgres/db/\|/postgres/\|/mocks/\|/glue/\|/service/noop_logger.go\|/inbound/http/asyncapi.go\|/inbound/http/swagger' \
            .coverage/coverage-integration.out > .coverage/coverage-integration.out.filtered \
            && mv .coverage/coverage-integration.out.filtered .coverage/coverage-integration.out
          go tool cover -func=.coverage/coverage-integration.out | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: .coverage/coverage-integration.out

  lint:
    runs-on: ubuntu-latest
    needs: [generate]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - uses: actions/download-artifact@v4
        with:
          name: generated

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m

  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  build-image-cache:
    name: Build image (cache)
    runs-on: ubuntu-latest
    needs: [generate, lint-dockerfile]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: generated

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: workflow-definition-service:${{ github.sha }}
          build-args: BUILD_VERSION=${{ github.sha }}
          secrets: go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-cve-scan:
    name: Trivy CVE scan
    runs-on: ubuntu-latest
    needs: [generate]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: generated

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          skip-dirs: vendor,platform-libs,.design

  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: [generate]
    env:
      GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
      GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*
      DATABASE_URL: postgres://wfdef:wfdef@localhost:5432/wfdef?sslmode=disable
      AWS_USE_STUB: "true"
      APP_ENV: ci
      ORG_MEMBERSHIP_BASE_URL: http://localhost:8081
      EXECUTION_SERVICE_ADDR: localhost:9091
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wfdef
          POSTGRES_PASSWORD: wfdef
          POSTGRES_DB: wfdef
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - uses: actions/download-artifact@v4
        with:
          name: generated

      - name: Download modules
        run: go mod download

      - name: Run migrations
        run: go run ./cmd/server migrate

      - name: Start stubs and service
        run: |
          go run ./cmd/stub/membership &
          go run ./cmd/stub/execution &
          go run ./cmd/server &
          until curl -sf -X POST http://localhost:8081/control \
              -H "Content-Type: application/json" -d '{"eligible":true}' &>/dev/null; do sleep 1; done
          until curl -sf -X POST http://localhost:9092/control \
              -H "Content-Type: application/json" -d '{"has_active":false}' &>/dev/null; do sleep 1; done
          until curl -sf http://localhost:8080/healthz &>/dev/null; do sleep 1; done

      - name: Smoke test
        run: bash scripts/smoke-test.sh

  push-image-ghcr:
    name: Push image → GHCR
    runs-on: ubuntu-latest
    needs: build-image-cache
    if: false  # enabled once GHCR credentials are configured
    steps:
      - run: echo "Registry push not yet configured"
