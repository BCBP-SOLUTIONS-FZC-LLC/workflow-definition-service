{{- include "workflow-definition-service.validateAuthorizationPolicy" . }}
{{- if ne .Values.env.APP_ENV "dev" }}
{{- range $key := list "ORG_MEMBERSHIP_BASE_URL" "EXECUTION_SERVICE_URL" "OPENBAO_ADDR" "VALKEY_ADDR" }}
{{- if not (index $.Values.env $key) }}
{{- fail (printf "env.%s is required when env.APP_ENV is not dev: the service refuses to start without it, and so does the migrate job." $key) }}
{{- end }}
{{- end }}
{{- if not (or .Values.env.CATALOG_ADMIN_BASE_URL .Values.env.ENTITLEMENTS_BASE_URL) }}
{{- fail "at least one of env.CATALOG_ADMIN_BASE_URL and env.ENTITLEMENTS_BASE_URL is required when env.APP_ENV is not dev: the service refuses to start without a template limit source, and so does the migrate job." }}
{{- end }}
{{- end }}
