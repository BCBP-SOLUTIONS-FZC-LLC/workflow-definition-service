openapi: "3.0.3"
info:
  title: Workflow Definition Service
  version: "1.0.0"
  description: |
    Manages workflow template lifecycle: create, draft, publish, archive, clone,
    promote, validate, export, and diff BPMN-based workflow definitions, plus the
    module library, starter templates and connector configuration.
    All identity and tenant context is injected by the Envoy API Gateway.

    ## Behaviour shared by every `/api/v1` operation

    The checks run in this order; the first that fails answers.

    1. **Identity.** `x-tenant-id` and `x-user-id` are required. Absent or blank is
       `401 UNAUTHORIZED` (detail `x-tenant-id must be a UUID` or `x-user-id must be a
       UUID`). A repeated identity header, or an `x-tenant-roles` value longer than the
       shared library accepts or naming too many roles, is `401` written by the shared
       HTTP library in its own problem format (`PlatformProblem`, `errorCode`
       `UNAUTHORIZED`). A value that is not a UUID is `401 UNAUTHORIZED` (same details).
    2. **Roles header.** `x-tenant-roles` is optional; see step 4 for where it matters.
    3. **Content type.** A request with a body (any non-zero or unknown
       `Content-Length`, on any method) must carry `Content-Type: application/json`;
       parameters such as `charset` are ignored and the media type is compared
       without letter case. Otherwise `415 UNSUPPORTED_MEDIA_TYPE`.
    4. **Role.** Every mutating operation (POST, PUT, DELETE, except
       `POST /workflows/validate`) needs `tenant_admin` or `tenant_owner` in
       `x-tenant-roles`, else `403 FORBIDDEN` (detail `caller lacks
       tenant_admin/tenant_owner role`). Global-scope modules and starters also
       need `platform_operator` (detail `caller lacks platform_operator role`).
    5. **Idempotency.** See the `Idempotency-Key` parameter. The role check runs
       before a stored answer is looked up.
    6. **Path ids.** A path id that is not a UUID is `400 BAD_REQUEST` (detail
       `invalid <name>: not a valid UUID`). Any spelling Go's `uuid.Parse` accepts
       (canonical, braces, `urn:uuid:`, 32 hex digits) is a UUID.
    7. **Body.** Bodies are limited to 10 MiB (10,485,760 bytes); an operation
       that reads a larger body answers `413 PAYLOAD_TOO_LARGE`. Bodies are read strictly: field names match exactly, letter case
       included; an unknown field (named by its path, up to twenty), a field of the
       wrong type, a missing or empty required string, a body that is not JSON and a
       second JSON value after the first are `400 BAD_REQUEST` with `invalid_params`.
       A text field over its limit, containing a NUL character or (where stated)
       only whitespace is `422 INVALID_INPUT` naming it. Lengths are counted in
       characters. Text is stored as sent, never trimmed.

    ## Errors

    Every error this service writes is an `application/problem+json`
    `ProblemDetails` document whose `code` gives the case. Other bodies:

    - The shared HTTP library writes three responses in its own problem format
      (`PlatformProblem`, also `application/problem+json`): a recovered panic
      (`500 INTERNAL_ERROR`), a request still unanswered at the 30-second deadline
      (`503`, `errorCode` `REQUEST_TIMEOUT`) and the identity refusals in step 1.
      Every handler answers a database or client call cut short by the deadline
      itself, with `503 UPSTREAM_UNAVAILABLE` (detail `the request was cancelled or
      its deadline passed`), so `REQUEST_TIMEOUT` is rare.
    - A path no route serves answers `404 NOT_FOUND` (detail `no route matches this
      method and path`); a trailing slash is not redirected and counts as an unknown
      path. A known path called with a method it does not serve answers
      `405 METHOD_NOT_ALLOWED` (detail `the method is not allowed for this path`) with an
      `Allow` header. Both are answered before authentication.
    - `/healthz` and `/readyz` answer plain JSON.

    A `5xx` from this service means nothing was changed unless the operation
    says otherwise, and the request is safe to retry.
servers:
  - url: http://localhost:8080
    description: Local dev server (matches cmd/server's actual route mounts)
  - url: https://api.internal/definition
    description: Envoy API Gateway (production)
# All endpoints require a valid tenant context injected by the Envoy gateway.
# Mutating endpoints (POST/PUT/DELETE) additionally require x-tenant-roles.
security:
  - GatewayTenantContext: []
components:

  securitySchemes:
    GatewayTenantContext:
      type: apiKey
      in: header
      name: x-tenant-id
      description: >
        Tenant UUID injected by the Envoy ext_authz filter after JWT validation.
        Must be present on every request. Never supplied directly by the client
        in production — the gateway rejects any request without a valid JWT and
        sets this header from the token claims.

    AdminRoles:
      type: apiKey
      in: header
      name: x-tenant-roles
      description: >
        Roles claim injected by the gateway. Required for mutating operations.
        Contains a comma-separated list of roles (e.g. tenant_admin,member);
        each entry is trimmed and compared exactly, letter case included.
        Accepted values for mutation: tenant_admin, tenant_owner. Creating,
        changing or deleting a global-scope module or starter also needs
        platform_operator. Read-only endpoints (GET) and POST /workflows/validate
        do not require this header.

  parameters:
    TenantId:
      name: x-tenant-id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: >-
        Tenant UUID injected by Envoy; every read and write is scoped to it by
        row-level security. Absent, blank or not a UUID: 401 UNAUTHORIZED (detail
        `x-tenant-id must be a UUID`).
      example: 7ca648b2-b432-4744-884c-35fd556a310c

    UserId:
      name: x-user-id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: >-
        Authenticated user UUID injected by Envoy; recorded as the creator of what
        the request writes and part of the idempotency scope. Absent, blank or not a
        UUID: 401 UNAUTHORIZED (detail `x-user-id must be a UUID`).
      example: 4da18bde-7244-47ac-986c-665cd42caaaa

    TenantRoles:
      name: x-tenant-roles
      in: header
      required: false
      schema:
        type: string
      description: Comma-separated tenant roles injected by Envoy. Reads need only the tenant and user; a mutating call without `tenant_admin` or `tenant_owner` here is `403`.

    Departments:
      name: x-departments
      in: header
      required: false
      schema:
        type: string
      description: Comma-separated list of department memberships and role levels injected by Envoy. Not read by this service.

    Plan:
      name: x-plan
      in: header
      required: false
      schema:
        type: string
      description: >-
        The tenant's plan code (starter, pro or enterprise), set by the authorization
        layer. Workflow creation, clone, and a promote that reactivates a workflow
        with no active version look up the plan's workflow template limit by it in
        the catalog's plan table, after trimming spaces and lowering its case. A
        missing, blank or unknown code, or a plan table that cannot be read, answers
        503 UPSTREAM_UNAVAILABLE. When the service reads the limit per tenant from
        Entitlements instead, the header is not used for the limit and only fills
        plan_code of a quota refusal. Other operations do not read it.

    FeatureFlags:
      name: x-feature-flags
      in: header
      required: false
      schema:
        type: string
      description: Encoded set of effective feature flags injected by Envoy. Not read by this service.

    WorkflowId:
      name: id
      in: path
      required: true
      description: "The workflow id. Not a UUID is 400 BAD_REQUEST (detail `invalid id: not a valid UUID`); a workflow of another tenant reads as absent (404)."
      schema:
        type: string
        format: uuid
      example: 8fa88cde-824c-47bc-836b-665cd42c2222

    VersionId:
      name: version_id
      in: path
      required: true
      description: "The workflow version id. Not a UUID is 400 BAD_REQUEST (detail `invalid version_id: not a valid UUID`); a version of another workflow or tenant reads as absent (404)."
      schema:
        type: string
        format: uuid
      example: 11abcc22-3844-42bc-938b-665cd42c1111

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 256
      description: >
        Optional client-generated request key that makes a retry safe. The same key with the
        same body replays the first response; the same key with a different body is a 409
        (`IDEMPOTENCY_KEY_REPLAY`); the same key while the first request is still running is
        a 409 (`IDEMPOTENCY_REQUEST_IN_PROGRESS`) and is retried after the first one
        finishes. A key longer than 256 bytes is a 400 (`BAD_REQUEST`, detail
        `Idempotency-Key must be at most 256 bytes`). Keys are scoped
        to the tenant, the user, the method and the path. An absent or empty key turns the
        mechanism off. The body fingerprint is a SHA-256 of the raw body bytes and the
        `If-Match` header, so the same JSON written differently is a different body. Only a
        2xx answer is stored, with its status and body, for IDEMPOTENCY_TTL (24 hours by
        default); a replay carries `Content-Type: application/json` and the stored status
        and body. An error answer is not stored, so the key can be retried. The running
        marker expires after one minute. When the cache cannot be reached the request runs
        without the protection. The role check runs first, so a caller who has lost the
        role gets 403, not the stored answer.

  schemas:

    VersionStatus:
      type: string
      description: "A version's lifecycle status: DRAFT (editable, at most one per workflow or module), PUBLISHED (compiled and frozen) or ARCHIVED."
      enum: [DRAFT, PUBLISHED, ARCHIVED]

    ChangeType:
      type: string
      description: STRUCTURAL when the execution shape differs (publishing it needs force_publish_structural over an active version); METADATA_ONLY otherwise.
      enum: [STRUCTURAL, METADATA_ONLY]

    Pagination:
      type: object
      description: The paging of a list response.
      properties:
        total_count: { type: integer, description: "Number of rows that match the filters, across all pages (a 64-bit count)." }
        page:        { type: integer, description: "The page returned, 1-based; echoes the request (default 1)." }
        limit:       { type: integer, description: "The page size used; echoes the request (default 20)." }
      example:
        total_count: 4
        page: 1
        limit: 20

    ValidationError:
      type: object
      description: A stored validation error of a version, written when a membership revocation invalidated a default assignee.
      properties:
        node_id: { type: string, description: "The BPMN element id the error is about." }
        error:   { type: string, description: "What is wrong with it." }
      example:
        node_id: Task_design_prep
        error: "userTask is missing zeebe:taskDefinition"

    WorkflowSummary:
      type: object
      description: A workflow template's root record.
      properties:
        id:                    { type: string, format: uuid, description: "The workflow id." }
        key:                   { type: string, description: "The template key, unique in the tenant, as sent at creation." }
        name:                  { type: string, description: "The workflow name, as last saved." }
        description:           { type: string, description: "The workflow description; an empty string when none was given." }
        active_version_id:     { type: string, format: uuid, nullable: true, description: "The PUBLISHED version new instances start from. Omitted (never null) when the workflow has none: never published, or archived." }
        active_version_number: { type: integer, nullable: true, description: "The number of the active version. Omitted (never null) when there is no active version." }
        has_draft:             { type: boolean, description: "Whether the workflow has a DRAFT version." }
        created_at:            { type: string, format: date-time, description: "When the workflow was created." }
        updated_at:            { type: string, format: date-time, description: "When the workflow's own record last changed (name, description, active version)." }
      example:
        id: 7ca648b2-b432-4744-884c-35fd556a310c
        key: tender-review-123
        name: Tender Document Review Process
        description: Standard review process for tender proposal documents
        active_version_id: 8fa88cde-824c-47bc-836b-665cd42c2222
        active_version_number: 3
        has_draft: true
        created_at: "2026-05-10T08:00:00Z"
        updated_at: "2026-05-18T12:30:00Z"

    VersionSummary:
      type: object
      description: A workflow version without its BPMN or plan, as lists carry it.
      properties:
        id:                  { type: string, format: uuid, description: "The version id." }
        version_number:      { type: integer, nullable: true, description: "The version's number, assigned at publish (1, 2, ...). Omitted (never null) for a DRAFT." }
        status:              { $ref: '#/components/schemas/VersionStatus' }
        is_valid:
          type: boolean
          description: >-
            Whether all default assignees in this version are still valid members
            of their required departments. Set to false by a DepartmentMembershipRevoked
            or MembershipRevoked event; does not reflect BPMN structural validity.
        created_by_user_id:  { type: string, format: uuid, description: "The user who created the version." }
        published_at:        { type: string, format: date-time, nullable: true, description: "When the version was published. Omitted (never null) for a DRAFT." }
        created_at:          { type: string, format: date-time, description: "When the version was created." }
      example:
        id: 8fa88cde-824c-47bc-836b-665cd42c2222
        version_number: 2
        status: PUBLISHED
        is_valid: true
        created_by_user_id: 4da18bde-7244-47ac-986c-665cd42caaaa
        published_at: "2026-05-14T09:00:00Z"
        created_at: "2026-05-13T15:20:00Z"

    VersionDetail:
      type: object
      description: A workflow version with its BPMN and stored plan.
      properties:
        id:                 { type: string, format: uuid, description: "The version id." }
        workflow_id:        { type: string, format: uuid, description: "The workflow the version belongs to." }
        version_number:     { type: integer, nullable: true, description: "The version's number. Omitted (never null) for a DRAFT." }
        status:             { $ref: '#/components/schemas/VersionStatus' }
        is_valid:           { type: boolean, description: "False once a membership revocation invalidated a default assignee of the version; true for a draft until then." }
        validation_errors:
          type: array
          items: { $ref: '#/components/schemas/ValidationError' }
          nullable: true
          description: The stored validation errors written by membership revocations. Omitted (never null) when there are none; a stored list that cannot be read is left out and logged.
        bpmn_xml:           { type: string, description: "The version's BPMN 2.0 XML, as stored." }
        module_refs:        { type: array, items: { $ref: '#/components/schemas/ModuleRef' }, description: "Library module versions this version resolved at publish, whose snapshot it holds. Always present; an empty array on drafts." }
        artifact_hash:      { type: string, nullable: true, description: "SHA-256 of the BPMN XML at publish time. Omitted (never null) on DRAFT versions." }
        compiled_plan_json: { $ref: '#/components/schemas/CompiledCollaboration' }
        created_by_user_id: { type: string, format: uuid, description: "The user who created the version." }
        created_at:         { type: string, format: date-time, description: "When the version was created." }
        updated_at:         { type: string, format: date-time, description: "When the version last changed." }
        published_at:       { type: string, format: date-time, nullable: true, description: "When the version was published. Omitted (never null) for a DRAFT." }
        record_version:     { type: integer, format: int64, description: "Monotonic optimistic-lock counter. Echo on PUT /draft requests (body or If-Match)." }
      example:
        id: 11abcc22-3844-42bc-938b-665cd42c1111
        workflow_id: 8fa88cde-824c-47bc-836b-665cd42c2222
        status: DRAFT
        is_valid: true
        bpmn_xml: "<bpmn:definitions>...</bpmn:definitions>"
        module_refs: []
        created_by_user_id: 4da18bde-7244-47ac-986c-665cd42caaaa
        created_at: "2026-05-18T12:00:00Z"
        updated_at: "2026-05-18T12:30:00Z"
        record_version: 3

    WorkflowWriteResult:
      type: object
      description: The answer to a write that leaves a workflow with a version.
      properties:
        workflow_id:    { type: string, format: uuid, description: "The workflow written." }
        version_id:     { type: string, format: uuid, description: "The version created or written." }
        status:         { $ref: '#/components/schemas/VersionStatus' }
        version_number: { type: integer, nullable: true, description: "The version's number; null for a DRAFT." }
        message:        { type: string, description: "A fixed human-readable summary." }

    CatalogScope:
      type: string
      enum: [tenant, global]
      description: >-
        `tenant` rows are owned by the caller's own tenant; `global` rows are
        platform-authored and visible to every tenant. Creating or deleting a
        `global` row requires the `platform_operator` role.

    ModuleSummary:
      type: object
      description: A library module's root record.
      properties:
        id:                { type: string, format: uuid, description: "The module id." }
        tenant_id:         { type: string, format: uuid, nullable: true, description: "The owning tenant. Omitted (never null) for a global module." }
        scope:             { $ref: '#/components/schemas/CatalogScope' }
        name:              { type: string, description: "The module name, as sent." }
        description:       { type: string, description: "The module description; an empty string when none was given." }
        process_id:
          type: string
          description: The module's `<bpmn:process>` id, fixed for every version; what a calling `callActivity`'s `calledElement processId` names.
        active_version_id: { type: string, format: uuid, nullable: true, description: "The PUBLISHED version calls resolve to. Omitted (never null) when the module has none: never published, or archived." }
        created_at:        { type: string, format: date-time, description: "When the module was created." }
        updated_at:        { type: string, format: date-time, description: "When the module record last changed." }
      example:
        id: 018f1a2b-0000-7000-8000-000000000001
        tenant_id: null
        scope: global
        name: Standard Approval Chain
        description: Reusable three-step approval sequence
        process_id: ApprovalChain
        active_version_id: 018f1a2b-0000-7000-8000-000000000002
        created_at: "2026-08-20T08:00:00Z"
        updated_at: "2026-08-25T10:00:00Z"

    ModuleVersion:
      type: object
      description: One version of a library module, with its BPMN.
      properties:
        id:              { type: string, format: uuid, description: "The module version id." }
        module_id:       { type: string, format: uuid, description: "The module it belongs to." }
        scope:           { $ref: '#/components/schemas/CatalogScope' }
        status:          { $ref: '#/components/schemas/VersionStatus' }
        bpmn_xml:        { type: string, description: "The version's BPMN 2.0 XML, as stored." }
        process_id:
          type: string
          description: The `<bpmn:process id="...">` value inside `bpmn_xml`; always its module's `process_id`.
        version_number:  { type: integer, nullable: true, description: "The version's number, assigned at publish. Omitted (never null) for a DRAFT." }
        is_valid:        { type: boolean, description: "Whether the version is usable; true when created." }
        published_at:    { type: string, format: date-time, nullable: true, description: "When the version was published. Omitted (never null) for a DRAFT." }
        created_at:      { type: string, format: date-time, description: "When the version was created." }
      example:
        id: 018f1a2b-0000-7000-8000-000000000002
        module_id: 018f1a2b-0000-7000-8000-000000000001
        scope: global
        status: PUBLISHED
        bpmn_xml: "<bpmn:definitions>...</bpmn:definitions>"
        process_id: ApprovalChain
        version_number: 1
        is_valid: true
        published_at: "2026-08-20T09:00:00Z"
        created_at: "2026-08-20T08:00:00Z"

    PlanNode:
      type: object
      description: >-
        One human task of a published version's expanded main plan. node_key is
        dsl.NodeKey(department.id, stage), the key the Execution Service accepts
        in override_map.
      required: [node_key, node_id, stage_type, role_level, department, default_user_ids]
      properties:
        node_key:   { type: string, example: "CA_Eng::Process_Review/Review_Task", description: "The node's key: its department id and node id joined by `/`." }
        node_id:    { type: string, example: Review_Task, description: "The BPMN element id of the task." }
        name:       { type: string, example: Review, description: "The task's name. Omitted when the task has none." }
        stage_type: { type: string, example: review, description: "The stage type from the task definition (prep, review, approve, or an unregistered type)." }
        role_level: { type: string, example: reviewer, description: "The department role level the assignee needs: preparator, reviewer or approver." }
        department:
          type: object
          description: >-
            The department the task runs in. A module task's id is call-scoped
            (<call id>::<department>), and its label and iam_department_id are
            those of the lane the call binds it to.
          required: [id, label]
          properties:
            id:                { type: string, example: "CA_Eng::Process_Review", description: "The department's id in the plan." }
            label:             { type: string, example: Engineering, description: "The department's display label (its lane name)." }
            iam_department_id: { type: string, format: uuid, description: "The IAM department the task runs in. Omitted when the plan names none." }
        default_user_ids:
          type: array
          description: The users the version assigns when the start request names none for this node. An empty array when there are none.
          items: { type: string, format: uuid }

    PlanWait:
      type: object
      description: >-
        A receive task or message boundary of the expanded main plan that no send
        task of the plan feeds: only an outside party's answer completes it. key
        is what the Execution Service takes that answer by.
      required: [key, kind, message]
      properties:
        key:
          type: string
          description: >-
            A receive task's node key, or a message boundary's host and boundary id
            joined by "#" (the host stage's node key, or the id of the subprocess or
            call the boundary is attached to).
          example: "Ops/Prepare#Boundary_Withdraw"
        kind:    { type: string, enum: [receive_task, message_boundary], description: "Whether the wait is a receive task or a message boundary event." }
        message: { type: string, description: "The BPMN message name, for display.", example: withdraw }

    VersionNodes:
      type: object
      description: The human tasks and outside waits of a published version's expanded main plan.
      required: [workflow_id, version_id, version_number, nodes, waits]
      properties:
        workflow_id:    { type: string, format: uuid, description: "The workflow." }
        version_id:     { type: string, format: uuid, description: "The version read." }
        version_number: { type: integer, format: int32, description: "The version's number." }
        nodes:
          type: array
          description: Every human task of the expanded main plan, module tasks included, in plan order. An empty array when there is none.
          items: { $ref: '#/components/schemas/PlanNode' }
        waits:
          type: array
          description: The outside waits of the expanded main plan, in plan order. An empty array when there is none.
          items: { $ref: '#/components/schemas/PlanWait' }
      example:
        workflow_id: 8fa88cde-824c-47bc-836b-665cd42c2222
        version_id: 11abcc22-3844-42bc-938b-665cd42c1111
        version_number: 2
        nodes:
          - node_key: "Engineering/Review_Task"
            node_id: Review_Task
            name: Review
            stage_type: review
            role_level: reviewer
            department: { id: Engineering, label: Engineering, iam_department_id: 0198c0a2-5b1e-7c3d-8a11-2f4e6d9b7a10 }
            default_user_ids: [018f2d3c-0000-7000-8000-0000000000a1]
        waits:
          - key: "Engineering/Prepare#Boundary_Withdraw"
            kind: message_boundary
            message: withdraw

    ModuleSlot:
      type: object
      description: >-
        One of the module's own departments. id is its lane's name, the key a
        call's Depts maps. An open slot has no dept_id and a call binds it; a
        fixed slot carries its IAM department. A laneless module has one open
        slot, named by its process id.
      required: [id, label, open]
      properties:
        id:                { type: string, example: Author, description: "The slot's id: its lane's name, or the process id for a laneless module." }
        label:             { type: string, example: Author, description: "The slot's display label." }
        open:              { type: boolean, description: "True when the slot has no IAM department and a call must bind it." }
        iam_department_id: { type: string, format: uuid, description: "Set on a fixed slot; omitted on an open one." }

    ModuleTask:
      type: object
      description: >-
        One human task the module runs, its called modules' included.
        assignee_key is the key a call's Assignees takes: the task id, or the ids
        of the calls leading to it and then its own, joined by "::".
      required: [assignee_key, node_id, stage_type, role_level, default_user_ids]
      properties:
        assignee_key: { type: string, example: "Pkg_Check::Check_Task", description: "The key a call's Assignees input takes for this task." }
        node_id:      { type: string, example: Check_Task, description: "The BPMN element id of the task." }
        name:         { type: string, example: Check, description: "The task's name. Omitted when the task has none." }
        slot:
          type: string
          description: The module's own slot the task runs in. Omitted for a task in a called module's fixed lane.
          example: Author
        iam_department_id:
          type: string
          format: uuid
          description: Set for a task in a called module's fixed lane, which no call can rebind.
        stage_type: { type: string, example: review, description: "The stage type from the task definition." }
        role_level: { type: string, example: checker, description: "The task's candidateGroups role level." }
        default_user_ids:
          type: array
          description: The task's own default users. An empty array when there are none.
          items: { type: string, format: uuid }

    ModuleContract:
      type: object
      description: What a call of a module version binds and names.
      required: [module_id, version_id, process_id, slots, tasks, messages, error_codes, names_users]
      properties:
        module_id:      { type: string, format: uuid, description: "The module." }
        version_id:     { type: string, format: uuid, description: "The module version compiled." }
        process_id:     { type: string, example: Process_Package, description: "The module's process id." }
        version_number: { type: integer, format: int32, description: Omitted for a DRAFT. }
        slots:
          type: array
          description: The module's own departments, in lane order. An empty array when there is none.
          items: { $ref: '#/components/schemas/ModuleSlot' }
        tasks:
          type: array
          description: Every human task the module runs, its called modules' included. An empty array when there is none.
          items: { $ref: '#/components/schemas/ModuleTask' }
        messages:
          type: array
          description: Names of the bpmn:message elements of the module and its called modules, deduplicated and sorted.
          items: { type: string }
        error_codes:
          type: array
          description: Codes of the bpmn:error elements of the module and its called modules, deduplicated and sorted.
          items: { type: string }
        names_users:
          type: boolean
          description: Whether any task has a default user. A global module never names one.
      example:
        module_id: 018f1a2b-0000-7000-8000-000000000001
        version_id: 018f1a2b-0000-7000-8000-000000000002
        process_id: Process_Package
        version_number: 1
        slots:
          - { id: Author, label: Author, open: true }
        tasks:
          - assignee_key: Check_Task
            node_id: Check_Task
            name: Check
            slot: Author
            stage_type: review
            role_level: reviewer
            default_user_ids: []
        messages: [withdraw]
        error_codes: [REJECTED]
        names_users: false

    ModuleRef:
      type: object
      description: A library module version a workflow version holds a snapshot of.
      required: [module_id, version_id, process_id, version_number]
      properties:
        module_id:      { type: string, format: uuid, description: "The module." }
        version_id:     { type: string, format: uuid, description: "The module version resolved at publish." }
        process_id:     { type: string, description: "The module's process id, as the calling callActivity names it." }
        version_number: { type: integer, description: "The module version's number." }

    ModuleUsage:
      type: object
      description: A workflow version of the caller's tenant whose module_refs include the module.
      properties:
        workflow_id:           { type: string, format: uuid, description: "The workflow." }
        workflow_key:          { type: string, description: "The workflow's template key." }
        workflow_name:         { type: string, description: "The workflow's name." }
        version_id:            { type: string, format: uuid, description: "The workflow version holding the snapshot." }
        version_number:        { type: integer, nullable: true, description: "The workflow version's number; always sent, null only for a version without one." }
        status:                { $ref: '#/components/schemas/VersionStatus' }
        module_version_number: { type: integer, description: "The module version this workflow version holds a snapshot of." }
        behind:                { type: boolean, description: "True when the module's active version is newer." }
      example:
        workflow_id: 8fa88cde-824c-47bc-836b-665cd42c2222
        workflow_key: tender-review
        workflow_name: Tender Document Review Process
        version_id: 11abcc22-3844-42bc-938b-665cd42c1111
        version_number: 3
        status: PUBLISHED
        module_version_number: 1
        behind: true

    ModuleDetail:
      description: A module with its active version.
      allOf:
        - $ref: '#/components/schemas/ModuleSummary'
        - type: object
          properties:
            active_version:
              allOf: [{ $ref: '#/components/schemas/ModuleVersion' }]
              nullable: true
              description: The active version with its BPMN. Omitted (never null) when the module has no active version.

    StarterTemplate:
      type: object
      description: A starter template, a BPMN document a workflow can be created from.
      properties:
        id:                          { type: string, format: uuid, description: "The starter id." }
        tenant_id:                   { type: string, format: uuid, nullable: true, description: "The owning tenant. Omitted (never null) for a global starter." }
        scope:                       { $ref: '#/components/schemas/CatalogScope' }
        name:                        { type: string, description: "The starter name, as sent." }
        description:                 { type: string, description: "The starter description; an empty string when none was given." }
        category:                    { type: string, description: "A free-form category used by the list filter. Omitted when empty." }
        bpmn_xml:                    { type: string, description: "The starter's BPMN 2.0 XML." }
        source_workflow_version_id:
          type: string
          format: uuid
          nullable: true
          description: Informational only — the content is copied at creation time, not linked. Omitted (never null) for a starter created from raw BPMN.
        created_at:                  { type: string, format: date-time, description: "When the starter was created, as stored." }
        updated_at:                  { type: string, format: date-time, description: "When the starter last changed, as stored." }
      example:
        id: 018f1a2b-0000-7000-8000-000000000003
        tenant_id: null
        scope: global
        name: Standard Onboarding
        description: Starting point for a new-hire onboarding workflow
        category: hr
        bpmn_xml: "<bpmn:definitions>...</bpmn:definitions>"
        created_at: "2026-08-20T08:00:00Z"
        updated_at: "2026-08-20T08:00:00Z"

    StageDef:
      type: object
      required: [type, activity, role]
      properties:
        type:
          type: string
          description: >
            Stage type sourced from zeebe:taskDefinition on the BPMN element.
            Built-in values: prep, review, approve (userTask); send_task, receive_task (sendTask/receiveTask).
            Unknown types are forwarded as passthrough with engine_note set.
        activity:            { type: string, description: "The engine activity that runs the stage: the registered stage class's activity name, the stage type for an unregistered type, or the task name (falling back to the connector type) for a connector stage." }
        role:
          type: string
          description: "One of the department role levels preparator, reviewer or approver, passed as 'required_level' to the Org & Membership eligibility read at publish time. Sourced from zeebe:assignmentDefinition candidateGroups."
        default_assignees:
          type: array
          nullable: true
          items: { type: string, format: uuid }
          minItems: 1
          description: "Default assignee UUID(s). Sourced from zeebe:assignmentDefinition candidateUsers. Omitted when assignment is not set — optional for send_task/receive_task stage types."
        is_zeebe_user_task:
          type: boolean
          description: "true when the userTask carries a bare <zeebe:userTask/> marker extension element (no taskDefinition/assignmentDefinition required in that case). Omitted (false) otherwise."
        node_id:
          type: string
          description: "Stable BPMN element ID (e.g. 'Activity_0abc123'). Suitable for machine-addressable routing."
        name:
          type: string
          description: "The BPMN task's name, for display. Omitted when the task has none."
        due_date:
          type: string
          nullable: true
          description: "RFC 3339 datetime for the task due date, the only form the validator accepts. Sourced from zeebe:taskSchedule dueDate. Absent when not set in BPMN."
        follow_up_date:
          type: string
          nullable: true
          description: "RFC 3339 datetime for the task follow-up date, the only form the validator accepts. Sourced from zeebe:taskSchedule followUpDate. Absent when not set in BPMN."
        extras:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: "Forward of every zeebe:property from the BPMN task, unmodified — the compiler does not special-case any property name. Also carries 'message' for send_task/receive_task stage types."
        engine_note:
          type: string
          nullable: true
          description: "Advisory note set when stage type is not a registered engine class (IAM-owned passthrough). Absent for known types."
        connector_type:
          type: string
          description: "The connector a connector stage runs, from zeebe:taskDefinition type connector:<name>. Set only on a connector stage."
        io_mapping:
          allOf: [{ $ref: '#/components/schemas/IOMapping' }]
          nullable: true
          description: "Variable input/output declarations of a connector stage."
        boundary_timer:
          type: object
          nullable: true
          description: "SLA deadline from a timer boundary event on the task. Null when no boundary timer is attached."
          properties:
            boundary_id:  { type: string, description: "Stable BPMN element ID of the boundary event." }
            steps:        { type: array, items: { $ref: '#/components/schemas/ExecutionStep' }, description: "The steps the path runs after it fires." }
            duration:     { type: string, description: "ISO 8601 duration (e.g. 'PT48H', 'P3D')." }
            interrupting: { type: boolean, description: "true = task cancelled on fire; false = escalation runs concurrently." }
            target_dept:  { type: string, nullable: true, description: "Department key to route the escalation path to." }
            terminates:   { type: boolean, description: "true = the path reaches an end event before any task, so firing ends the path. Exactly one of target_dept and terminates is set." }
        boundary_message:
          allOf: [{ $ref: '#/components/schemas/MessagePath' }]
          nullable: true
          description: "Correlation info from a message boundary event on the task. Null when no message boundary is attached."
      example:
        type: prep
        activity: PrepActivity
        node_id: Activity_0abc123
        role: preparator
        default_assignees: [018f2d3c-0000-7000-8000-0000000000a1]
        extras: { requires_comment: "false" }
        boundary_timer: { duration: "PT24H", interrupting: false }

    DepartmentDef:
      type: object
      required: [id, label, stages]
      properties:
        id:
          type: string
          description: "Department identifier from the BPMN lane name. Sourced from the lane name attribute; format is owned by the Profile Service."
        label:  { type: string, description: "The department's display label, the lane name." }
        iam_department_id: { type: string, format: uuid, description: "The IAM department that owns the lane's stages." }
        props:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: "Arbitrary key/value pairs forwarded from <zeebe:properties> on the lane element."
        stages:
          type: array
          description: The department's stages, in flow order.
          items: { $ref: '#/components/schemas/StageDef' }
      example:
        id: Tender
        label: Tender
        stages:
          - type: prep
            activity: PrepActivity
            role: bd-agent
            default_assignees: [018e1f2a-0000-7000-8000-000000000001]
            extras: { requires_comment: "false" }
          - type: review
            activity: ReviewActivity
            role: tender-manager
            default_assignees: [018e1f2a-0000-7000-8000-000000000002]
            extras: { requires_comment: "true" }
          - type: approve
            activity: ApproveActivity
            role: tender-director
            default_assignees: [018e1f2a-0000-7000-8000-000000000003]
            extras: { requires_comment: "true" }

    ExecutionStep:
      type: object
      description: One step of a plan's execution; exactly one of its shapes is set.
      properties:
        sequential:
          type: array
          description: Department ids that run one after another.
          items: { type: string }
        parallel:
          type: array
          description: "Each entry is a parallel branch with its own sequential execution steps."
          items:
            $ref: '#/components/schemas/ParallelBranch'
        exclusive:
          type: array
          description: The branches of an exclusive gateway, in flow order; the first whose condition holds is taken.
          items:
            type: object
            required: [condition_expression]
            properties:
              target:
                type: string
                description: >
                  Destination department for a forward branch. Omitted when the branch
                  terminates the workflow (see terminates) or on a revert branch.
              target_stage:
                type: string
                description: 'The type of the target stage, the same value as the stage type: the task definition type of a user task, "connector" for a connector task, "send_task", "receive_task" or "sub_workflow".'
              target_node_id:
                type: string
                description: "Stable BPMN element ID of the forward target. Use this for machine routing instead of target_name."
              target_name:
                type: string
                description: >
                  BPMN element name of the target node. Present when target_stage is
                  "sub_workflow" (disambiguates multiple subworkflows in the same dept)
                  or empty (task has no zeebe:taskDefinition).
              condition_expression: { type: string, description: "The branch condition, one comparison of a result field with a literal; empty for a branch without one." }
              terminates:
                type: boolean
                description: "True when this forward branch leads directly to an end event."
              revert_to_dept:
                type: string
                description: >
                  Set on a guarded-loop revert branch (a back-edge from this exclusive gateway):
                  the department to revert to. Present instead of a populated target.
              revert_to_stage:
                type: string
                description: 'Set with revert_to_dept: the type of the stage to revert to, the same value as the stage type ("connector" for a connector task).'
              revert_to_node_id:
                type: string
                description: "Stable BPMN element ID of the revert target. Use for machine routing."
              revert_to_name:
                type: string
                description: >
                  BPMN element name of the revert target. Present when revert_to_stage
                  is "sub_workflow" or empty, same rules as target_name.
              steps:
                type: array
                description: "The steps the branch runs when it is taken."
                items: { $ref: '#/components/schemas/ExecutionStep' }
        sub_workflow:
          allOf: [{ $ref: '#/components/schemas/SubWorkflowStep' }]
          nullable: true
          description: An embedded subProcess.
        call_plan:
          allOf: [{ $ref: '#/components/schemas/CallPlanStep' }]
          nullable: true
          description: A callActivity of another plan.
        io_mapping:
          allOf: [{ $ref: '#/components/schemas/IOMapping' }]
          nullable: true
          description: "Variable input/output declarations of a callActivity step (call_plan). The Depts and Assignees inputs compile to call_plan, not here."
        extras:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: "The zeebe:properties of a callActivity step (call_plan)."
        message_paths:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/MessagePath' }
          description: "Message boundary events attached to this step."
      example:
        sequential: [design, planning, construction]

    IOMapping:
      type: object
      description: The variable mappings of a connector stage or call.
      properties:
        inputs:
          type: array
          description: Values passed in, from zeebe:input.
          items: { $ref: '#/components/schemas/IOVar' }
        outputs:
          type: array
          description: Values passed back, from zeebe:output.
          items: { $ref: '#/components/schemas/IOVar' }

    IOVar:
      type: object
      required: [source, target]
      properties:
        source: { type: string, description: "FEEL expression or literal variable name from the caller's context." }
        target: { type: string, description: "Variable name in the called process context." }

    ParallelBranch:
      type: object
      required: [dept, steps]
      properties:
        dept:
          type: string
          description: "Lead department ID for this branch."
        steps:
          type: array
          description: The branch's own steps.
          items: { $ref: '#/components/schemas/ExecutionStep' }

    SubWorkflowStep:
      type: object
      description: An embedded subProcess compiled inline.
      required: [name, plan]
      properties:
        node_id:     { type: string, description: "Stable BPMN element ID of the subProcess element." }
        name:        { type: string, description: "The subProcess name." }
        plan:
          type: object
          description: The subProcess body.
          properties:
            steps:
              type: array
              description: The body's steps.
              items: { $ref: '#/components/schemas/ExecutionStep' }
        error_paths:
          type: array
          description: From error boundary events attached to the subProcess.
          items: { $ref: '#/components/schemas/ErrorPath' }
        timer_paths:
          type: array
          description: From timer boundary events attached to the subProcess.
          items: { $ref: '#/components/schemas/TimerPath' }
        message_paths:
          type: array
          items: { $ref: '#/components/schemas/MessagePath' }
          description: "From message boundary events attached to the subProcess."

    CallPlanStep:
      type: object
      description: >
        A callActivity. The called process is compiled once into its own plan in
        CompiledCollaboration.plans; consumers expand the call with dsl.ExpandCalls
        (workflow_models_lib.md §2.6), which clones the called plan's departments into
        the caller as "<node_id>::<department>".
      required: [node_id, plan]
      properties:
        node_id: { type: string, description: "BPMN element ID of the callActivity." }
        name:    { type: string, description: "The callActivity name." }
        plan:    { type: string, description: "Name of the called plan in CompiledCollaboration.plans (its process id)." }
        departments:
          type: object
          additionalProperties: { type: string }
          description: "Called plan department → calling plan department. A called department absent here keeps its own IAM department."
        assignees:
          type: object
          additionalProperties: { type: string, format: uuid }
          description: "A task → its default user for this call only. The key is a called task's node ID, or the node IDs of the calls leading to a task in a nested module, then its node ID, joined by '::' (e.g. Review_Check::Check_Task). An outer call's entry wins over an inner call's."
        error_paths:
          type: array
          description: From error boundary events attached to the callActivity.
          items: { $ref: '#/components/schemas/ErrorPath' }
        timer_paths:
          type: array
          description: From timer boundary events attached to the callActivity.
          items: { $ref: '#/components/schemas/TimerPath' }
        message_paths:
          type: array
          description: From message boundary events attached to the callActivity.
          items: { $ref: '#/components/schemas/MessagePath' }

    ErrorPath:
      type: object
      required: [short_circuit]
      properties:
        boundary_id:  { type: string, description: "Stable BPMN element ID of the boundary event." }
        error_code:   { type: string, nullable: true, description: "BPMN error code that triggers this path. Empty means catch-all." }
        short_circuit: { type: boolean, description: "true = bypass remaining stages and route directly to target_dept." }
        target_dept:  { type: string, nullable: true, description: "Department to route to on this error path." }
        terminates:   { type: boolean, description: "true = the path reaches an end event before any task, so firing ends the path. Exactly one of target_dept and terminates is set." }
        steps:        { type: array, items: { $ref: '#/components/schemas/ExecutionStep' }, description: "The steps the path runs after it fires." }

    TimerPath:
      type: object
      required: [duration, interrupting]
      properties:
        boundary_id:  { type: string, description: "Stable BPMN element ID of the boundary event." }
        duration:     { type: string, description: "ISO 8601 duration string." }
        interrupting: { type: boolean, description: "true = task cancelled on fire; false = escalation runs concurrently." }
        target_dept:  { type: string, nullable: true, description: "Department to route to on this timer path." }
        terminates:   { type: boolean, description: "true = the path reaches an end event before any task, so firing ends the path. Exactly one of target_dept and terminates is set." }
        steps:        { type: array, items: { $ref: '#/components/schemas/ExecutionStep' }, description: "The steps the path runs after it fires." }

    MessagePath:
      type: object
      required: [message_name, interrupting]
      properties:
        boundary_id:  { type: string, description: "Stable BPMN element ID of the boundary event." }
        message_name: { type: string, description: "Resolved message name used for runtime correlation. May be empty if the source BPMN's message flow/messageRef could not be resolved (see MISSING_MESSAGE_DEFINITION warning)." }
        interrupting: { type: boolean, description: "true = host activity cancelled on fire; false = escalation runs concurrently." }
        target_dept:  { type: string, nullable: true, description: "Department to route to on this message path." }
        terminates:   { type: boolean, description: "true = the path reaches an end event before any task, so firing ends the path. Exactly one of target_dept and terminates is set." }
        steps:        { type: array, items: { $ref: '#/components/schemas/ExecutionStep' }, description: "The steps the path runs after it fires." }

    CompiledCollaboration:
      type: object
      description: "The stored compiled_plan_json: the document's one runnable pool as the main plan, with a plan for each process it calls."
      required: [main_plan, plans, schema_version]
      properties:
        main_plan:      { type: string, description: "Name of the plan in `plans` that an instance starts." }
        plans:
          type: array
          description: The main plan and one plan per process it calls, each compiled once.
          items: { $ref: '#/components/schemas/CompiledPlan' }
        schema_version: { type: integer, description: "DSL schema major version, stamped at publish." }

    CompiledPlan:
      type: object
      description: One compiled process.
      required: [name, departments, execution]
      properties:
        name:        { type: string, description: "The plan's name, by which main_plan and a call's plan refer to it." }
        task_queue:  { type: string, description: "Temporal task queue." }
        departments:
          type: array
          description: The plan's departments (lane segments) and their stages.
          items: { $ref: '#/components/schemas/DepartmentDef' }
        execution:
          type: object
          description: The plan's control flow.
          properties:
            steps:
              type: array
              description: The steps, in order.
              items: { $ref: '#/components/schemas/ExecutionStep' }
        visual_elements:
          type: array
          nullable: true
          description: "Visual-only BPMN elements (e.g. dataStoreReference) that carry no execution semantics. Informational only."
          items: { $ref: '#/components/schemas/VisualElementDef' }
      example:
        name: Tender Document Review Process
        task_queue: wf-queue-default
        departments:
          - id: Tender
            label: Tender
            stages:
              - { type: prep,    activity: PrepActivity,    role: bd-agent,       default_assignees: [018e1f2a-0000-7000-8000-000000000001], extras: { requires_comment: "false" } }
              - { type: review,  activity: ReviewActivity,  role: tender-manager, default_assignees: [018e1f2a-0000-7000-8000-000000000002], extras: { requires_comment: "true" } }
              - { type: approve, activity: ApproveActivity, role: tender-director, default_assignees: [018e1f2a-0000-7000-8000-000000000003], extras: { requires_comment: "true" } }
          - id: Engineering
            label: Engineering
            stages:
              - { type: prep,    activity: PrepActivity,    role: lead-engineer,  default_assignees: [018e1f2a-0000-7000-8000-000000000010], extras: { requires_comment: "false" }, boundary_timer: { duration: "PT48H", interrupting: false, target_dept: tender } }
        execution:
          steps:
            - sequential: [Tender, Engineering]

    StageChange:
      type: object
      description: A change to one stage.
      properties:
        node_key:    { type: string, description: "Department id and node id of the stage." }
        description: { type: string, description: "What changed: stage added, stage removed, timer boundary changed, message boundary changed, connector type changed, role changed, or (in metadata_changes) due date changed." }
      example:
        node_key: "dept-eng/Task_Review"
        description: "timer boundary changed"

    StepChange:
      type: object
      description: A change to one execution step.
      properties:
        description: { type: string, description: "What changed." }
        before:      { $ref: '#/components/schemas/ExecutionStep' }
        after:       { $ref: '#/components/schemas/ExecutionStep' }
      example:
        description: "Step 1 changed from sequential to parallel"
        before: { sequential: [design, planning] }
        after:  { parallel: [{dept: design, steps: []}, {dept: planning, steps: []}] }

    ConnectorRegistryField:
      type: object
      description: One input or output field of a connector type.
      properties:
        name:        { type: string, description: "The field name a task's zeebe:input or zeebe:output targets." }
        kind:
          type: string
          description: The field's value kind; secret_ref fields come from the tenant's stored credential, never from the task.
          enum: [string, bool, int, float, enum, list, map, any, document_ref, secret_ref, timestamp]
        required:    { type: boolean, description: "Whether a task must set the field." }
        enum_values:
          type: array
          description: The allowed values of an enum field. Omitted when there are none.
          items: { type: string }
        condition:   { type: string, description: "When the field applies, in the registry's own terms. Omitted when always." }
        description: { type: string, description: "Help text for the modeler form. Omitted when empty." }

    GatewayAuthError:
      type: object
      description: >-
        The flat identity-refusal body of earlier versions of the shared HTTP library.
        The current code does not write it: identity refusals are problem documents
        (ProblemDetails, or PlatformProblem for those the library writes). Kept for
        clients that still parse it.
      required: [error, status]
      properties:
        error:      { type: string, example: "missing or invalid authentication headers", description: "The refusal reason." }
        status:     { type: integer, example: 401, description: "The HTTP status." }
        trace_id:   { type: string, description: "The request's trace id." }
        request_id: { type: string, description: "The request id." }

    PlatformProblem:
      type: object
      description: >-
        The problem format of the shared HTTP library (platform-gincommon), used only
        for the responses the library writes itself: a recovered panic (500
        INTERNAL_ERROR, no detail), a request unanswered at the 30-second deadline
        (503, errorCode REQUEST_TIMEOUT), and a repeated identity header or an
        unacceptable x-tenant-roles (401 UNAUTHORIZED). Media type
        application/problem+json. It has errorCode and traceId where ProblemDetails
        has code and trace_id.
      required: [type, title, status]
      properties:
        type:      { type: string, description: "The library's type URI, {base}/platform/{error}, e.g. .../platform/service-unavailable." }
        title:     { type: string, description: "The fixed title of the type." }
        status:    { type: integer, description: "The HTTP status." }
        detail:    { type: string, description: "The explanation, e.g. `Ambiguous x-tenant-id header.`; omitted for an internal error." }
        instance:  { type: string, description: "The request path." }
        traceId:   { type: string, description: "The request's trace id." }
        errorCode: { type: string, description: "UNAUTHORIZED, INTERNAL_ERROR or REQUEST_TIMEOUT." }
        tenantId:  { type: string, description: "The verified tenant, when there is one." }
        timestamp: { type: string, description: "When the problem was written." }
      example:
        type: "https://errors.company.com/platform/service-unavailable"
        title: "Service Unavailable"
        status: 503
        instance: "/api/v1/workflows"
        traceId: "4bf92f3577b34da6a3ce929d0e0e4736"
        errorCode: "REQUEST_TIMEOUT"

    ProblemDetails:
      type: object
      description: >-
        The RFC 9457 problem document (media type application/problem+json) every error
        this service writes carries. Optional members are omitted, never null, when
        they do not apply.
      required: [type, title, status, detail, instance, code]
      properties:
        type:
          type: string
          format: uri
          description: "A URI reference that identifies the problem type: https://api.workflow.platform/errors/ followed by bad-request, unauthorized, forbidden, not-found, conflict, validation-failed (422), payload-too-large, unsupported-media-type, internal-error or service-unavailable, by status."
        title:
          type: string
          description: A short, human-readable summary of the problem type, fixed per code (e.g. "Draft Not Found" for DRAFT_NOT_FOUND).
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem. Request values are not echoed, except that a 422 detail can carry the validation message. A 404 or 409 detail is a fixed text per error code and never carries internal error text.
        instance:
          type: string
          description: The request path, without the query string.
        code:
          type: string
          description: >-
            Service-specific error code for programmatic handling: BAD_REQUEST,
            INVALID_INPUT, INVALID_BPMN_XML, UNAUTHORIZED, FORBIDDEN, PLAN_QUOTA_EXCEEDED,
            NOT_FOUND, DRAFT_NOT_FOUND, DRAFT_ALREADY_EXISTS, NO_ACTIVE_VERSION,
            DUPLICATE_TEMPLATE_KEY, DRAFT_CONCURRENCY, INVALID_VERSION_STATUS,
            ACTIVE_INSTANCES_EXIST, STRUCTURAL_DIVERGENCE, MODULE_PROCESS_ID_CONFLICT,
            MODULE_IN_USE, IDEMPOTENCY_KEY_REPLAY, IDEMPOTENCY_REQUEST_IN_PROGRESS,
            PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, BPMN_VALIDATION_FAILED,
            ASSIGNEE_INELIGIBLE, INTERNAL_ERROR or UPSTREAM_UNAVAILABLE.
        trace_id:
          type: string
          description: The OpenTelemetry trace id of the request, equal to the X-Trace-ID response header. Omitted when there is none.
        request_id:
          type: string
          description: The request id, equal to the X-Request-ID response header. Omitted when there is none.
        current_record_version:
          type: integer
          format: int64
          description: Present on DRAFT_CONCURRENCY. The draft's current record_version, to retry with after reconciling.
        plan_code:
          type: string
          description: Present on PLAN_QUOTA_EXCEEDED. The plan code of the request's x-plan header, trimmed and in lower case; the limit itself comes from the plan table or, per tenant, from Entitlements.
        limit:
          type: integer
          format: int64
          description: Present on PLAN_QUOTA_EXCEEDED. The tenant's workflow template limit; 0 means no workflow may be created.
        current_count:
          type: integer
          format: int64
          description: Present on PLAN_QUOTA_EXCEEDED. The number of workflows the tenant has now.
        uses:
          type: array
          description: Present on MODULE_IN_USE. The published workflow versions and workflow drafts that use the module and must be cleared before it can be archived.
          items:
            type: object
            required: [workflow_id, workflow_key, status]
            properties:
              workflow_id:    { type: string, format: uuid, description: "The workflow that uses the module." }
              workflow_key:   { type: string, description: "The workflow's template key." }
              status:         { type: string, enum: [PUBLISHED, DRAFT], description: "PUBLISHED for a published version holding the module in module_refs; DRAFT for a draft with a call naming its process id." }
              version_number: { type: integer, description: "The workflow version number. Absent when status is DRAFT." }
        invalid_params:
          type: array
          description: >-
            Details about specific fields, parameters or BPMN nodes that failed validation,
            including every request field the endpoint does not define (reason "is not a known
            field"; names match exactly, case included, and a nested field is named by its
            path), up to twenty. On BPMN_VALIDATION_FAILED each entry is one issue.
          items:
            type: object
            required: [name, reason]
            properties:
              name:
                type: string
                description: The JSON field or query parameter name (`body` when the body has the wrong type), or on BPMN_VALIDATION_FAILED the BPMN element id (empty for a document-level issue).
              reason:
                type: string
                description: Why it was refused, e.g. "is required", "is not valid", "has the wrong type", "is not a known field", "must not be blank", "must not exceed 255 characters", "must be an integer between 1 and 100", or the BPMN issue's message.
              code:
                type: string
                description: On BPMN_VALIDATION_FAILED, the BPMN issue code (BpmnErrorCode). Omitted otherwise.
      example:
        type: "https://api.workflow.platform/errors/not-found"
        title: "Resource Not Found"
        status: 404
        detail: "resource not found"
        instance: "/api/v1/workflows/8fa88cde-824c-47bc-836b-665cd42c2222"
        code: "NOT_FOUND"
        trace_id: "4bf92f3577b34da6a3ce929d0e0e4736"
        request_id: "0198c0a2-5b1e-7c3d-8a11-2f4e6d9b7a99"

    VisualElementDef:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, description: "Element type tag (e.g. dataStoreReference)." }
        id:   { type: string, description: "BPMN element ID." }
        name: { type: string, nullable: true, description: "Display name, if set on the element." }

    BpmnValidationSeverity:
      type: string
      description: "Severity of a BPMN validation issue. error = compilation blocked; warning = advisory only, compilation succeeds."
      enum: [error, warning]

    BpmnErrorCode:
      type: string
      description: Machine-readable BPMN validation issue code.
      enum:
        - REJECTED_ELEMENT              # Element on the Tier-3 parser denylist
        - UNSUPPORTED_ELEMENT           # Element type recognised but not supported by this service
        - MISSING_NAMESPACE             # Required bpmn or zeebe namespace missing
        - MISSING_TASK_DEFINITION       # zeebe:taskDefinition absent on a userTask; also raised for a boundary event with no event definition (timer/error/message)
        - MISSING_ASSIGNMENT_DEFINITION # zeebe:assignmentDefinition absent on a userTask
        - INVALID_TASK_DEFINITION_TYPE  # deprecated: superseded by UNKNOWN_STAGE_TYPE (warning)
        - UNKNOWN_STAGE_TYPE            # taskDefinition.type not in the registered StageTypeHandler set; warning severity — compilation continues with passthrough StageDef
        - TASK_NOT_IN_LANE              # userTask not listed in any lane via flowNodeRef
        - CANDIDATE_GROUPS_EMPTY        # candidateGroups absent or exceeds 256 chars
        - CANDIDATE_GROUPS_INVALID      # a userTask candidateGroups is not preparator, reviewer or approver
        - INVALID_CANDIDATE_USER        # candidateUsers is not a UUID v7; in a global module, any candidateUsers or call Assignees at all
        - CANDIDATE_USERS_EMPTY         # a userTask names no user: a warning on a document; an error at publish and /validate for a task of the expanded plan with no default, on the task or the top-level call that runs it
        - INVALID_CONDITION_EXPRESSION  # conditionExpression exceeds 4096 chars
        - INVALID_SLA_DURATION          # timer boundary duration is not valid ISO 8601 or Go duration
        - INVALID_ZEEBE_PROPERTY        # callActivity: malformed Depts/Assignees input, a Depts lane or an Assignees task or call path that does not exist, an Assignees user that is not a UUID v7, or a retired dept_id input
        - MISSING_MESSAGE_DEFINITION    # error severity when a messageFlow's messageRef references an undeclared bpmn:message; warning severity when a message boundary event's or collaboration messageFlow's name cannot be resolved at all
        - UNMATCHED_MESSAGE_FLOW        # message flow source/target does not reference a known element
        - TASK_LIMIT_EXCEEDED           # userTask count > 1000 in the process, a compile making more than 1000 stages or visiting more than 10000 nodes, or more than 1000 stages and calls once its calls are expanded
        - LANE_LIMIT_EXCEEDED           # lane count > 100
        - MULTIPLE_START_EVENTS         # more than one startEvent in the process
        - MULTIPLE_END_EVENTS           # deprecated: not currently raised by the compiler (multiple end events are valid)
        - NO_START_EVENT                # process has no startEvent
        - NO_END_EVENT                  # process has no endEvent
        - DANGLING_NODE                 # node has no incoming or outgoing sequence flow
        - UNREACHABLE_NODE              # node not reachable from startEvent via DFS
        - CYCLE_DETECTED                # Tarjan SCC found a strongly-connected component without a guarded exit
        - UNGUARDED_LOOP                # a back-edge is a self-loop, originates at an exclusive gateway with no forward exit, or originates at a node type that may not source a back-edge
        - UNMATCHED_GATEWAY             # split gateway has no reachable matching join gateway
        - INVALID_SEQUENCE_FLOW_REF     # sequenceFlow references unknown sourceRef or targetRef
        - MULTIPLE_PROCESSES            # more than one process would run: executable, not called, not marked ignore
        - NO_RUNNABLE_PROCESS           # no process would run: every one is marked ignore, not executable, or called
        - MAX_DEPTH_EXCEEDED            # longest forward path exceeds 2000 nodes
        - INVALID_BOUNDARY_ATTACHMENT   # more than one event definition on a boundary event, more than one timer boundary on the same host, an error boundary attached to a host other than subProcess/callActivity, or an unknown errorRef
        - MISSING_DIAGRAM               # bpmndi:BPMNDiagram section absent
        - MISSING_DIAGRAM_SHAPE         # a flow node has no corresponding BPMNShape in the diagram
        - UNRESOLVED_CALLED_ELEMENT     # callActivity missing zeebe:calledElement, naming neither a process in the document nor a callable library module version, or pinning a versionTag of a process id the document also defines
        - NESTED_SUBPROCESS_NOT_SUPPORTED # subProcess nested inside another subProcess
        - MISSING_DEPT_INPUT_FOR_MODULE # a called process has two or more open lanes (no dept_id) and the call's Depts input does not map every one
        - CALLED_ELEMENT_CYCLE          # a chain of callActivity calls returns to a process already on it
        - DUPLICATE_PROCESS_ID          # two bpmn:process elements in the bundled document share an id
        - SPLIT_WITHOUT_GATEWAY         # a start event, task, send or receive task, subProcess, callActivity or boundary event has more than one outgoing flow; a flow splits only at a gateway
        - DUPLICATE_SEQUENCE_FLOW       # a parallel, exclusive or inclusive gateway has two or more flows to the same target
        - END_EVENT_WITH_OUTGOING_FLOW  # an end event has an outgoing flow
        - DUPLICATE_ELEMENT_ID          # two elements of one process share an id
        - INVALID_TASK_SCHEDULE         # a task's dueDate or followUpDate is not an RFC 3339 date-time
        - GATEWAY_BRANCH_WITHOUT_CONDITION # warning: an exclusive split has more than one flow without a conditionExpression, so only the first is ever taken
        - UNSUPPORTED_BOUNDARY_TARGET   # a boundary event's path reaches a callActivity, sendTask or receiveTask before any userTask, subProcess or end event, or a subProcess whose body does not start with a userTask
        - UNSUPPORTED_REVERT_TARGET     # a revert flow leads back to a subProcess or callActivity before any task
        - MISSING_DEPT_ID               # a task's lane has no dept_id; a call binds a module lane to a workflow lane with no dept_id; or, at publish and /validate, the workflow has no lanes or a task of its expanded plan runs in no IAM department
        - INVALID_DEPT_ID               # a lane's dept_id is not a UUID
        - INVALID_LANE_NAME             # a lane's name contains /, :: or ~
        - IGNORED_LANE_WORK             # a lane marked ignore holds a callActivity, subProcess or connector task, a boundary on one of its skipped tasks, or a loop whose way back holds only skipped tasks
        - UNKNOWN_CONNECTOR_TYPE        # warning: a connector serviceTask names a connector type the registry does not know
        - CONNECTOR_TASK_HAS_ASSIGNMENT # warning: a connector serviceTask carries an assignmentDefinition, which it does not use
        - CONNECTOR_SECRET_AUTHORED     # a connector serviceTask input targets a secret field of its connector type; the tenant's stored credential is always used

    BpmnValidationFailure:
      type: object
      description: >
        Returned by POST /validate. is_valid is false when any issue has severity "error";
        true when all issues are warnings (compilation would succeed). The issues array is
        empty on a fully valid document.
      properties:
        is_valid:
          type: boolean
          example: false
          description: False when any issue has severity error.
        issues:
          type: array
          description: Every issue found, errors and warnings, in the validator's order. An empty array when there is none.
          items:
            type: object
            required: [code, message, severity]
            properties:
              code:     { $ref: '#/components/schemas/BpmnErrorCode' }
              severity: { $ref: '#/components/schemas/BpmnValidationSeverity' }
              node_id:
                type: string
                nullable: true
                description: BPMN element ID that caused the issue. Always sent; an empty string (never null) for a document-level issue.
                example: Task_design_prep
              message:
                type: string
                description: Human-readable description of the issue.
                example: "userTask is missing zeebe:taskDefinition"
      example:
        is_valid: false
        issues:
          - code: MISSING_TASK_DEFINITION
            severity: error
            node_id: Task_design_prep
            message: "userTask is missing zeebe:taskDefinition"
          - code: UNKNOWN_STAGE_TYPE
            severity: warning
            node_id: Task_audit_check
            message: "taskDefinition type \"audit\" is not a defined stage class in the workflow engine"

  responses:
    Unauthorized:
      description: >
        UNAUTHORIZED — missing or invalid gateway identity headers. Absent, blank or not a
        UUID: detail `x-tenant-id must be a UUID` or `x-user-id must be a UUID`; an identity
        the database scope refuses: `identity headers are not acceptable`. A repeated
        identity header or an unacceptable `x-tenant-roles` is refused by the shared HTTP
        library in its own problem format (`PlatformProblem`, `errorCode` UNAUTHORIZED). The
        `application/json` `GatewayAuthError` body is not written by the current code.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: "https://api.workflow.platform/errors/unauthorized"
            title: "Unauthorized Access"
            status: 401
            detail: "x-tenant-id must be a UUID"
            instance: "/api/v1/workflows"
            code: "UNAUTHORIZED"
        application/json:
          schema: { $ref: '#/components/schemas/GatewayAuthError' }

    Forbidden:
      description: >-
        FORBIDDEN — the caller lacks the required role: detail `caller lacks
        tenant_admin/tenant_owner role`, or for a global-scope module or starter `caller
        lacks platform_operator role`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: "https://api.workflow.platform/errors/forbidden"
            title: "Forbidden"
            status: 403
            detail: "caller lacks tenant_admin/tenant_owner role"
            instance: "/api/v1/workflows"
            code: "FORBIDDEN"

    MethodNotAllowed:
      description: >-
        METHOD_NOT_ALLOWED — the path exists but not for this method. The `Allow` header
        lists the methods it serves. Answered before authentication, like a 404 for an
        unknown path, so no identity headers are needed to see it. A path with a trailing
        slash is not redirected; it is an unknown path and answers `404 NOT_FOUND`.
      headers:
        Allow:
          description: The methods the path serves, for example `GET, POST`.
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: "https://api.workflow.platform/errors/method-not-allowed"
            title: "Method Not Allowed"
            status: 405
            detail: "the method is not allowed for this path"
            instance: "/api/v1/workflows"
            code: "METHOD_NOT_ALLOWED"

    NotFound:
      description: >-
        NOT_FOUND — the resource does not exist in the caller's tenant, or belongs to
        another tenant or another parent (security through obscurity). The detail is the
        fixed text `resource not found`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: "https://api.workflow.platform/errors/not-found"
            title: "Resource Not Found"
            status: 404
            detail: "resource not found"
            instance: "/api/v1/workflows/8fa88cde-824c-47bc-836b-665cd42c2222"
            code: "NOT_FOUND"

    PayloadTooLarge:
      description: PAYLOAD_TOO_LARGE — the request body exceeds the 10 MiB (10,485,760-byte) limit. Not retryable.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: "https://api.workflow.platform/errors/payload-too-large"
            title: "Payload Too Large"
            status: 413
            detail: "request body exceeds the 10 MB limit"
            instance: "/api/v1/workflows"
            code: "PAYLOAD_TOO_LARGE"

    UnsupportedMediaType:
      description: >-
        UNSUPPORTED_MEDIA_TYPE — a request with a body (any method, a non-zero or unknown
        Content-Length) must carry `Content-Type` application/json, compared without letter
        case and ignoring parameters. A request without a body passes.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: "https://api.workflow.platform/errors/unsupported-media-type"
            title: "Unsupported Media Type"
            status: 415
            detail: "Content-Type must be application/json"
            instance: "/api/v1/workflows"
            code: "UNSUPPORTED_MEDIA_TYPE"

    BadRequest:
      description: >
        Malformed request. BAD_REQUEST: unparseable JSON, a missing, empty or mistyped
        field, an unknown field, a second JSON value, a path id that is not a UUID (detail
        `invalid <name>: not a valid UUID`), or an Idempotency-Key longer than 256 bytes.
        INVALID_INPUT: a page, limit or versions_limit that is not an integer in its range
        (detail `query parameters are invalid`). INVALID_BPMN_XML: BPMN that cannot be
        parsed (not well-formed, a document type or entity declaration, over the token
        limit). Fields and parameters are named in `invalid_params`; values are never echoed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: "https://api.workflow.platform/errors/bad-request"
            title: "Bad Request"
            status: 400
            detail: "Idempotency-Key must be at most 256 bytes"
            instance: "/api/v1/workflows"
            code: "BAD_REQUEST"

    ServiceUnavailable:
      description: >
        UPSTREAM_UNAVAILABLE — a dependency is temporarily unavailable: the database
        (unreachable, out of connections, shut down, a statement cancelled), a transaction
        that lost every serialization retry, the Valkey lock store, the OpenBao secret store,
        the Execution Service, Org & Membership, the catalog's plan table (including a
        missing or unknown x-plan), or Entitlements (including a limit not read within
        the freshness bound) — detail `an upstream dependency is temporarily
        unavailable` — or the request was cancelled or passed its 30-second deadline
        (detail `the request was cancelled or its deadline passed`). A request still
        unanswered at the deadline gets the shared library's 503 (`PlatformProblem`,
        errorCode REQUEST_TIMEOUT). The request changed nothing and is safe to retry.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: "https://api.workflow.platform/errors/service-unavailable"
            title: "Upstream Service Unavailable"
            status: 503
            detail: "an upstream dependency is temporarily unavailable"
            instance: "/api/v1/workflows"
            code: "UPSTREAM_UNAVAILABLE"

    Conflict:
      description: >-
        State conflict; `code` gives the case. On the routes that take an Idempotency-Key:
        IDEMPOTENCY_KEY_REPLAY (detail `idempotency key replay with different payload`) or
        IDEMPOTENCY_REQUEST_IN_PROGRESS (detail `a request with this idempotency key is
        still running`). Each operation lists its other codes.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: "https://api.workflow.platform/errors/conflict"
            title: "Idempotency Key Replay"
            status: 409
            detail: "idempotency key replay with different payload"
            instance: "/api/v1/starters"
            code: "IDEMPOTENCY_KEY_REPLAY"

    UnprocessableEntity:
      description: >-
        The request is well-formed but refused. BPMN_VALIDATION_FAILED (detail `BPMN
        semantic or structural validation failed.`): one `invalid_params` entry per issue,
        name the node id, reason the message, code the BpmnErrorCode. INVALID_INPUT: a text
        field over its limit, containing a NUL character or (where required) only
        whitespace, or a scope other than tenant or global. ASSIGNEE_INELIGIBLE (publish
        only): a default assignee is not an eligible member.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: "https://api.workflow.platform/errors/validation-failed"
            title: "BPMN Validation Failed"
            status: 422
            detail: "BPMN semantic or structural validation failed."
            instance: "/api/v1/workflows/8fa88cde-824c-47bc-836b-665cd42c2222/versions/11abcc22-3844-42bc-938b-665cd42c1111/publish"
            code: "BPMN_VALIDATION_FAILED"
            invalid_params:
              - name: Task_design_prep
                reason: "userTask is missing zeebe:taskDefinition"
                code: MISSING_TASK_DEFINITION
              - name: Gateway_parallel_split
                reason: "Parallel split gateway has no reachable matching join gateway"
                code: UNMATCHED_GATEWAY

    InternalError:
      description: >-
        INTERNAL_ERROR — unexpected server error (detail `an unexpected error occurred`, or
        `missing request context` for a misconfigured route). A recovered panic is answered
        by the shared library in its own format (`PlatformProblem`, no detail).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: "https://api.workflow.platform/errors/internal-error"
            title: "Internal Server Error"
            status: 500
            detail: "an unexpected error occurred"
            instance: "/api/v1/workflows"
            code: "INTERNAL_ERROR"

paths:

  # 3.1 / 3.2
  /api/v1/workflows:
    get:
      operationId: listWorkflows
      summary: List tenant workflows
      description: |
        Lists the caller's tenant's workflows, newest first (created_at, then id,
        descending). Filters combine with AND. An empty filter value is the same as
        no filter; a repeated parameter uses its first value.

        Responses:
        - `200` — the page; an empty `workflows` array past the last page.
        - `400 INVALID_INPUT` — page or limit is not an integer in its range (`invalid_params` names it).
        - `401 UNAUTHORIZED` — identity headers.
        - `415 UNSUPPORTED_MEDIA_TYPE` — a body that is not JSON.
        - `500 INTERNAL_ERROR`.
        - `503 UPSTREAM_UNAVAILABLE` — database outage or deadline.
      tags: [Workflows]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/Departments'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/FeatureFlags'
        - in: query
          name: page
          description: 1-based page number. Not an integer from 1 to 100000 is 400 INVALID_INPUT.
          schema: { type: integer, default: 1, minimum: 1, maximum: 100000 }
        - in: query
          name: limit
          description: Page size. Not an integer from 1 to 100 is 400 INVALID_INPUT.
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - in: query
          name: search
          schema: { type: string }
          description: Case-insensitive substring match on the name; `%` and `_` match themselves.
        - in: query
          name: key
          schema: { type: string }
          description: Exact template key match, letter case included.
        - in: query
          name: is_valid
          schema: { type: boolean }
          description: >
            Filter on `workflow_version.is_valid` of the active version
            (`workflow.active_version_id → workflow_version.id`).
            `is_valid` is set to `false` when a `DepartmentMembershipRevoked` or
            `MembershipRevoked` event invalidates an assignee in a published version,
            preventing new workflow instances until reassignment. Workflows with no active
            version (`active_version_id IS NULL`) are excluded when this filter is set
            because there is no active version to evaluate. Only the exact lower-case values
            `true` and `false` are accepted; any other non-empty value (`yes`, `TRUE`, `1`) is
            400 INVALID_INPUT naming `is_valid` in `invalid_params`. An empty value is the same
            as leaving the filter out.
        - in: query
          name: status
          schema:
            type: string
            enum: [active, archived]
          description: Filter active (active_version_id IS NOT NULL) or archived (active_version_id IS NULL) workflows. Only the exact lower-case values `active` and `archived` are accepted; any other non-empty value (`ARCHIVED`, `deleted`) is 400 INVALID_INPUT naming `status` in `invalid_params`. An empty value is the same as leaving the filter out.
        - in: query
          name: has_draft
          schema: { type: boolean }
          description: Filter workflows that have (true) or do not have (false) an unpublished DRAFT version. Only the exact lower-case values `true` and `false` are accepted; any other non-empty value is 400 INVALID_INPUT naming `has_draft` in `invalid_params`. An empty value is the same as leaving the filter out.
      responses:
        "200":
          description: Paginated workflow list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflows:
                    type: array
                    description: The page's workflows; an empty array when none match.
                    items: { $ref: '#/components/schemas/WorkflowSummary' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
              example:
                workflows:
                  - id: 7ca648b2-b432-4744-884c-35fd556a310c
                    key: tender-review
                    name: Tender Document Review Process
                    description: Standard review process for tender proposal documents
                    active_version_id: 8fa88cde-824c-47bc-836b-665cd42c2222
                    active_version_number: 3
                    has_draft: true
                    created_at: "2026-05-10T08:00:00Z"
                    updated_at: "2026-05-18T12:30:00Z"
                pagination: { total_count: 1, page: 1, limit: 20 }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

    post:
      operationId: createWorkflow
      summary: Create workflow definition (first draft)
      description: |
        Creates a workflow and its first DRAFT version from the BPMN. The BPMN is
        validated as an authored document (library calls resolved against the library
        as it is now); the publish-only checks run at publish. Then the tenant's workflow
        template limit is read (by `x-plan` from the plan table, or per tenant from
        Entitlements), and the workflow is counted and inserted in
        one transaction. Workflows with a DRAFT or PUBLISHED version count against the
        limit; archived ones do not.

        Responses, in the order the checks run:
        - `201` — created.
        - `403 FORBIDDEN` — no tenant_admin or tenant_owner role.
        - `400 BAD_REQUEST` — Idempotency-Key over 256 bytes; malformed body, unknown field, or key, name or bpmn_xml missing or empty.
        - `409 IDEMPOTENCY_KEY_REPLAY`, `IDEMPOTENCY_REQUEST_IN_PROGRESS`.
        - `413 PAYLOAD_TOO_LARGE`.
        - `422 INVALID_INPUT` — key or name only whitespace, a field over its limit, or a NUL character.
        - `400 INVALID_BPMN_XML` — the BPMN cannot be parsed.
        - `422 BPMN_VALIDATION_FAILED` — the BPMN has an error-severity issue; `invalid_params` lists every issue found, warnings included.
        - `503 UPSTREAM_UNAVAILABLE` — missing or unknown x-plan, catalog, Entitlements, module lookups or database.
        - `403 PLAN_QUOTA_EXCEEDED` — the tenant is at its template limit; carries plan_code, limit and current_count.
        - `409 DUPLICATE_TEMPLATE_KEY` — the key is taken in this tenant.
        - `401 UNAUTHORIZED`, `415 UNSUPPORTED_MEDIA_TYPE`, `500 INTERNAL_ERROR` — as for every operation.
      tags: [Workflows]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/Departments'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/FeatureFlags'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key, name, bpmn_xml]
              properties:
                key:
                  type: string
                  maxLength: 255
                  description: Unique template key for this workflow within the tenant, free-form, letter case significant. Immutable after creation. Empty is 400 BAD_REQUEST; only whitespace, over 255 characters or a NUL character is 422 INVALID_INPUT; stored as sent.
                  example: tender-review
                name:
                  type: string
                  maxLength: 255
                  description: The workflow name. Empty is 400 BAD_REQUEST; only whitespace, over 255 characters or a NUL character is 422 INVALID_INPUT; stored as sent.
                  example: Tender Document Review Process
                description:
                  type: string
                  maxLength: 2000
                  description: Optional description; over 2000 characters or a NUL character is 422 INVALID_INPUT. Omitted is stored as empty.
                  example: Standard review process for tender proposal documents
                bpmn_xml:
                  type: string
                  description: Raw BPMN 2.0 XML string. The request body is limited to 10 MB (413 above it). Empty is 400 BAD_REQUEST; XML that cannot be parsed is 400 INVALID_BPMN_XML; a document with error-severity issues (a missing bpmn or zeebe namespace among them) is 422 BPMN_VALIDATION_FAILED.
                  example: "<bpmn:definitions xmlns:bpmn=\"http://www.omg.org/spec/BPMN/20100524/MODEL\" xmlns:zeebe=\"http://camunda.org/schema/zeebe/1.0\">...</bpmn:definitions>"
            example:
              key: tender-review
              name: Tender Document Review Process
              description: Standard review process for tender proposal documents
              bpmn_xml: "<bpmn:definitions xmlns:bpmn=\"http://www.omg.org/spec/BPMN/20100524/MODEL\" xmlns:zeebe=\"http://camunda.org/schema/zeebe/1.0\">...</bpmn:definitions>"
      responses:
        "201":
          description: Workflow and initial draft created. version_number is always null (a DRAFT); message is `Workflow created`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowWriteResult' }
              example:
                workflow_id: 7ca648b2-b432-4744-884c-35fd556a310c
                version_id: 11abcc22-3844-42bc-938b-665cd42c1111
                status: DRAFT
                version_number: null
                message: Workflow created
        "400":
          description: >-
            BAD_REQUEST — malformed body, unknown field, a missing or empty key, name or
            bpmn_xml (named in invalid_params), or an Idempotency-Key over 256 bytes.
            INVALID_BPMN_XML — the BPMN could not be parsed (detail `the BPMN document could
            not be parsed`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/bad-request"
                title: "Bad Request"
                status: 400
                detail: "request body has missing or invalid fields"
                instance: "/api/v1/workflows"
                code: "BAD_REQUEST"
                invalid_params:
                  - { name: bpmn_xml, reason: "is required" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403":
          description: Caller lacks the required role, or the tenant has reached the workflow template limit of its plan (PLAN_QUOTA_EXCEEDED, which also carries plan_code, limit and current_count).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/forbidden"
                title: "Plan Quota Exceeded"
                status: 403
                detail: "the workflow template limit of the plan has been reached; archive a workflow that is no longer used or move to a larger plan"
                instance: "/api/v1/workflows"
                code: "PLAN_QUOTA_EXCEEDED"
                plan_code: "starter"
                limit: 5
                current_count: 5
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "409":
          description: DUPLICATE_TEMPLATE_KEY — the template key already exists for this tenant. IDEMPOTENCY_KEY_REPLAY or IDEMPOTENCY_REQUEST_IN_PROGRESS — see Idempotency-Key.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/conflict"
                title: "Duplicate Template Key"
                status: 409
                detail: "a workflow with this key already exists"
                instance: "/api/v1/workflows"
                code: "DUPLICATE_TEMPLATE_KEY"
        "413": { $ref: '#/components/responses/PayloadTooLarge' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "422": { $ref: '#/components/responses/UnprocessableEntity' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  # must come before /workflows/{id} to avoid route shadowing
  /api/v1/workflows/validate:
    post:
      operationId: validateBpmn
      summary: Validate BPMN without persisting
      description: |
        Validates the BPMN as publish would, the publish-only checks included, with
        library calls resolved against the library as it is now. Writes nothing. Needs
        no admin role and takes no Idempotency-Key. Issues are answered in the body,
        not as an error status.

        Responses:
        - `200` — the result; `is_valid` false when any issue is an error.
        - `400 BAD_REQUEST` — malformed body, unknown field, bpmn_xml missing or empty.
        - `400 INVALID_BPMN_XML` — the XML cannot be parsed (not well-formed, a document type or entity declaration, over the token limit).
        - `401 UNAUTHORIZED`; `413 PAYLOAD_TOO_LARGE`; `415 UNSUPPORTED_MEDIA_TYPE`; `500 INTERNAL_ERROR`.
        - `503 UPSTREAM_UNAVAILABLE` — module lookups (database) or deadline.
      tags: [Validation]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/Departments'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/FeatureFlags'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bpmn_xml]
              properties:
                bpmn_xml:
                  type: string
                  description: Raw BPMN 2.0 XML. The request body is limited to 10 MB (413 above it). Empty is 400 BAD_REQUEST; XML that cannot be parsed is 400 INVALID_BPMN_XML; a missing bpmn or zeebe namespace is a MISSING_NAMESPACE issue in the 200 body.
                  example: "<bpmn:definitions xmlns:bpmn=\"http://www.omg.org/spec/BPMN/20100524/MODEL\" xmlns:zeebe=\"http://camunda.org/schema/zeebe/1.0\">...</bpmn:definitions>"
            example:
              bpmn_xml: "<bpmn:definitions xmlns:bpmn=\"http://www.omg.org/spec/BPMN/20100524/MODEL\" xmlns:zeebe=\"http://camunda.org/schema/zeebe/1.0\">...</bpmn:definitions>"
      responses:
        "200":
          description: BPMN validation results (valid status and potential errors list).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BpmnValidationFailure' }
        "400":
          description: >-
            BAD_REQUEST — malformed body, unknown field, bpmn_xml missing or empty.
            INVALID_BPMN_XML — the XML cannot be parsed (detail `the BPMN document could not be parsed`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/bad-request"
                title: "Invalid BPMN XML"
                status: 400
                detail: "the BPMN document could not be parsed"
                instance: "/api/v1/workflows/validate"
                code: "INVALID_BPMN_XML"
        "401": { $ref: '#/components/responses/Unauthorized' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "413": { $ref: '#/components/responses/PayloadTooLarge' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  # 3.3
  /api/v1/workflows/{id}:
    get:
      operationId: getWorkflow
      summary: Get workflow root and version history
      description: |
        Returns the workflow and its newest versions (created_at, then id, descending),
        at most versions_limit of them.

        Responses:
        - `200` — the workflow.
        - `400 BAD_REQUEST` — id is not a UUID; `400 INVALID_INPUT` — versions_limit is not an integer from 1 to 100.
        - `401 UNAUTHORIZED`; `415 UNSUPPORTED_MEDIA_TYPE`; `500 INTERNAL_ERROR`.
        - `404 NOT_FOUND` — no such workflow in the tenant.
        - `503 UPSTREAM_UNAVAILABLE` — database outage or deadline.
      tags: [Workflows]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/Departments'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/FeatureFlags'
        - $ref: '#/components/parameters/WorkflowId'
        - in: query
          name: versions_limit
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
          description: Max number of versions returned inline in the versions array. Not an integer from 1 to 100 is 400 INVALID_INPUT.
      responses:
        "200":
          description: Workflow detail with version list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:               { type: string, format: uuid, description: "The workflow id." }
                  key:              { type: string, description: "The template key." }
                  name:             { type: string, description: "The workflow name." }
                  description:      { type: string, description: "The workflow description; an empty string when none." }
                  active_version_id: { type: string, format: uuid, nullable: true, description: "The active PUBLISHED version. Omitted (never null) when there is none." }
                  active_version_number: { type: integer, nullable: true, description: "The active version's number. Omitted (never null) when there is no active version." }
                  created_at:       { type: string, format: date-time, description: "When the workflow was created." }
                  updated_at:       { type: string, format: date-time, description: "When the workflow record last changed." }
                  has_draft:        { type: boolean, description: "Whether the workflow has a DRAFT version." }
                  versions:
                    type: array
                    description: The newest versions, at most versions_limit, newest first.
                    items: { $ref: '#/components/schemas/VersionSummary' }
              example:
                id: 7ca648b2-b432-4744-884c-35fd556a310c
                key: tender-review
                name: Tender Document Review Process
                description: Standard review process for tender proposal documents
                active_version_id: 8fa88cde-824c-47bc-836b-665cd42c2222
                active_version_number: 2
                created_at: "2026-05-10T08:00:00Z"
                updated_at: "2026-05-18T12:30:00Z"
                has_draft: true
                versions:
                  - id: 11abcc22-3844-42bc-938b-665cd42c1111
                    status: DRAFT
                    is_valid: true
                    created_by_user_id: 4da18bde-7244-47ac-986c-665cd42caaaa
                    created_at: "2026-05-18T12:00:00Z"
                  - id: 8fa88cde-824c-47bc-836b-665cd42c2222
                    version_number: 2
                    status: PUBLISHED
                    is_valid: true
                    created_by_user_id: 4da18bde-7244-47ac-986c-665cd42caaaa
                    published_at: "2026-05-14T09:00:00Z"
                    created_at: "2026-05-13T15:20:00Z"
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/workflows/{id}/versions:
    get:
      operationId: listWorkflowVersions
      summary: Get paginated version history of a workflow
      description: |
        Lists the workflow's versions, newest first (created_at, then id, descending),
        as summaries without BPMN or plan.

        Responses:
        - `200` — the page; an empty `versions` array past the last page.
        - `400 BAD_REQUEST` — id is not a UUID; `400 INVALID_INPUT` — page or limit out of range.
        - `401 UNAUTHORIZED`; `415 UNSUPPORTED_MEDIA_TYPE`; `500 INTERNAL_ERROR`.
        - `404 NOT_FOUND` — no such workflow in the tenant.
        - `503 UPSTREAM_UNAVAILABLE` — database outage or deadline.
      tags: [Versions]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/Departments'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/FeatureFlags'
        - $ref: '#/components/parameters/WorkflowId'
        - in: query
          name: page
          description: 1-based page number. Not an integer from 1 to 100000 is 400 INVALID_INPUT.
          schema: { type: integer, default: 1, minimum: 1, maximum: 100000 }
        - in: query
          name: limit
          description: Page size. Not an integer from 1 to 100 is 400 INVALID_INPUT.
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Paginated version list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    description: The page's versions, newest first; an empty array past the last page.
                    items: { $ref: '#/components/schemas/VersionSummary' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
              example:
                versions:
                  - id: 8fa88cde-824c-47bc-836b-665cd42c2222
                    version_number: 2
                    status: PUBLISHED
                    is_valid: true
                    created_by_user_id: 4da18bde-7244-47ac-986c-665cd42caaaa
                    published_at: "2026-05-14T09:00:00Z"
                    created_at: "2026-05-13T15:20:00Z"
                pagination: { total_count: 1, page: 1, limit: 20 }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  # 3.5 / 3.9
  /api/v1/workflows/{id}/draft:
    get:
      operationId: getDraft
      summary: Get the active draft version detail for a workflow
      description: |
        Returns the workflow's DRAFT version with its BPMN and record_version, the
        lock token PUT /draft needs.

        Responses:
        - `200` — the draft.
        - `400 BAD_REQUEST` — id is not a UUID.
        - `401 UNAUTHORIZED`; `415 UNSUPPORTED_MEDIA_TYPE`; `500 INTERNAL_ERROR`.
        - `404 DRAFT_NOT_FOUND` — the workflow exists and has no draft; `404 NOT_FOUND` — no such workflow.
        - `503 UPSTREAM_UNAVAILABLE` — database outage or deadline.
      tags: [Drafts]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/Departments'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/FeatureFlags'
        - $ref: '#/components/parameters/WorkflowId'
      responses:
        "200":
          description: Draft version detail. A draft carries no version_number, artifact_hash, compiled_plan_json or published_at, and module_refs is empty.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404":
          description: "DRAFT_NOT_FOUND — the workflow has no draft (detail `no active draft exists`). NOT_FOUND — no such workflow in the tenant."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/not-found"
                title: "Draft Not Found"
                status: 404
                detail: "no active draft exists"
                instance: "/api/v1/workflows/8fa88cde-824c-47bc-836b-665cd42c2222/draft"
                code: "DRAFT_NOT_FOUND"
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

    post:
      operationId: initDraft
      summary: Initialize a new draft from the active published version
      description: |
        Creates a DRAFT version holding a copy of the active version's BPMN. Takes no
        body.

        Responses:
        - `201` — created; version_number is null, message `Draft initialized`.
        - `403 FORBIDDEN` — no tenant_admin or tenant_owner role.
        - `400 BAD_REQUEST` — Idempotency-Key over 256 bytes, or id is not a UUID.
        - `404 NOT_FOUND` — no such workflow in the tenant.
        - `409 NO_ACTIVE_VERSION` — the workflow has no active version to copy (never published, or archived).
        - `409 DRAFT_ALREADY_EXISTS` — the workflow already has a draft.
        - `409 IDEMPOTENCY_KEY_REPLAY`, `IDEMPOTENCY_REQUEST_IN_PROGRESS`.
        - `401 UNAUTHORIZED`; `415 UNSUPPORTED_MEDIA_TYPE` (a non-JSON body); `500 INTERNAL_ERROR`.
        - `503 UPSTREAM_UNAVAILABLE` — database outage or deadline.
      tags: [Drafts]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/Departments'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/FeatureFlags'
        - $ref: '#/components/parameters/WorkflowId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "201":
          description: Draft created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowWriteResult' }
              example:
                workflow_id: 8fa88cde-824c-47bc-836b-665cd42c2222
                version_id: 11abcc22-3844-42bc-938b-665cd42c1111
                status: DRAFT
                version_number: null
                message: Draft initialized
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "409":
          description: "DRAFT_ALREADY_EXISTS (detail `draft already exists`), NO_ACTIVE_VERSION (detail `no active version`), IDEMPOTENCY_KEY_REPLAY or IDEMPOTENCY_REQUEST_IN_PROGRESS."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/conflict"
                title: "Draft Already Exists"
                status: 409
                detail: "draft already exists"
                instance: "/api/v1/workflows/8fa88cde-824c-47bc-836b-665cd42c2222/draft"
                code: "DRAFT_ALREADY_EXISTS"
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

    put:
      operationId: updateDraft
      summary: Save canvas changes to the active draft
      description: |
        Saves any of name, description and bpmn_xml; a field omitted or null is left
        as it is. Name and description are the workflow's own and apply to it at once.
        Saving new BPMN clears the draft's stored validation errors; nothing beyond
        well-formedness is checked. The save holds a 30-second edit lock on the
        workflow in Valkey and checks the lock token (record_version or If-Match).
        A save that changes nothing returns the record_version the row holds.

        Responses, in the order the checks run:
        - `200` — saved.
        - `403 FORBIDDEN` — no tenant_admin or tenant_owner role.
        - `400 BAD_REQUEST` — Idempotency-Key over 256 bytes; id not a UUID; malformed body, unknown field, a second JSON value.
        - `409 IDEMPOTENCY_KEY_REPLAY`, `IDEMPOTENCY_REQUEST_IN_PROGRESS`.
        - `413 PAYLOAD_TOO_LARGE`.
        - `422 INVALID_INPUT` — a present name of only whitespace (detail `request fields must not be blank`) or over 255 characters, a description over 2000 characters, or a NUL character in either.
        - `400 INVALID_BPMN_XML` — bpmn_xml is not well-formed XML (empty text included), has a document type declaration or is over the token limit.
        - `503 UPSTREAM_UNAVAILABLE` — the lock store (Valkey) or the database is unavailable.
        - `409 DRAFT_CONCURRENCY` — another save holds the edit lock (no current_record_version).
        - `404 NOT_FOUND` — no such workflow; `404 DRAFT_NOT_FOUND` — the workflow has no draft.
        - `400 BAD_REQUEST` — neither a positive record_version nor an integer If-Match (`invalid_params` names record_version).
        - `409 DRAFT_CONCURRENCY` — the token is stale, or another save won the race; carries current_record_version.
        - `401 UNAUTHORIZED`; `415 UNSUPPORTED_MEDIA_TYPE`; `500 INTERNAL_ERROR`.
      tags: [Drafts]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/Departments'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/FeatureFlags'
        - $ref: '#/components/parameters/WorkflowId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: false
          description: The draft's record_version as a plain or double-quoted integer, surrounding spaces ignored. Takes precedence over the record_version body field; a value that is not an integer (a weak validator, `*`, a list) is ignored. One of the two is required. It is part of the idempotency fingerprint.
          schema: { type: string, example: '"3"' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  maxLength: 255
                  description: The workflow's new name. Only whitespace, over 255 characters or a NUL character is 422 INVALID_INPUT, as on create; stored as sent. Omitted or null leaves the stored name unchanged.
                  example: Updated Tender Review Process
                description:
                  type: string
                  maxLength: 2000
                  description: The workflow's new description. Over 2000 characters or a NUL character is 422 INVALID_INPUT. Omitted or null leaves it unchanged.
                  example: Updated standard review process
                bpmn_xml:
                  type: string
                  description: Updated BPMN 2.0 XML. The request body is limited to 10 MB (413 above it). Must be well-formed XML (one root element), with no document type declaration and within the token limit, or the save is 400 INVALID_BPMN_XML; an empty string is refused the same way. Nothing else is checked on save; validation and publish check the BPMN content and its bpmn and zeebe namespaces. Omitted or null leaves the BPMN unchanged.
                record_version:
                  type: integer
                  format: int64
                  description: "Monotonic optimistic-lock counter. Echo the value received in the last GET/PUT response. Required unless the If-Match header is sent; a request with neither, or with zero or a negative value, is 400 BAD_REQUEST. If another update has been applied since you read, the save is DRAFT_CONCURRENCY (409) and the problem carries current_record_version."
                  example: 3
            example:
              name: Updated Tender Review Process
              bpmn_xml: "<bpmn:definitions xmlns:bpmn=\"http://www.omg.org/spec/BPMN/20100524/MODEL\" xmlns:zeebe=\"http://camunda.org/schema/zeebe/1.0\">...</bpmn:definitions>"
              record_version: 3
      responses:
        "200":
          description: Draft updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_id:    { type: string, format: uuid, description: "The workflow." }
                  version_id:     { type: string, format: uuid, description: "The draft version." }
                  status:         { $ref: '#/components/schemas/VersionStatus' }
                  version_number: { type: integer, nullable: true, description: "Always null: a draft has no number." }
                  record_version: { type: integer, format: int64, description: "Updated record_version after the write. Pass this value on the next PUT." }
                  message:        { type: string, description: "Always `Draft updated`." }
              example:
                workflow_id: 8fa88cde-824c-47bc-836b-665cd42c2222
                version_id: 11abcc22-3844-42bc-938b-665cd42c1111
                status: DRAFT
                version_number: null
                record_version: 4
                message: Draft updated
        "400":
          description: >-
            BAD_REQUEST — malformed body, unknown field, a second JSON value, id not a UUID, an
            Idempotency-Key over 256 bytes, or no lock token (detail `request is missing its
            optimistic-lock token`, invalid_params record_version). INVALID_BPMN_XML —
            bpmn_xml is not well-formed (detail `the BPMN document could not be parsed`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/bad-request"
                title: "Bad Request"
                status: 400
                detail: "request is missing its optimistic-lock token"
                instance: "/api/v1/workflows/8fa88cde-824c-47bc-836b-665cd42c2222/draft"
                code: "BAD_REQUEST"
                invalid_params:
                  - { name: record_version, reason: "is required" }

        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404":
          description: Workflow or draft version not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: https://api.workflow.platform/errors/not-found
                title: Not Found
                status: 404
                detail: "no draft found for this workflow"
                instance: /api/v1/workflows/8fa88cde-824c-47bc-836b-665cd42c2222/draft
                code: DRAFT_NOT_FOUND
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "409":
          description: >-
            DRAFT_CONCURRENCY (detail `draft concurrency violation`) — the token is stale or
            another save won the race (current_record_version carries the draft's token), or
            another save holds the edit lock (no current_record_version; retry).
            IDEMPOTENCY_KEY_REPLAY or IDEMPOTENCY_REQUEST_IN_PROGRESS.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/conflict"
                title: "Draft Concurrency Violation"
                status: 409
                detail: "draft concurrency violation"
                instance: "/api/v1/workflows/8fa88cde-824c-47bc-836b-665cd42c2222/draft"
                code: "DRAFT_CONCURRENCY"
                current_record_version: 5
        "422":
          description: INVALID_INPUT — name over 255 or description over 2000 characters, or a NUL character in either; invalid_params names each field.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/validation-failed"
                title: "Invalid Input"
                status: 422
                detail: "request fields exceed maximum length"
                instance: "/api/v1/workflows/8fa88cde-824c-47bc-836b-665cd42c2222/draft"
                code: "INVALID_INPUT"
                invalid_params:
                  - { name: name, reason: "must not exceed 255 characters" }
        "413": { $ref: '#/components/responses/PayloadTooLarge' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

    delete:
      operationId: discardDraft
      summary: Discard and delete the active draft
      description: |
        Deletes the workflow's DRAFT version. The workflow's name and description,
        which draft saves change at once, are not restored. Takes no body.

        Responses:
        - `204` — deleted.
        - `403 FORBIDDEN` — no tenant_admin or tenant_owner role.
        - `400 BAD_REQUEST` — Idempotency-Key over 256 bytes, or id is not a UUID.
        - `404 NOT_FOUND` — no such workflow; `404 DRAFT_NOT_FOUND` — the workflow has no draft.
        - `409 IDEMPOTENCY_KEY_REPLAY`, `IDEMPOTENCY_REQUEST_IN_PROGRESS`.
        - `401 UNAUTHORIZED`; `415 UNSUPPORTED_MEDIA_TYPE` (a non-JSON body); `500 INTERNAL_ERROR`.
        - `503 UPSTREAM_UNAVAILABLE` — database outage or deadline.
      tags: [Drafts]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/Departments'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/FeatureFlags'
        - $ref: '#/components/parameters/WorkflowId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "204":
          description: Draft discarded. No response body.
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404":
          description: Workflow or draft version not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: https://api.workflow.platform/errors/not-found
                title: Not Found
                status: 404
                detail: "no draft found for this workflow"
                instance: /api/v1/workflows/8fa88cde-824c-47bc-836b-665cd42c2222/draft
                code: DRAFT_NOT_FOUND
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "409":
          description: IDEMPOTENCY_KEY_REPLAY or IDEMPOTENCY_REQUEST_IN_PROGRESS.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/conflict"
                title: "Idempotency Request In Progress"
                status: 409
                detail: "a request with this idempotency key is still running"
                instance: "/api/v1/workflows/8fa88cde-824c-47bc-836b-665cd42c2222/draft"
                code: "IDEMPOTENCY_REQUEST_IN_PROGRESS"
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  # 3.8
  /api/v1/workflows/{id}/archive:
    post:
      operationId: archiveWorkflow
      summary: Archive workflow — prevents new execution instances
      description: |
        Archives the workflow's active version and clears the active pointer, after
        asking the Execution Service whether instances are running. The version active
        when the archive commits is the one archived. A DRAFT is kept. Archiving frees
        the workflow's slot in the tenant's template limit unless it still has a draft.
        Takes no body.

        Responses:
        - `200` — archived; status is `ARCHIVED`.
        - `403 FORBIDDEN` — no tenant_admin or tenant_owner role.
        - `400 BAD_REQUEST` — Idempotency-Key over 256 bytes, or id is not a UUID.
        - `404 NOT_FOUND` — no such workflow.
        - `409 NO_ACTIVE_VERSION` — nothing to archive (never published, or already archived).
        - `409 ACTIVE_INSTANCES_EXIST` — the Execution Service reports running instances.
        - `409 IDEMPOTENCY_KEY_REPLAY`, `IDEMPOTENCY_REQUEST_IN_PROGRESS`.
        - `503 UPSTREAM_UNAVAILABLE` — the Execution Service could not be asked, or the database is unavailable.
        - `401 UNAUTHORIZED`; `415 UNSUPPORTED_MEDIA_TYPE` (a non-JSON body); `500 INTERNAL_ERROR`.
      tags: [Workflows]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/Departments'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/FeatureFlags'
        - $ref: '#/components/parameters/WorkflowId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "200":
          description: Workflow archived.
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_id: { type: string, format: uuid, description: "The workflow archived." }
                  status:      { $ref: '#/components/schemas/VersionStatus' }
                  message:     { type: string, description: "Always `Workflow archived successfully`." }
              example:
                workflow_id: 8fa88cde-824c-47bc-836b-665cd42c2222
                status: ARCHIVED
                message: Workflow archived successfully
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "409":
          description: NO_ACTIVE_VERSION (detail `no active version`) — never published or already archived. ACTIVE_INSTANCES_EXIST (detail `active workflow instances exist`). IDEMPOTENCY_KEY_REPLAY or IDEMPOTENCY_REQUEST_IN_PROGRESS.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/conflict"
                title: "Active Instances Exist"
                status: 409
                detail: "active workflow instances exist"
                instance: "/api/v1/workflows/8fa88cde-824c-47bc-836b-665cd42c2222/archive"
                code: "ACTIVE_INSTANCES_EXIST"
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "503":
          description: UPSTREAM_UNAVAILABLE — the Execution Service could not be asked about running instances, or the database is unavailable. Nothing was archived.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/service-unavailable"
                title: "Upstream Service Unavailable"
                status: 503
                detail: "an upstream dependency is temporarily unavailable"
                instance: "/api/v1/workflows/8fa88cde-824c-47bc-836b-665cd42c2222/archive"
                code: "UPSTREAM_UNAVAILABLE"

  # 3.4
  /api/v1/workflows/{id}/versions/{version_id}:
    get:
      operationId: getVersion
      summary: Get version detail including BPMN XML and compiled DSL
      description: |
        Returns one version of the workflow, in any status, with its BPMN and, once
        published, its stored compiled plan (calls not expanded).

        Responses:
        - `200` — the version.
        - `400 BAD_REQUEST` — id or version_id is not a UUID.
        - `401 UNAUTHORIZED`; `415 UNSUPPORTED_MEDIA_TYPE`; `500 INTERNAL_ERROR`.
        - `404 NOT_FOUND` — no such version in the tenant, or it belongs to another workflow.
        - `503 UPSTREAM_UNAVAILABLE` — database outage or deadline.
      tags: [Versions]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/Departments'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/FeatureFlags'
        - $ref: '#/components/parameters/WorkflowId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        "200":
          description: Version detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionDetail' }
              example:
                id: 8fa88cde-824c-47bc-836b-665cd42c2222
                workflow_id: 7ca648b2-b432-4744-884c-35fd556a310c
                version_number: 2
                status: PUBLISHED
                is_valid: true
                bpmn_xml: "<bpmn:definitions>...</bpmn:definitions>"
                module_refs:
                  - module_id: 018f1a2b-0000-7000-8000-000000000001
                    version_id: 018f1a2b-0000-7000-8000-000000000002
                    process_id: ApprovalChain
                    version_number: 1
                artifact_hash: "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
                compiled_plan_json:
                  main_plan: Tender Document Review Process
                  plans:
                    - name: Tender Document Review Process
                      departments:
                        - id: Tender
                          label: Tender
                          stages:
                            - { type: prep, activity: PrepActivity, role: preparator, node_id: Task_Prep }
                      execution:
                        steps:
                          - sequential: [Tender]
                  schema_version: 1
                created_by_user_id: 4da18bde-7244-47ac-986c-665cd42caaaa
                created_at: "2026-05-13T15:20:00Z"
                updated_at: "2026-05-14T09:00:00Z"
                published_at: "2026-05-14T09:00:00Z"
                record_version: 2
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  # 3.7
  /api/v1/workflows/{id}/versions/{version_id}/publish:
    post:
      operationId: publishVersion
      summary: Compile and publish the active draft
      description: |
        Resolves the draft's library calls against the library as it is now, validates
        and compiles it with the publish-only checks, compares it with the active
        version, checks every default assignee with Org & Membership, then in one
        transaction numbers the version, stores the plan, hash, assignees and module
        snapshot, and makes it the active version. The body is optional: no body, an
        empty or whitespace-only body and `{}` all mean force_publish_structural false.

        Responses, in the order the checks run:
        - `200` — published and active.
        - `403 FORBIDDEN` — no tenant_admin or tenant_owner role.
        - `400 BAD_REQUEST` — Idempotency-Key over 256 bytes; an id not a UUID; a malformed body or unknown field.
        - `409 IDEMPOTENCY_KEY_REPLAY`, `IDEMPOTENCY_REQUEST_IN_PROGRESS`.
        - `413 PAYLOAD_TOO_LARGE`.
        - `404 NOT_FOUND` — no such version, or it belongs to another workflow.
        - `409 INVALID_VERSION_STATUS` — the version is not a DRAFT.
        - `400 INVALID_BPMN_XML` — the draft's BPMN cannot be parsed.
        - `422 BPMN_VALIDATION_FAILED` — the draft has error-severity issues, its library calls included.
        - `409 STRUCTURAL_DIVERGENCE` — the plan differs structurally from the active version's (an added or removed stage or a changed required role included), or the active version no longer compiles, and force_publish_structural is false.
        - `422 ASSIGNEE_INELIGIBLE` — a default assignee is not a UUID v7, is named for a role that is not preparator, reviewer or approver, or Org & Membership answers not eligible.
        - `503 UPSTREAM_UNAVAILABLE` — Org & Membership could not answer, module lookups or the database failed, or the deadline passed.
        - `409 DRAFT_CONCURRENCY` — the draft was saved after the publish read it, or another publish took the number; publish again.
        - `401 UNAUTHORIZED`; `415 UNSUPPORTED_MEDIA_TYPE`; `500 INTERNAL_ERROR`.
      tags: [Versions]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/Departments'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/FeatureFlags'
        - $ref: '#/components/parameters/WorkflowId'
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                force_publish_structural:
                  type: boolean
                  default: false
                  description: >-
                    Publish even when the plan differs structurally from the active version's, or the active version no longer compiles.
                    A structural difference is an added or removed department, a changed execution step, an added or removed stage,
                    or a stage whose timer boundary, message boundary, connector type or required role changed. A change of due date
                    alone is not structural. Without this flag a structural difference answers `409 STRUCTURAL_DIVERGENCE`.
                    Ignored when the workflow has no active version.
            example:
              force_publish_structural: true
      responses:
        "200":
          description: Version published.
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_id:    { type: string, format: uuid, description: "The workflow." }
                  version_id:     { type: string, format: uuid, description: "The version published." }
                  status:         { $ref: '#/components/schemas/VersionStatus' }
                  version_number: { type: integer, description: "The number assigned: one more than the workflow's highest." }
                  message:        { type: string, description: "Always `Version published`." }
              example:
                workflow_id: 8fa88cde-824c-47bc-836b-665cd42c2222
                version_id: 11abcc22-3844-42bc-938b-665cd42c1111
                status: PUBLISHED
                version_number: 3
                message: Version published
        "400":
          description: >-
            BAD_REQUEST — malformed body or unknown field, an id that is not a UUID, or an
            Idempotency-Key over 256 bytes. INVALID_BPMN_XML — the draft's BPMN cannot be parsed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/bad-request"
                title: "Bad Request"
                status: 400
                detail: "request body has fields this endpoint does not define"
                instance: "/api/v1/workflows/8fa88cde-824c-47bc-836b-665cd42c2222/versions/11abcc22-3844-42bc-938b-665cd42c1111/publish"
                code: "BAD_REQUEST"
                invalid_params:
                  - { name: force, reason: "is not a known field" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "409":
          description: Structural divergence detected (`STRUCTURAL_DIVERGENCE`; `force_publish_structural` accepts it), the version is not a DRAFT (`INVALID_VERSION_STATUS`), the draft was saved after the publish read it or another publish took the number (`DRAFT_CONCURRENCY`; publish again), or IDEMPOTENCY_KEY_REPLAY or IDEMPOTENCY_REQUEST_IN_PROGRESS.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/conflict"
                title: "Structural Divergence"
                status: 409
                detail: "structural divergence detected"
                instance: "/api/v1/workflows/8fa88cde-824c-47bc-836b-665cd42c2222/versions/11abcc22-3844-42bc-938b-665cd42c1111/publish"
                code: "STRUCTURAL_DIVERGENCE"
        "422": { $ref: '#/components/responses/UnprocessableEntity' }
        "413": { $ref: '#/components/responses/PayloadTooLarge' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503":
          description: UPSTREAM_UNAVAILABLE — Org & Membership could not answer an eligibility check (a 400, 403 or 5xx from it, a transport error, or an answer without the eligible flag), module lookups or the database failed, or the deadline passed. Nothing was published.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/service-unavailable"
                title: "Upstream Service Unavailable"
                status: 503
                detail: "an upstream dependency is temporarily unavailable"
                instance: "/api/v1/workflows/8fa88cde-824c-47bc-836b-665cd42c2222/versions/11abcc22-3844-42bc-938b-665cd42c1111/publish"
                code: "UPSTREAM_UNAVAILABLE"

  # 3.10
  /api/v1/workflows/{id}/versions/{version_id}/clone:
    post:
      operationId: cloneVersion
      summary: Clone a published version into a new workflow key
      description: |
        Creates a new workflow whose first DRAFT holds a copy of the source version's
        BPMN. The source must be PUBLISHED or ARCHIVED. The new workflow counts against
        the tenant's workflow template limit, read as for workflow creation. The BPMN is not
        revalidated here.

        Responses, in the order the checks run:
        - `201` — created; version_number is null, message `Version cloned`.
        - `403 FORBIDDEN` — no tenant_admin or tenant_owner role.
        - `400 BAD_REQUEST` — Idempotency-Key over 256 bytes; an id not a UUID; malformed body, unknown field, or new_key or new_name missing or empty.
        - `409 IDEMPOTENCY_KEY_REPLAY`, `IDEMPOTENCY_REQUEST_IN_PROGRESS`.
        - `413 PAYLOAD_TOO_LARGE`.
        - `422 INVALID_INPUT` — new_key or new_name only whitespace, a field over its limit, or a NUL character.
        - `404 NOT_FOUND` — no such source version, or it belongs to another workflow.
        - `409 INVALID_VERSION_STATUS` — the source is a DRAFT.
        - `503 UPSTREAM_UNAVAILABLE` — missing or unknown x-plan, catalog, Entitlements or database.
        - `403 PLAN_QUOTA_EXCEEDED` — the tenant is at its template limit; carries plan_code, limit and current_count.
        - `409 DUPLICATE_TEMPLATE_KEY` — new_key is taken in this tenant.
        - `401 UNAUTHORIZED`; `415 UNSUPPORTED_MEDIA_TYPE`; `500 INTERNAL_ERROR`.
      tags: [Versions]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/Departments'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/FeatureFlags'
        - $ref: '#/components/parameters/WorkflowId'
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [new_key, new_name]
              properties:
                new_key:
                  type: string
                  maxLength: 255
                  description: New unique template key for the cloned workflow. Must not already exist for this tenant (409 DUPLICATE_TEMPLATE_KEY). Empty is 400 BAD_REQUEST; only whitespace, over 255 characters or a NUL character is 422 INVALID_INPUT; stored as sent.
                  example: tender-review-copy
                new_name:
                  type: string
                  maxLength: 255
                  description: The name of the cloned workflow. Empty is 400 BAD_REQUEST; only whitespace, over 255 characters or a NUL character is 422 INVALID_INPUT; stored as sent.
                  example: "Tender Document Review Process (Cloned)"
                new_description:
                  type: string
                  maxLength: 2000
                  description: Optional description of the cloned workflow; over 2000 characters or a NUL character is 422 INVALID_INPUT.
                  example: Duplicate copy of standard review process
            example:
              new_key: tender-review-copy
              new_name: "Tender Document Review Process (Cloned)"
              new_description: Duplicate copy of standard review process
      responses:
        "201":
          description: New workflow created from clone; the version is its DRAFT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowWriteResult' }
              example:
                workflow_id: 0198c0a2-5b1e-7c3d-8a11-2f4e6d9b7a50
                version_id: 0198c0a2-5b1e-7c3d-8a11-2f4e6d9b7a51
                status: DRAFT
                version_number: null
                message: Version cloned
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403":
          description: Caller lacks the required role, or the tenant has reached the workflow template limit of its plan (PLAN_QUOTA_EXCEEDED, which also carries plan_code, limit and current_count).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/forbidden"
                title: "Plan Quota Exceeded"
                status: 403
                detail: "the workflow template limit of the plan has been reached; archive a workflow that is no longer used or move to a larger plan"
                instance: "/api/v1/workflows/8fa88cde-824c-47bc-836b-665cd42c2222/versions/11abcc22-3844-42bc-938b-665cd42c1111/clone"
                code: "PLAN_QUOTA_EXCEEDED"
                plan_code: "starter"
                limit: 5
                current_count: 5
        "404": { $ref: '#/components/responses/NotFound' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "409":
          description: Template key conflict (cloned key already exists), source version is not PUBLISHED or ARCHIVED, or idempotency key reused with a different payload.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              examples:
                duplicate_key:
                  summary: Cloned key already exists
                  value:
                    type: "https://api.workflow.platform/errors/conflict"
                    title: "Duplicate Template Key"
                    status: 409
                    detail: "a workflow with this key already exists"
                    instance: "/api/v1/workflows/8fa88cde-824c-47bc-836b-665cd42c2222/versions/11abcc22-3844-42bc-938b-665cd42c1111/clone"
                    code: "DUPLICATE_TEMPLATE_KEY"
                invalid_status:
                  summary: Source version is not in PUBLISHED or ARCHIVED status
                  value:
                    type: "https://api.workflow.platform/errors/conflict"
                    title: "Invalid Version Status"
                    status: 409
                    detail: "workflow version is not in PUBLISHED status"
                    instance: "/api/v1/workflows/8fa88cde-824c-47bc-836b-665cd42c2222/versions/11abcc22-3844-42bc-938b-665cd42c1111/clone"
                    code: "INVALID_VERSION_STATUS"
        "422":
          description: INVALID_INPUT — new_key or new_name only whitespace, a field over its limit, or a NUL character; invalid_params names each field.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/validation-failed"
                title: "Invalid Input"
                status: 422
                detail: "request fields must not be blank"
                instance: "/api/v1/workflows/8fa88cde-824c-47bc-836b-665cd42c2222/versions/11abcc22-3844-42bc-938b-665cd42c1111/clone"
                code: "INVALID_INPUT"
                invalid_params:
                  - { name: new_key, reason: "must not be blank" }
        "413": { $ref: '#/components/responses/PayloadTooLarge' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  # 3.11
  /api/v1/workflows/{id}/versions/{version_id}/promote:
    post:
      operationId: promoteVersion
      summary: Promote a published version to active (rollback / rollforward)
      description: |
        Makes a PUBLISHED, valid version the workflow's active version. Promoting the
        version that is already active changes nothing and answers 200. Making a
        published version active on a workflow that has no active version and no draft
        counts that workflow against the tenant's template limit, as a new workflow is,
        and fails with `PLAN_QUOTA_EXCEEDED` at the limit; only then is the limit read.
        Takes no body.

        Responses, in the order the checks run:
        - `200` — the version is active.
        - `403 FORBIDDEN` — no tenant_admin or tenant_owner role.
        - `400 BAD_REQUEST` — Idempotency-Key over 256 bytes, or an id not a UUID.
        - `409 IDEMPOTENCY_KEY_REPLAY`, `IDEMPOTENCY_REQUEST_IN_PROGRESS`.
        - `404 NOT_FOUND` — no such version or workflow, or the version belongs to another workflow.
        - `409 INVALID_VERSION_STATUS` — the version is not PUBLISHED, or a membership revocation marked it invalid.
        - `503 UPSTREAM_UNAVAILABLE` — missing or unknown x-plan (when the limit applies), catalog, Entitlements or database.
        - `403 PLAN_QUOTA_EXCEEDED` — carries plan_code, limit and current_count.
        - `401 UNAUTHORIZED`; `415 UNSUPPORTED_MEDIA_TYPE` (a non-JSON body); `500 INTERNAL_ERROR`.
      tags: [Versions]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/Departments'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/FeatureFlags'
        - $ref: '#/components/parameters/WorkflowId'
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "200":
          description: Version promoted to active.
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_id:       { type: string, format: uuid, description: "The workflow." }
                  active_version_id: { type: string, format: uuid, description: "The version now active; equal to version_id in the path." }
                  version_number:    { type: integer, description: "The active version's number." }
                  message:           { type: string, description: "Always `Version promoted to active`." }
              example:
                workflow_id: 8fa88cde-824c-47bc-836b-665cd42c2222
                active_version_id: 11abcc22-3844-42bc-938b-665cd42c1111
                version_number: 1
                message: Version promoted to active
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403":
          description: Caller lacks the required role, or the tenant has reached the workflow template limit of its plan (PLAN_QUOTA_EXCEEDED, which also carries plan_code, limit and current_count).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/forbidden"
                title: "Plan Quota Exceeded"
                status: 403
                detail: "the workflow template limit of the plan has been reached; archive a workflow that is no longer used or move to a larger plan"
                instance: "/api/v1/workflows/8fa88cde-824c-47bc-836b-665cd42c2222/versions/11abcc22-3844-42bc-938b-665cd42c1111/promote"
                code: "PLAN_QUOTA_EXCEEDED"
                plan_code: "starter"
                limit: 5
                current_count: 5
        "404": { $ref: '#/components/responses/NotFound' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "409":
          description: INVALID_VERSION_STATUS — the version is not PUBLISHED (detail `workflow version is not in PUBLISHED status`) or is marked invalid (detail `invalid version status for this operation`). IDEMPOTENCY_KEY_REPLAY or IDEMPOTENCY_REQUEST_IN_PROGRESS.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/conflict"
                title: "Invalid Version Status"
                status: 409
                detail: "workflow version is not in PUBLISHED status"
                instance: "/api/v1/workflows/8fa88cde-824c-47bc-836b-665cd42c2222/versions/11abcc22-3844-42bc-938b-665cd42c1111/promote"
                code: "INVALID_VERSION_STATUS"
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  # 3.13
  /api/v1/workflows/{id}/versions/{version_id}/validation:
    get:
      operationId: getVersionValidation
      summary: Re-run structural validation against a stored version
      description: >-
        Validates a stored version's own BPMN, in any status, and writes nothing.
        A draft's library calls resolve against the library as it is now; any
        other version's resolve to the module versions in its `module_refs`.
        A validator rule added after a version was published does not
        retroactively invalidate it, so this is how an operator finds a template
        that still holds a defect rather than discovering it when the Execution
        Service refuses to instantiate. The publish-only checks are included.

        Responses: `200` (issues in the body); `400 BAD_REQUEST` (an id not a
        UUID) or `400 INVALID_BPMN_XML` (the stored BPMN cannot be parsed);
        `401 UNAUTHORIZED`; `404 NOT_FOUND` (no such version, or it belongs to
        another workflow); `415 UNSUPPORTED_MEDIA_TYPE`; `500 INTERNAL_ERROR`;
        `503 UPSTREAM_UNAVAILABLE` (module lookups, database or deadline).
      tags: [Versions]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/Departments'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/FeatureFlags'
        - $ref: '#/components/parameters/WorkflowId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        "200":
          description: Validation result for the stored version.
          content:
            application/json:
              schema:
                type: object
                required: [version_id, status, is_valid, issues]
                properties:
                  version_id: { type: string, format: uuid, description: "The version validated." }
                  status:     { type: string, example: PUBLISHED, description: "The version's status: DRAFT, PUBLISHED or ARCHIVED." }
                  is_valid:   { type: boolean, description: "False when any issue is an error. Unrelated to the version's stored is_valid flag." }
                  issues:
                    type: array
                    description: Every issue found, errors and warnings. An empty array when there is none.
                    items:
                      type: object
                      required: [node_id, code, message, severity]
                      properties:
                        node_id:  { type: string, example: Activity_0abc123, description: "The BPMN element id; an empty string for a document-level issue." }
                        code:     { type: string, example: CANDIDATE_USERS_EMPTY, description: "The issue code, one of BpmnErrorCode." }
                        message:  { type: string, description: "What is wrong." }
                        severity: { $ref: '#/components/schemas/BpmnValidationSeverity' }
              example:
                version_id: 11abcc22-3844-42bc-938b-665cd42c1111
                status: PUBLISHED
                is_valid: false
                issues:
                  - node_id: Activity_0abc123
                    code: CANDIDATE_USERS_EMPTY
                    message: "task Engineering/Activity_0abc123 names no default user; name one in its candidateUsers or in the Assignees of a call that runs it, since a published workflow gives every task a default"
                    severity: error
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/workflows/{id}/versions/{version_id}/nodes:
    get:
      operationId: getVersionNodes
      summary: List a published version's human tasks, module tasks included
      description: >-
        Reads a PUBLISHED or ARCHIVED version's stored plan with its calls
        expanded and lists every human task, in plan order: the nodes the Execution Service checks for eligibility at
        instance start and keys in override_map. Writes nothing.

        Responses: `200`; `400 BAD_REQUEST` (an id not a UUID); `401 UNAUTHORIZED`;
        `404 NOT_FOUND` (no such version, or it belongs to another workflow);
        `409 INVALID_VERSION_STATUS` (a DRAFT, or a version with no stored plan);
        `415 UNSUPPORTED_MEDIA_TYPE`; `500 INTERNAL_ERROR` (the stored plan cannot be
        read or expanded); `503 UPSTREAM_UNAVAILABLE` (database or deadline).
      tags: [Versions]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/WorkflowId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        "200":
          description: The version's nodes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionNodes' }
        "400":
          description: An id in the path is not a UUID.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "409":
          description: The version is a DRAFT, which has no stored plan (INVALID_VERSION_STATUS, detail `workflow version is not in PUBLISHED status`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/conflict"
                title: "Invalid Version Status"
                status: 409
                detail: "workflow version is not in PUBLISHED status"
                instance: "/api/v1/workflows/8fa88cde-824c-47bc-836b-665cd42c2222/versions/11abcc22-3844-42bc-938b-665cd42c1111/nodes"
                code: "INVALID_VERSION_STATUS"
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/workflows/{id}/versions/{version_id}/export:
    get:
      operationId: exportBpmn
      summary: Download raw BPMN XML for a version
      description: |
        Returns the version's stored BPMN as a file download, in any status. The file
        name is `<template key>-v<version number>.bpmn`, or `<template key>-vdraft.bpmn`
        for a DRAFT; slashes, backslashes and control characters in the key become `_`.
        The Content-Disposition header quotes or RFC 2231-encodes the name when it is
        not a plain token.

        Responses: `200`; `400 BAD_REQUEST` (an id not a UUID); `401 UNAUTHORIZED`;
        `404 NOT_FOUND` (no such version or workflow, or the version belongs to another
        workflow); `415 UNSUPPORTED_MEDIA_TYPE`; `500 INTERNAL_ERROR`;
        `503 UPSTREAM_UNAVAILABLE` (database or deadline).
      tags: [Versions]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/Departments'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/FeatureFlags'
        - $ref: '#/components/parameters/WorkflowId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        "200":
          description: Raw BPMN XML file, sent with Content-Type `application/xml; charset=utf-8`.
          headers:
            Content-Disposition:
              description: The download file name, `<template key>-v<number or draft>.bpmn`.
              schema: { type: string, example: 'attachment; filename=tender-review-v2.bpmn' }
          content:
            application/xml:
              schema: { type: string, description: "The stored BPMN 2.0 XML, byte for byte." }
              example: "<bpmn:definitions xmlns:bpmn=\"http://www.omg.org/spec/BPMN/20100524/MODEL\">...</bpmn:definitions>"
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  # 3.14
  /api/v1/workflows/{id}/versions/{version_id}/diff/{target_version_id}:
    get:
      operationId: getVersionDiff
      summary: Structural diff between two versions
      description: |
        Compares the expanded main plans of two versions of one workflow. A version
        with a stored plan uses it; a DRAFT is compiled on the fly, its library calls
        resolved against the library as it is now. Writes nothing.

        Responses: `200`; `400 BAD_REQUEST` (an id not a UUID) or `400
        INVALID_BPMN_XML` (a draft's BPMN cannot be parsed); `401 UNAUTHORIZED`;
        `404 NOT_FOUND` (either version absent, or not of this workflow);
        `415 UNSUPPORTED_MEDIA_TYPE`; `422 BPMN_VALIDATION_FAILED` (a draft's library
        calls cannot be resolved); `500 INTERNAL_ERROR` (a version cannot be compiled);
        `503 UPSTREAM_UNAVAILABLE` (module lookups, database or deadline).
      tags: [Versions]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/Departments'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/FeatureFlags'
        - $ref: '#/components/parameters/WorkflowId'
        - name: version_id
          in: path
          required: true
          description: Base version ID.
          schema: { type: string, format: uuid }
        - name: target_version_id
          in: path
          required: true
          description: Target version ID.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Diff result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_id:       { type: string, format: uuid, description: "The workflow." }
                  base_version_id:   { type: string, format: uuid, description: "The version compared from." }
                  target_version_id: { type: string, format: uuid, description: "The version compared to." }
                  change_type:       { $ref: '#/components/schemas/ChangeType' }
                  changes:
                    type: object
                    description: What differs from base to target.
                    properties:
                      added_departments:   { type: array, items: { type: string }, description: "Department ids in the target only, sorted; an empty array (never null) when none." }
                      removed_departments: { type: array, items: { type: string }, description: "Department ids in the base only, sorted; an empty array (never null) when none." }
                      step_changes:
                        type: array
                        description: Execution steps that changed; an empty array when none.
                        items: { $ref: '#/components/schemas/StepChange' }
                      stage_changes:
                        type: array
                        description: Stages that were added or removed ("stage added", "stage removed", keyed by department and stage), and stages whose timer boundary, message boundary, connector type or required role changed ("timer boundary changed", "message boundary changed", "connector type changed", "role changed"; one entry per stage, the first that applies). Each one is a structural change, so a publish that includes one needs force_publish_structural. An empty array when none.
                        items: { $ref: '#/components/schemas/StageChange' }
                      metadata_changes:
                        type: array
                        description: Stages whose due date changed ("due date changed", keyed by department and stage). These are not structural changes and do not need force_publish_structural; a stage can be listed here and in stage_changes. An empty array (never null) when none.
                        items: { $ref: '#/components/schemas/StageChange' }
                      metadata_only: { type: boolean, description: "True when nothing structural changed; change_type is then METADATA_ONLY." }
              example:
                workflow_id: 8fa88cde-824c-47bc-836b-665cd42c2222
                base_version_id: 8fa88cde-824c-47bc-836b-665cd42c2222
                target_version_id: 11abcc22-3844-42bc-938b-665cd42c1111
                change_type: STRUCTURAL
                changes:
                  added_departments: [Legal]
                  removed_departments: []
                  step_changes:
                    - description: "Step 1 changed from sequential to parallel"
                      before: { sequential: [Tender, Legal] }
                      after: { parallel: [{ dept: Tender, steps: [] }, { dept: Legal, steps: [] }] }
                  stage_changes:
                    - { node_key: "Legal/Task_Review", description: "stage added" }
                  metadata_changes:
                    - { node_key: "Tender/Task_Prepare", description: "due date changed" }
                  metadata_only: false
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "422": { $ref: '#/components/responses/UnprocessableEntity' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }
  # Health Checks
  /healthz:
    get:
      operationId: healthCheck
      summary: Liveness Probe
      description: >-
        Answers 200 while the process serves HTTP; checks no dependency and needs no
        identity headers. The 500 and 503 are only the shared library's panic and
        deadline answers (PlatformProblem).
      tags: [Health]
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok", description: "Always `ok`." }
              example:
                status: ok
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /readyz:
    get:
      operationId: readinessCheck
      summary: Readiness Probe
      description: >
        Ready means the database answers. A Valkey outage does not make the service unready,
        since plans are served from the database; it is reported as `cache: degraded`.
        After SIGTERM the probe answers 503 `draining` for SHUTDOWN_DRAIN_DELAY (5 s by
        default) before the listener stops. Needs no identity headers.
      tags: [Health]
      responses:
        "200":
          description: Service is ready to accept traffic.
          content:
            application/json:
              schema:
                type: object
                required: [status, cache]
                properties:
                  status:         { type: string, example: "OK", description: "Always `OK`." }
                  cache:          { type: string, enum: [ok, degraded], description: "`degraded` when Valkey does not answer; plan serving and drafts continue (drafts answer 503 while the lock store is down)." }
                  db_utilization: { type: number, example: 0.3, description: "Ratio of acquired connections to max pool size." }
                  db_conns:       { type: integer, example: 3, description: "Current number of acquired connections." }
                  db_max_conns:   { type: integer, example: 10, description: "Configured pool maximum." }
              example:
                status: OK
                cache: ok
                db_utilization: 0.3
                db_conns: 3
                db_max_conns: 10
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "503":
          description: Not ready — the database is unreachable (`unavailable`, with `db`), or the pod is draining for shutdown (`draining`, alone).
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [unavailable, draining], description: "`draining` after SIGTERM, else `unavailable`." }
                  db:     { type: string, enum: [unreachable], description: "Present with `unavailable` only." }
              example:
                status: "unavailable"
                db: "unreachable"

  /api/v1/bpmn/allowed-elements:
    get:
      operationId: getAllowedBpmnElements
      summary: List the recognized BPMN element vocabulary
      description: >
        Serves the same Tier-1 allowlist the compiler enforces, for the modeler UI's
        palette configuration. UX convenience only — the compiler's own server-side
        422 rejection is the actual enforcement boundary, not this endpoint.
        The list comes from workflow-models and is the same for every tenant.

        Responses: `200`; `401 UNAUTHORIZED`; `415 UNSUPPORTED_MEDIA_TYPE`;
        `500 INTERNAL_ERROR`; `503` only as the shared library's deadline answer.
      tags: [BPMN]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
      responses:
        "200":
          description: The recognized element list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  elements:
                    type: array
                    description: BPMN element local names the parser accepts.
                    items: { type: string }
              example:
                elements: [definitions, process, userTask, callActivity]
        "401": { $ref: '#/components/responses/Unauthorized' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/connectors/registry:
    get:
      operationId: listConnectorRegistry
      summary: List the connector type registry
      description: >
        Static metadata for every registered connector type (currently storage,
        send-email, rest-call) — field definitions for the modeler
        UI's connector-task configuration form. The registry is compiled into
        workflow-connectors and is the same for every tenant.

        Responses: `200`; `401 UNAUTHORIZED`; `415 UNSUPPORTED_MEDIA_TYPE`;
        `500 INTERNAL_ERROR`; `503` only as the shared library's deadline answer.
      tags: [Connectors]
      security:
        - GatewayTenantContext: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
      responses:
        "200":
          description: The connector registry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  connectors:
                    type: object
                    description: Every registered connector type, keyed by its type name.
                    additionalProperties:
                      type: object
                      properties:
                        type:         { type: string, description: "The connector type, as a task names it in connector:<type>." }
                        display_name: { type: string, description: "The name the modeler shows." }
                        description:  { type: string, description: "What the connector does." }
                        inputs:
                          type: array
                          description: The input fields; an empty array when none.
                          items: { $ref: '#/components/schemas/ConnectorRegistryField' }
                        outputs:
                          type: array
                          description: The output fields; an empty array when none.
                          items: { $ref: '#/components/schemas/ConnectorRegistryField' }
                        retry:
                          type: string
                          description: How the connector worker may retry a call of this type.
                          enum: [safe, unsafe, conditional, not-delivered]
              example:
                connectors:
                  rest-call:
                    type: rest-call
                    display_name: REST Call
                    description: Invoke an external HTTP endpoint via a pre-registered alias.
                    inputs:
                      - name: provider
                        kind: enum
                        required: false
                        enum_values: [aws-s3, azure-blob, gcp-gcs, google-drive]
                        description: Backend provider for this call. Required — no default.
                    outputs: []
                    retry: conditional
        "401": { $ref: '#/components/responses/Unauthorized' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/connectors/credentials:
    post:
      operationId: writeConnectorCredential
      summary: Write a connector credential field to the secret store
      description: >
        Writes one field of a connector's credential material to OpenBao at
        connectors/<tenantID>/<connector_type>/<field_name>. Requires
        tenant_admin or tenant_owner. Writing a field again replaces its value
        (a new KV-v2 version). The value is never echoed or logged. The route takes no Idempotency-Key: the header is ignored, nothing is cached for it, and a repeated request writes another version.

        Responses, in the order the checks run:
        - `201` — written.
        - `403 FORBIDDEN` — no tenant_admin or tenant_owner role.
        - `400 BAD_REQUEST` — malformed body, unknown field, or connector_type, field_name or value missing or empty.
        - `413 PAYLOAD_TOO_LARGE`.
        - `400 INVALID_INPUT` — connector_type is not a registered type, or field_name does not match `^[a-zA-Z0-9_-]+$` or is over 128 characters; value is only whitespace.
        - `503 UPSTREAM_UNAVAILABLE` — the secret store is not configured, unreachable or refuses the write.
        - `401 UNAUTHORIZED`; `415 UNSUPPORTED_MEDIA_TYPE`; `500 INTERNAL_ERROR`.
      tags: [Connectors]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [connector_type, field_name, value]
              properties:
                connector_type: { type: string, description: "Must match a registered connector type exactly (see GET /connectors/registry); otherwise 400 INVALID_INPUT." }
                field_name:     { type: string, pattern: '^[a-zA-Z0-9_-]+$', description: "The credential field; at most 128 characters, refused with 400 INVALID_INPUT above that or when it does not match the pattern." }
                value:          { type: string, description: "The secret value, stored as sent, surrounding whitespace included. Empty is 400 BAD_REQUEST; a value of only whitespace is 400 INVALID_INPUT." }
            example:
              connector_type: rest-call
              field_name: api_key
              value: "s3cr3t-token"
      responses:
        "201":
          description: Credential field written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret_path: { type: string, example: "connectors/018f1a2b-.../rest-call/api_key", description: "The secret store path written: connectors/<tenant id>/<connector_type>/<field_name>." }
              example:
                secret_path: "connectors/7ca648b2-b432-4744-884c-35fd556a310c/rest-call/api_key"
        "400":
          description: >-
            BAD_REQUEST — malformed body, unknown field, or a missing or empty connector_type,
            field_name or value. INVALID_INPUT — unrecognized connector_type, a field_name that
            does not match the pattern or is over 128 characters, or a value of only whitespace.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/bad-request"
                title: "Invalid Input"
                status: 400
                detail: "invalid connector credential input: field_name must match ^[a-zA-Z0-9_-]+$ and be at most 128 characters"
                instance: "/api/v1/connectors/credentials"
                code: "INVALID_INPUT"
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "413": { $ref: '#/components/responses/PayloadTooLarge' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503":
          description: UPSTREAM_UNAVAILABLE — the secret store (OpenBao) is not configured, unreachable, or answers an error (a 403 from it included). Nothing was written.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/v1/connectors/credentials/{connector_type}/{field_name}:
    delete:
      operationId: revokeConnectorCredential
      summary: Revoke a connector credential field
      description: >
        Deletes the OpenBao metadata at
        connectors/<tenantID>/<connector_type>/<field_name>, destroying every
        version of that field. This is not a recoverable soft-delete. Rotation
        does not use this endpoint — KV-v2 versions on overwrite, so writing
        the field again is what rotates it. Requires tenant_admin or
        tenant_owner. Takes no Idempotency-Key. A field that was never written is
        deleted all the same: the answer is 204.

        Responses: `204`; `403 FORBIDDEN` (no tenant_admin or tenant_owner role);
        `400 INVALID_INPUT` (connector_type not registered, or field_name not
        matching the pattern or over 128 characters); `401 UNAUTHORIZED`;
        `415 UNSUPPORTED_MEDIA_TYPE` (a non-JSON body); `500 INTERNAL_ERROR`;
        `503 UPSTREAM_UNAVAILABLE` (the secret store is not configured, unreachable
        or refuses the delete).
      tags: [Connectors]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - in: path
          name: connector_type
          required: true
          schema: { type: string }
          description: Must match a registered connector type exactly; otherwise 400 INVALID_INPUT.
        - in: path
          name: field_name
          required: true
          schema: { type: string, pattern: '^[a-zA-Z0-9_-]+$' }
          description: The credential field; at most 128 characters, refused with 400 INVALID_INPUT above that or when it does not match the pattern.
      responses:
        "204": { description: Credential field revoked. No response body. }
        "400":
          description: INVALID_INPUT — unrecognized connector_type, or an invalid field_name (detail names the rule).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/bad-request"
                title: "Invalid Input"
                status: 400
                detail: "invalid connector credential input: unrecognized connector_type \"chat-notify\""
                instance: "/api/v1/connectors/credentials/chat-notify/api_key"
                code: "INVALID_INPUT"
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503":
          description: UPSTREAM_UNAVAILABLE — the secret store (OpenBao) is not configured, unreachable, or answers an error. Nothing was deleted.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/v1/modules:
    get:
      operationId: listModules
      summary: List modules visible to the caller (own tenant + global)
      description: |
        Lists the caller's tenant's modules and every global module, newest first
        (created_at, then id, descending), archived ones included.

        Responses: `200`; `400 INVALID_INPUT` (page or limit out of range);
        `401 UNAUTHORIZED`; `415 UNSUPPORTED_MEDIA_TYPE`; `422 INVALID_INPUT` (a
        scope other than tenant or global, detail `scope must be "tenant" or
        "global"`); `500 INTERNAL_ERROR`; `503 UPSTREAM_UNAVAILABLE` (database or
        deadline).
      tags: [Modules]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - in: query
          name: page
          description: 1-based page number. Not an integer from 1 to 100000 is 400 INVALID_INPUT.
          schema: { type: integer, default: 1, minimum: 1, maximum: 100000 }
        - in: query
          name: limit
          description: Page size. Not an integer from 1 to 100 is 400 INVALID_INPUT.
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - in: query
          name: scope
          description: Only tenant or only global modules; absent or empty lists both. Any other value is 422 INVALID_INPUT.
          schema: { $ref: '#/components/schemas/CatalogScope' }
        - in: query
          name: q
          schema: { type: string }
          description: Case-insensitive substring match on the name; `%` and `_` match themselves.
      responses:
        "200":
          description: Paginated module list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  modules:
                    type: array
                    description: The page's modules; an empty array when none match.
                    items: { $ref: '#/components/schemas/ModuleSummary' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
              example:
                modules:
                  - id: 018f1a2b-0000-7000-8000-000000000001
                    scope: global
                    name: Standard Approval Chain
                    description: Reusable three-step approval sequence
                    process_id: ApprovalChain
                    active_version_id: 018f1a2b-0000-7000-8000-000000000002
                    created_at: "2026-08-20T08:00:00Z"
                    updated_at: "2026-08-25T10:00:00Z"
                pagination: { total_count: 1, page: 1, limit: 20 }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "422": { $ref: '#/components/responses/UnprocessableEntity' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

    post:
      operationId: createModule
      summary: Create a module and its first DRAFT version
      description: |
        `scope: global` requires the `platform_operator` role and is written
        through a BYPASSRLS system connection — the ordinary tenant-scoped
        role cannot insert a global-scope row regardless of this check.
        The BPMN must hold exactly one process, whose id becomes the module's
        process_id; it is validated and compiled as a module (open lanes allowed,
        its own library calls resolved), and a global module may not name users.
        The process id must not be used by a module the caller can call (its
        tenant's or a global one); this is checked in the insert transaction.

        Responses, in the order the checks run:
        - `201` — created.
        - `403 FORBIDDEN` — no tenant_admin or tenant_owner role.
        - `400 BAD_REQUEST` — Idempotency-Key over 256 bytes; malformed body, unknown field, or name or bpmn_xml missing or empty.
        - `409 IDEMPOTENCY_KEY_REPLAY`, `IDEMPOTENCY_REQUEST_IN_PROGRESS`.
        - `413 PAYLOAD_TOO_LARGE`.
        - `422 INVALID_INPUT` — name only whitespace, a field over its limit, a NUL character, or a scope other than tenant or global.
        - `403 FORBIDDEN` — scope global without platform_operator.
        - `400 INVALID_BPMN_XML` — the BPMN cannot be parsed.
        - `422 BPMN_VALIDATION_FAILED` — not exactly one process, or error-severity issues (only those are listed).
        - `409 MODULE_PROCESS_ID_CONFLICT` — the process id is taken.
        - `503 UPSTREAM_UNAVAILABLE` — module lookups, database or deadline.
        - `401 UNAUTHORIZED`; `415 UNSUPPORTED_MEDIA_TYPE`; `500 INTERNAL_ERROR`.
      tags: [Modules]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, bpmn_xml]
              properties:
                name:        { type: string, maxLength: 255, description: "The module name. Empty is 400 BAD_REQUEST; only whitespace, over 255 characters or a NUL character is 422 INVALID_INPUT; stored as sent." }
                description: { type: string, maxLength: 2000, description: "Optional description; over 2000 characters or a NUL character is 422 INVALID_INPUT." }
                bpmn_xml:
                  type: string
                  description: Must contain exactly one top-level `<bpmn:process>`. Empty is 400 BAD_REQUEST; unparseable XML is 400 INVALID_BPMN_XML.
                scope:
                  allOf: [{ $ref: '#/components/schemas/CatalogScope' }]
                  default: tenant
                  description: tenant (default; also when omitted or empty) or global. Any other value is 422 INVALID_INPUT; global needs platform_operator.
            example:
              name: Standard Approval Chain
              description: Reusable three-step approval sequence
              bpmn_xml: "<bpmn:definitions xmlns:bpmn=\"http://www.omg.org/spec/BPMN/20100524/MODEL\" xmlns:zeebe=\"http://camunda.org/schema/zeebe/1.0\"><bpmn:process id=\"ApprovalChain\">...</bpmn:process></bpmn:definitions>"
              scope: tenant
      responses:
        "201":
          description: Module and initial draft version created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  module_id:  { type: string, format: uuid, description: "The new module." }
                  version_id: { type: string, format: uuid, description: "Its first version." }
                  status:     { $ref: '#/components/schemas/VersionStatus' }
                  message:    { type: string, description: "Always `Module created`." }
              example:
                module_id: 018f1a2b-0000-7000-8000-000000000001
                version_id: 018f1a2b-0000-7000-8000-000000000002
                status: DRAFT
                message: Module created
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "409":
          description: MODULE_PROCESS_ID_CONFLICT — the process id is used by a module the caller can call. IDEMPOTENCY_KEY_REPLAY or IDEMPOTENCY_REQUEST_IN_PROGRESS.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/conflict"
                title: "Module Process Id Conflict"
                status: 409
                detail: "module process id is already in use"
                instance: "/api/v1/modules"
                code: "MODULE_PROCESS_ID_CONFLICT"
        "422": { $ref: '#/components/responses/UnprocessableEntity' }
        "413": { $ref: '#/components/responses/PayloadTooLarge' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/modules/{id}:
    get:
      operationId: getModule
      summary: Get a module's metadata and active version
      description: |
        Returns a module of the caller's tenant or a global module, with its active
        version and BPMN when it has one.

        Responses: `200`; `400 BAD_REQUEST` (id not a UUID); `401 UNAUTHORIZED`;
        `404 NOT_FOUND` (no such module visible to the caller); `415
        UNSUPPORTED_MEDIA_TYPE`; `500 INTERNAL_ERROR`; `503 UPSTREAM_UNAVAILABLE`
        (database or deadline).
      tags: [Modules]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - in: path
          name: id
          required: true
          description: The module id. Not a UUID is 400 BAD_REQUEST.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Module detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleDetail' }
              example:
                id: 018f1a2b-0000-7000-8000-000000000001
                scope: global
                name: Standard Approval Chain
                description: Reusable three-step approval sequence
                process_id: ApprovalChain
                active_version_id: 018f1a2b-0000-7000-8000-000000000002
                created_at: "2026-08-20T08:00:00Z"
                updated_at: "2026-08-25T10:00:00Z"
                active_version:
                  id: 018f1a2b-0000-7000-8000-000000000002
                  module_id: 018f1a2b-0000-7000-8000-000000000001
                  scope: global
                  status: PUBLISHED
                  bpmn_xml: "<bpmn:definitions>...</bpmn:definitions>"
                  process_id: ApprovalChain
                  version_number: 1
                  is_valid: true
                  published_at: "2026-08-20T09:00:00Z"
                  created_at: "2026-08-20T08:00:00Z"
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

    delete:
      operationId: archiveModule
      summary: Archive a module (clears its active version)
      description: >
        Deleting a `scope=global` module requires the `platform_operator` role. Archiving is
        refused with 409 `MODULE_IN_USE` while a PUBLISHED workflow version of the caller's tenant
        holds the module in its `module_refs`, or a workflow draft of the caller's tenant calls it;
        the response lists those uses. Archived workflow versions do not count. Publishing a new
        draft of an archived module makes it active again. A global module is checked against
        the caller's tenant only. The check and the archive run in one serializable
        transaction; the version active when it commits is the one archived. Takes no body.

        Responses, in the order the checks run:
        - `200` — archived; status is `ARCHIVED`.
        - `403 FORBIDDEN` — no tenant_admin or tenant_owner role.
        - `400 BAD_REQUEST` — Idempotency-Key over 256 bytes, or id not a UUID.
        - `409 IDEMPOTENCY_KEY_REPLAY`, `IDEMPOTENCY_REQUEST_IN_PROGRESS`.
        - `404 NOT_FOUND` — no such module visible to the caller.
        - `403 FORBIDDEN` — a global module without platform_operator.
        - `409 NO_ACTIVE_VERSION` — never published, or already archived.
        - `409 MODULE_IN_USE` — carries `uses`.
        - `503 UPSTREAM_UNAVAILABLE` — database, lost serialization retries or deadline.
        - `401 UNAUTHORIZED`; `415 UNSUPPORTED_MEDIA_TYPE` (a non-JSON body); `500 INTERNAL_ERROR`.
      tags: [Modules]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Module archived.
          content:
            application/json:
              schema:
                type: object
                properties:
                  module_id: { type: string, format: uuid, description: "The module archived." }
                  status:    { type: string, example: ARCHIVED, description: "Always `ARCHIVED`." }
                  message:   { type: string, description: "Always `Module archived successfully`." }
              example:
                module_id: 018f1a2b-0000-7000-8000-000000000001
                status: ARCHIVED
                message: Module archived successfully
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "409":
          description: >
            NO_ACTIVE_VERSION: the module has no active version to archive. MODULE_IN_USE (detail
            `the module is used by published workflow versions or workflow drafts; remove those uses
            before archiving it`): a published workflow version or a workflow draft still uses the
            module; `uses` lists them, published versions first. IDEMPOTENCY_KEY_REPLAY or
            IDEMPOTENCY_REQUEST_IN_PROGRESS.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/conflict"
                title: "Module In Use"
                status: 409
                detail: "the module is used by published workflow versions or workflow drafts; remove those uses before archiving it"
                instance: "/api/v1/modules/018f1a2b-0000-7000-8000-000000000001"
                code: "MODULE_IN_USE"
                uses:
                  - workflow_id: 8fa88cde-824c-47bc-836b-665cd42c2222
                    workflow_key: tender-review
                    status: PUBLISHED
                    version_number: 3
                  - workflow_id: 7ca648b2-b432-4744-884c-35fd556a310c
                    workflow_key: bid-no-bid
                    status: DRAFT
        "400": { $ref: '#/components/responses/BadRequest' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/modules/{id}/usages:
    get:
      operationId: listModuleUsages
      summary: Workflow versions that hold a snapshot of a module
      description: >
        The caller's workflow versions whose `module_refs` include this module, with the module
        version each uses and whether the module has a newer active version, ordered by
        workflow name, then version number descending. Drafts, which hold no snapshot, are
        not listed.

        Responses: `200`; `400 BAD_REQUEST` (id not a UUID); `401 UNAUTHORIZED`;
        `404 NOT_FOUND` (no such module visible to the caller); `415
        UNSUPPORTED_MEDIA_TYPE`; `500 INTERNAL_ERROR`; `503 UPSTREAM_UNAVAILABLE`
        (database or deadline).
      tags: [Modules]
      security:
        - GatewayTenantContext: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - in: path
          name: id
          required: true
          description: The module id. Not a UUID is 400 BAD_REQUEST.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The module's usages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  usages:
                    type: array
                    description: Every usage; an empty array when there is none.
                    items: { $ref: '#/components/schemas/ModuleUsage' }
              example:
                usages:
                  - workflow_id: 8fa88cde-824c-47bc-836b-665cd42c2222
                    workflow_key: tender-review
                    workflow_name: Tender Document Review Process
                    version_id: 11abcc22-3844-42bc-938b-665cd42c1111
                    version_number: 3
                    status: PUBLISHED
                    module_version_number: 1
                    behind: true
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/modules/{id}/versions:
    get:
      operationId: listModuleVersions
      summary: List a module's version history
      description: |
        Lists the module's versions, newest first (created_at, then id, descending),
        each with its BPMN.

        Responses: `200`; `400 BAD_REQUEST` (id not a UUID) or `400 INVALID_INPUT`
        (page or limit out of range); `401 UNAUTHORIZED`; `404 NOT_FOUND` (no such
        module visible to the caller); `415 UNSUPPORTED_MEDIA_TYPE`; `500
        INTERNAL_ERROR`; `503 UPSTREAM_UNAVAILABLE` (database or deadline).
      tags: [Modules]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - in: path
          name: id
          required: true
          description: The module id. Not a UUID is 400 BAD_REQUEST.
          schema: { type: string, format: uuid }
        - in: query
          name: page
          description: 1-based page number. Not an integer from 1 to 100000 is 400 INVALID_INPUT.
          schema: { type: integer, default: 1, minimum: 1, maximum: 100000 }
        - in: query
          name: limit
          description: Page size. Not an integer from 1 to 100 is 400 INVALID_INPUT.
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Paginated version list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    description: The page's versions, newest first; an empty array past the last page.
                    items: { $ref: '#/components/schemas/ModuleVersion' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
              example:
                versions:
                  - id: 018f1a2b-0000-7000-8000-000000000002
                    module_id: 018f1a2b-0000-7000-8000-000000000001
                    scope: tenant
                    status: PUBLISHED
                    bpmn_xml: "<bpmn:definitions>...</bpmn:definitions>"
                    process_id: ApprovalChain
                    version_number: 1
                    is_valid: true
                    published_at: "2026-08-20T09:00:00Z"
                    created_at: "2026-08-20T08:00:00Z"
                pagination: { total_count: 1, page: 1, limit: 20 }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

    post:
      operationId: addModuleVersion
      summary: Add a new DRAFT version to an existing module
      description: >
        `bpmn_xml` is optional — omit it to copy the current active version's
        content forward, or supply it to author fresh content in the new draft.
        The body itself is optional: no body, an empty or whitespace-only body,
        `{}` and `{"bpmn_xml": null}` all copy the active version. The content is
        validated as a module, and its process id must be the module's.

        Responses, in the order the checks run:
        - `201` — created.
        - `403 FORBIDDEN` — no tenant_admin or tenant_owner role.
        - `400 BAD_REQUEST` — Idempotency-Key over 256 bytes, or id not a UUID.
        - `409 IDEMPOTENCY_KEY_REPLAY`, `IDEMPOTENCY_REQUEST_IN_PROGRESS`.
        - `404 NOT_FOUND` — no such module visible to the caller.
        - `403 FORBIDDEN` — a global module without platform_operator.
        - `413 PAYLOAD_TOO_LARGE`.
        - `400 BAD_REQUEST` — malformed body or unknown field, or bpmn_xml empty (reason `must not be empty`).
        - `409 NO_ACTIVE_VERSION` — no bpmn_xml given and the module has no active version to copy.
        - `400 INVALID_BPMN_XML` — the BPMN cannot be parsed.
        - `409 MODULE_PROCESS_ID_CONFLICT` — its process id differs from the module's.
        - `422 BPMN_VALIDATION_FAILED` — error-severity issues (only those are listed).
        - `409 DRAFT_ALREADY_EXISTS` — the module already has a DRAFT.
        - `503 UPSTREAM_UNAVAILABLE` — module lookups, database or deadline.
        - `401 UNAUTHORIZED`; `415 UNSUPPORTED_MEDIA_TYPE`; `500 INTERNAL_ERROR`.
      tags: [Modules]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: id
          required: true
          description: The module id. Not a UUID is 400 BAD_REQUEST.
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                bpmn_xml: { type: string, nullable: true, description: "The new draft's BPMN. Omitted or null copies the active version's; an empty string is 400 BAD_REQUEST." }
            example:
              bpmn_xml: "<bpmn:definitions xmlns:bpmn=\"http://www.omg.org/spec/BPMN/20100524/MODEL\" xmlns:zeebe=\"http://camunda.org/schema/zeebe/1.0\"><bpmn:process id=\"ApprovalChain\">...</bpmn:process></bpmn:definitions>"
      responses:
        "201":
          description: Draft version created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  module_id:  { type: string, format: uuid, description: "The module." }
                  version_id: { type: string, format: uuid, description: "The new DRAFT version." }
                  status:     { $ref: '#/components/schemas/VersionStatus' }
                  message:    { type: string, description: "Always `Module version added`." }
              example:
                module_id: 018f1a2b-0000-7000-8000-000000000001
                version_id: 018f1a2b-0000-7000-8000-000000000003
                status: DRAFT
                message: Module version added
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "409":
          description: >-
            A DRAFT version already exists for this module (DRAFT_ALREADY_EXISTS),
            MODULE_PROCESS_ID_CONFLICT (the new version's process id differs from its
            module's), NO_ACTIVE_VERSION (no bpmn_xml and nothing to copy), or
            IDEMPOTENCY_KEY_REPLAY or IDEMPOTENCY_REQUEST_IN_PROGRESS.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/conflict"
                title: "Draft Already Exists"
                status: 409
                detail: "draft already exists"
                instance: "/api/v1/modules/018f1a2b-0000-7000-8000-000000000001/versions"
                code: "DRAFT_ALREADY_EXISTS"
        "422": { $ref: '#/components/responses/UnprocessableEntity' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "413": { $ref: '#/components/responses/PayloadTooLarge' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/modules/{id}/versions/{version_id}:
    get:
      operationId: getModuleVersion
      summary: Get a specific module version, including its BPMN XML
      description: |
        Responses: `200`; `400 BAD_REQUEST` (an id not a UUID); `401 UNAUTHORIZED`;
        `404 NOT_FOUND` (no such version visible to the caller, or it belongs to
        another module); `415 UNSUPPORTED_MEDIA_TYPE`; `500 INTERNAL_ERROR`;
        `503 UPSTREAM_UNAVAILABLE` (database or deadline).
      tags: [Modules]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - in: path
          name: id
          required: true
          description: The module id. Not a UUID is 400 BAD_REQUEST.
          schema: { type: string, format: uuid }
        - in: path
          name: version_id
          required: true
          description: The module version id. Not a UUID is 400 BAD_REQUEST.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Module version detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleVersion' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/modules/{id}/versions/{version_id}/contract:
    get:
      operationId: getModuleContract
      summary: Get what a call of the module version binds and names
      description: >-
        Compiles the module version, in any status, with its own process as the
        root, its open lanes allowed and its library calls resolved against the
        library as it is now. Returns its slots, every human task by the key a
        call's Assignees takes and the slot it runs in, its messages and error
        codes, and whether it names users. Writes nothing.

        Responses: `200`; `400 BAD_REQUEST` (an id not a UUID) or `400
        INVALID_BPMN_XML` (the stored BPMN cannot be parsed); `401 UNAUTHORIZED`;
        `404 NOT_FOUND` (no such version visible to the caller, or it belongs to
        another module); `415 UNSUPPORTED_MEDIA_TYPE`; `422 BPMN_VALIDATION_FAILED`
        (the version cannot be compiled or its calls resolved); `500 INTERNAL_ERROR`;
        `503 UPSTREAM_UNAVAILABLE` (module lookups, database or deadline).
      tags: [Modules]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: version_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The module version's contract.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleContract' }
        "400":
          description: BAD_REQUEST — an id in the path is not a UUID. INVALID_BPMN_XML — the stored BPMN cannot be parsed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "422": { $ref: '#/components/responses/UnprocessableEntity' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/modules/{id}/versions/{version_id}/publish:
    post:
      operationId: publishModuleVersion
      summary: Publish a DRAFT module version
      description: |
        Revalidates the draft as a module, numbers it, and makes it the module's active
        version, which every new resolution of a call to the module then uses. Workflow
        versions already published keep their snapshot. Takes no body.

        Responses, in the order the checks run:
        - `200` — published and active.
        - `403 FORBIDDEN` — no tenant_admin or tenant_owner role.
        - `400 BAD_REQUEST` — Idempotency-Key over 256 bytes, or an id not a UUID.
        - `409 IDEMPOTENCY_KEY_REPLAY`, `IDEMPOTENCY_REQUEST_IN_PROGRESS`.
        - `404 NOT_FOUND` — no such module or version visible to the caller, or the version belongs to another module.
        - `403 FORBIDDEN` — a global module without platform_operator.
        - `409 INVALID_VERSION_STATUS` — the version is not a DRAFT.
        - `400 INVALID_BPMN_XML`; `422 BPMN_VALIDATION_FAILED` — the draft no longer validates.
        - `409 DRAFT_CONCURRENCY` — another publish of the module took the number; publish again.
        - `503 UPSTREAM_UNAVAILABLE` — module lookups, database or deadline.
        - `401 UNAUTHORIZED`; `415 UNSUPPORTED_MEDIA_TYPE` (a non-JSON body); `500 INTERNAL_ERROR`.
      tags: [Modules]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: version_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Version published and set as the module's active version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  module_id:      { type: string, format: uuid, description: "The module." }
                  version_id:     { type: string, format: uuid, description: "The version published." }
                  status:         { $ref: '#/components/schemas/VersionStatus' }
                  version_number: { type: integer, description: "The number assigned." }
                  message:        { type: string, description: "Always `Module version published`." }
              example:
                module_id: 018f1a2b-0000-7000-8000-000000000001
                version_id: 018f1a2b-0000-7000-8000-000000000003
                status: PUBLISHED
                version_number: 2
                message: Module version published
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "409":
          description: INVALID_VERSION_STATUS (detail `invalid version status for this operation`) — the version is not in DRAFT status. DRAFT_CONCURRENCY — another publish took the number. IDEMPOTENCY_KEY_REPLAY or IDEMPOTENCY_REQUEST_IN_PROGRESS.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/conflict"
                title: "Invalid Version Status"
                status: 409
                detail: "invalid version status for this operation"
                instance: "/api/v1/modules/018f1a2b-0000-7000-8000-000000000001/versions/018f1a2b-0000-7000-8000-000000000002/publish"
                code: "INVALID_VERSION_STATUS"
        "422": { $ref: '#/components/responses/UnprocessableEntity' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/starters:
    get:
      operationId: listStarters
      summary: List starter templates visible to the caller (own tenant + global)
      description: |
        Lists the caller's tenant's starters and every global starter, newest first
        (created_at, then id, descending), each with its BPMN.

        Responses: `200`; `400 INVALID_INPUT` (page or limit out of range);
        `401 UNAUTHORIZED`; `415 UNSUPPORTED_MEDIA_TYPE`; `422 INVALID_INPUT` (a
        scope other than tenant or global); `500 INTERNAL_ERROR`;
        `503 UPSTREAM_UNAVAILABLE` (database or deadline).
      tags: [Starters]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - in: query
          name: page
          description: 1-based page number. Not an integer from 1 to 100000 is 400 INVALID_INPUT.
          schema: { type: integer, default: 1, minimum: 1, maximum: 100000 }
        - in: query
          name: limit
          description: Page size. Not an integer from 1 to 100 is 400 INVALID_INPUT.
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - in: query
          name: scope
          description: Only tenant or only global starters; absent or empty lists both. Any other value is 422 INVALID_INPUT.
          schema: { $ref: '#/components/schemas/CatalogScope' }
        - in: query
          name: category
          description: Exact category match, letter case included; empty is no filter.
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string }
          description: Case-insensitive substring match on the name; `%` and `_` match themselves.
      responses:
        "200":
          description: Paginated starter list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  starters:
                    type: array
                    description: The page's starters; an empty array when none match.
                    items: { $ref: '#/components/schemas/StarterTemplate' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
              example:
                starters:
                  - id: 018f1a2b-0000-7000-8000-000000000003
                    scope: global
                    name: Standard Onboarding
                    description: Starting point for a new-hire onboarding workflow
                    category: hr
                    bpmn_xml: "<bpmn:definitions>...</bpmn:definitions>"
                    created_at: "2026-08-20T08:00:00Z"
                    updated_at: "2026-08-20T08:00:00Z"
                pagination: { total_count: 1, page: 1, limit: 20 }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "422": { $ref: '#/components/responses/UnprocessableEntity' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

    post:
      operationId: createStarter
      summary: Create a starter template directly from raw BPMN XML
      description: >
        Runs through the same parser/element-allowlist validation as any BPMN upload.
        `scope: global` requires the `platform_operator` role. The BPMN is validated as
        an authored workflow document, its library calls resolved against the caller's
        tenant (global modules only for a global starter); the publish-only checks do not
        apply.

        Responses, in the order the checks run:
        - `201` — created; the body is the stored starter.
        - `403 FORBIDDEN` — no tenant_admin or tenant_owner role.
        - `400 BAD_REQUEST` — Idempotency-Key over 256 bytes; malformed body, unknown field, or name or bpmn_xml missing or empty.
        - `409 IDEMPOTENCY_KEY_REPLAY`, `IDEMPOTENCY_REQUEST_IN_PROGRESS`.
        - `413 PAYLOAD_TOO_LARGE`.
        - `422 INVALID_INPUT` — name only whitespace, a field over its limit, a NUL character, or a scope other than tenant or global.
        - `403 FORBIDDEN` — scope global without platform_operator.
        - `400 INVALID_BPMN_XML`; `422 BPMN_VALIDATION_FAILED` — `invalid_params` lists every issue found, warnings included.
        - `503 UPSTREAM_UNAVAILABLE` — module lookups, database or deadline.
        - `401 UNAUTHORIZED`; `415 UNSUPPORTED_MEDIA_TYPE`; `500 INTERNAL_ERROR`.
      tags: [Starters]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, bpmn_xml]
              properties:
                name:        { type: string, maxLength: 255, description: "The starter name. Empty is 400 BAD_REQUEST; only whitespace, over 255 characters or a NUL character is 422 INVALID_INPUT; stored as sent." }
                description: { type: string, maxLength: 2000, description: "Optional description; over 2000 characters or a NUL character is 422 INVALID_INPUT." }
                category:    { type: string, maxLength: 64, description: "Optional free-form category; over 64 characters or a NUL character is 422 INVALID_INPUT." }
                bpmn_xml:    { type: string, description: "The starter's BPMN 2.0 XML. Empty is 400 BAD_REQUEST; unparseable XML is 400 INVALID_BPMN_XML; error-severity issues are 422 BPMN_VALIDATION_FAILED." }
                scope:
                  allOf: [{ $ref: '#/components/schemas/CatalogScope' }]
                  default: tenant
                  description: tenant (default; also when omitted or empty) or global. Any other value is 422 INVALID_INPUT; global needs platform_operator.
            example:
              name: Standard Onboarding
              description: Starting point for a new-hire onboarding workflow
              category: hr
              bpmn_xml: "<bpmn:definitions xmlns:bpmn=\"http://www.omg.org/spec/BPMN/20100524/MODEL\" xmlns:zeebe=\"http://camunda.org/schema/zeebe/1.0\">...</bpmn:definitions>"
              scope: tenant
      responses:
        "201":
          description: Starter created; created_at and updated_at are the stored times.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StarterTemplate' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "422": { $ref: '#/components/responses/UnprocessableEntity' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "409": { $ref: '#/components/responses/Conflict' }
        "413": { $ref: '#/components/responses/PayloadTooLarge' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/starters/from-workflow-version/{version_id}:
    post:
      operationId: createStarterFromWorkflowVersion
      summary: Snapshot one of the caller's own workflow versions into a tenant-scoped starter
      description: >
        The source version must be the caller's own (enforced by the same tenant-scoped
        read every other endpoint uses) and must be PUBLISHED or ARCHIVED, not DRAFT.
        Always creates a `scope: tenant` starter — the BPMN content is copied, not linked,
        so a later edit to the source workflow never changes the starter. The BPMN is not
        revalidated.

        Responses, in the order the checks run:
        - `201` — created; the body is the stored starter with source_workflow_version_id set.
        - `403 FORBIDDEN` — no tenant_admin or tenant_owner role.
        - `400 BAD_REQUEST` — Idempotency-Key over 256 bytes; version_id not a UUID; malformed body, unknown field, or name missing or empty.
        - `409 IDEMPOTENCY_KEY_REPLAY`, `IDEMPOTENCY_REQUEST_IN_PROGRESS`.
        - `413 PAYLOAD_TOO_LARGE`.
        - `422 INVALID_INPUT` — name only whitespace, a field over its limit, or a NUL character.
        - `404 NOT_FOUND` — no such workflow version in the caller's tenant.
        - `409 INVALID_VERSION_STATUS` — the source version is a DRAFT.
        - `503 UPSTREAM_UNAVAILABLE` — database or deadline.
        - `401 UNAUTHORIZED`; `415 UNSUPPORTED_MEDIA_TYPE`; `500 INTERNAL_ERROR`.
      tags: [Starters]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: version_id
          required: true
          description: The source workflow version, of any workflow of the caller's tenant. Not a UUID is 400 BAD_REQUEST.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:        { type: string, maxLength: 255, description: "The starter name. Empty is 400 BAD_REQUEST; only whitespace, over 255 characters or a NUL character is 422 INVALID_INPUT; stored as sent." }
                description: { type: string, maxLength: 2000, description: "Optional description; over 2000 characters or a NUL character is 422 INVALID_INPUT." }
                category:    { type: string, maxLength: 64, description: "Optional free-form category; over 64 characters or a NUL character is 422 INVALID_INPUT." }
            example:
              name: Tender Review Starter
              description: Snapshot of the tender review process
              category: procurement
      responses:
        "201":
          description: Starter created from the source version's current content.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StarterTemplate' }
              example:
                id: 018f1a2b-0000-7000-8000-000000000004
                tenant_id: 7ca648b2-b432-4744-884c-35fd556a310c
                scope: tenant
                name: Tender Review Starter
                description: Snapshot of the tender review process
                category: procurement
                bpmn_xml: "<bpmn:definitions>...</bpmn:definitions>"
                source_workflow_version_id: 11abcc22-3844-42bc-938b-665cd42c1111
                created_at: "2026-08-21T08:00:00Z"
                updated_at: "2026-08-21T08:00:00Z"
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "409":
          description: INVALID_VERSION_STATUS (detail `workflow version is not in PUBLISHED status`) — the source version is still in DRAFT status. IDEMPOTENCY_KEY_REPLAY or IDEMPOTENCY_REQUEST_IN_PROGRESS.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/conflict"
                title: "Invalid Version Status"
                status: 409
                detail: "workflow version is not in PUBLISHED status"
                instance: "/api/v1/starters/from-workflow-version/11abcc22-3844-42bc-938b-665cd42c1111"
                code: "INVALID_VERSION_STATUS"
        "400": { $ref: '#/components/responses/BadRequest' }
        "422":
          description: INVALID_INPUT — name only whitespace, a field over its limit, or a NUL character; invalid_params names each field.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/validation-failed"
                title: "Invalid Input"
                status: 422
                detail: "request fields must not contain NUL characters"
                instance: "/api/v1/starters/from-workflow-version/11abcc22-3844-42bc-938b-665cd42c1111"
                code: "INVALID_INPUT"
                invalid_params:
                  - { name: category, reason: "must not contain NUL characters" }
        "413": { $ref: '#/components/responses/PayloadTooLarge' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/starters/{id}:
    get:
      operationId: getStarter
      summary: Get a starter template's metadata and BPMN XML
      description: |
        Responses: `200`; `400 BAD_REQUEST` (id not a UUID); `401 UNAUTHORIZED`;
        `404 NOT_FOUND` (no such starter in the caller's tenant or the global
        catalog); `415 UNSUPPORTED_MEDIA_TYPE`; `500 INTERNAL_ERROR`;
        `503 UPSTREAM_UNAVAILABLE` (database or deadline).
      tags: [Starters]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - in: path
          name: id
          required: true
          description: The starter id. Not a UUID is 400 BAD_REQUEST.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Starter detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StarterTemplate' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

    delete:
      operationId: deleteStarter
      summary: Delete a starter template
      description: |
        Deleting a `scope=global` starter requires the `platform_operator` role. The
        delete is permanent. Takes no body.

        Responses, in the order the checks run:
        - `200` — deleted.
        - `403 FORBIDDEN` — no tenant_admin or tenant_owner role.
        - `400 BAD_REQUEST` — Idempotency-Key over 256 bytes, or id not a UUID.
        - `409 IDEMPOTENCY_KEY_REPLAY`, `IDEMPOTENCY_REQUEST_IN_PROGRESS`.
        - `404 NOT_FOUND` — no such starter visible to the caller (a repeated delete included).
        - `403 FORBIDDEN` — a global starter without platform_operator.
        - `503 UPSTREAM_UNAVAILABLE` — database or deadline.
        - `401 UNAUTHORIZED`; `415 UNSUPPORTED_MEDIA_TYPE` (a non-JSON body); `500 INTERNAL_ERROR`.
      tags: [Starters]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Starter deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  starter_id: { type: string, format: uuid, description: "The starter deleted." }
                  message:    { type: string, description: "Always `Starter deleted`." }
              example:
                starter_id: 018f1a2b-0000-7000-8000-000000000003
                message: Starter deleted
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "405": { $ref: '#/components/responses/MethodNotAllowed' }
        "409": { $ref: '#/components/responses/Conflict' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

tags:
  - name: Workflows
    description: Root workflow template management.
  - name: Drafts
    description: Draft workspace operations (init, save, discard).
  - name: Versions
    description: Version-specific operations (get, publish, clone, promote, export, diff).
  - name: Validation
    description: Stateless BPMN validation.
  - name: Health
    description: Health and readiness checks.
  - name: Modules
    description: Reusable BPMN module library (tenant + platform-authored global catalog).
  - name: Starters
    description: Starter/predesigned workflow templates (tenant + platform-authored global catalog).
  - name: BPMN
    description: BPMN modeler-support endpoints (element allowlist discovery).
  - name: Connectors
    description: Connector type registry and per-tenant credential management.
