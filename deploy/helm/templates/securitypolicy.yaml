{{- $httpRouteEnabled := and .Values.ingress.enabled (eq (.Values.ingress.type | default "Ingress") "HTTPRoute") }}
{{- $anyPolicyEnabled := .Values.ingress.securityPolicy.cors.enabled }}
{{- if and $httpRouteEnabled .Values.ingress.securityPolicy.enabled $anyPolicyEnabled }}
# Envoy Gateway SecurityPolicy — attaches CORS and/or rate limiting to the
# HTTPRoute at the gateway layer. Requires Envoy Gateway v0.6+ (gateway.envoyproxy.io/v1alpha1 CRD).
#
# NOTE: CORS allowHeaders deliberately excludes X-Tenant-ID / X-User-ID — those are
# injected by the Envoy Gateway's ext_authz filter after JWT validation, never sent
# by the browser client itself (see workflow hld). Allow-listing
# them here would incorrectly imply a client is expected to set them, which the
# mesh's mTLS trust model is specifically designed to prevent.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "workflow-definition-service.fullname" . }}
  labels:
    {{- include "workflow-definition-service.labels" . | nindent 4 }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ include "workflow-definition-service.fullname" . }}
  {{- if .Values.ingress.securityPolicy.cors.enabled }}
  cors:
    allowOrigins:
      {{- range .Values.ingress.securityPolicy.cors.allowOrigins }}
      - type: Exact
        value: {{ . | quote }}
      {{- end }}
    allowMethods:
      {{- toYaml .Values.ingress.securityPolicy.cors.allowMethods | nindent 6 }}
    allowHeaders:
      {{- toYaml .Values.ingress.securityPolicy.cors.allowHeaders | nindent 6 }}
    maxAge: {{ .Values.ingress.securityPolicy.cors.maxAge | quote }}
  {{- end }}
{{- end }}
{{- /*
  Envoy Gateway's SecurityPolicy CRD has no spec.rateLimit field — rate limiting
  is a separate BackendTrafficPolicy CRD. Add a templates/backendtrafficpolicy.yaml
  if/when rate limiting is actually needed (mirrors stream_gateway's chart).
*/}}
