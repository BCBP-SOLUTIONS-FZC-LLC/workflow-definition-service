services:
  postgres:
    image: postgres:18-alpine
    container_name: wf-definition-postgres
    environment:
      POSTGRES_USER: wfdef
      POSTGRES_PASSWORD: wfdef
      POSTGRES_DB: workflow_definition
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wfdef -d workflow_definition"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    container_name: wf-definition-valkey
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    container_name: wf-definition-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: sns,sqs,glue
      DEFAULT_REGION: us-east-1
      LOCALSTACK_HOST: localhost
    volumes:
      - "./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:1.17.0
    container_name: wf-definition-pgbouncer
    environment:
      # Local dev values — single service only.
      # Production: MAX_CLIENT_CONN >= sum(PG_MAX_CONNS * pod_count) across all services;
      # DEFAULT_POOL_SIZE = total Postgres backend connections budget for this (user, db) pair.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: workflow_definition
      DB_USER: wfdef
      DB_PASSWORD: wfdef
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "20"
      DEFAULT_POOL_SIZE: "10"
      MIN_POOL_SIZE: "1"
      LISTEN_PORT: "6432"
      AUTH_TYPE: trust
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      SERVER_RESET_QUERY: ""
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U wfdef"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
