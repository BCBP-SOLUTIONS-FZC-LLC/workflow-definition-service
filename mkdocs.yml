site_name: Workflow Definition Service
site_description: Design-time control plane for the BPMN-driven Workflow Engine
site_author: BCBP Solutions

# NOTE: platform-libs/ and .design/ are local read-only reference folders — they are
# gitignored and must never be imported or referenced from go.mod/go.sum.
# Platform libraries are fetched exclusively via GOPRIVATE (go get / go mod vendor).
# See .claude/CLAUDE.md §"Platform Libraries" for upgrade instructions.

docs_dir: docs
site_dir: site

theme:
  name: readthedocs

markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - js/mermaid-init.js

nav:
  - Home: index.md
  - Getting Started:
    - Setup: setup.md
    - Configuration: configuration.md
  - Development:
    - Architecture: architecture.md
    - BPMN Validation & Compilation: bpmn-validation.md
    - Coding Standards: standards.md
    - Style Guide: coding_style_rules.md
    - Testing: testing.md
  - API Reference:
    - REST API: api.md
    - gRPC API: grpc.md
  - Operations:
    - Database: database.md
  - Platform Libraries:
    - Events (SNS/SQS/Outbox): platform-events.md
    - Database Pool (pgcommon): platform-pgcommon.md
    - HTTP & gRPC (gincommon): platform-gincommon.md
