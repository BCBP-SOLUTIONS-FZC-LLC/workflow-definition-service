name: Contract drift

# Reports, without blocking any pull request, when a copy in api/contracts/
# differs from its source service's main. Runs on weekday mornings and on
# demand. Keeps one open issue labelled contract-drift up to date, and closes
# it once the copies match again. Refresh a copy when a route this service
# calls has changed; other drift can wait.

"on":
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: contract-drift
  cancel-in-progress: true

jobs:
  drift:
    name: drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compare the copies with their sources
        id: check
        env:
          GH_TOKEN: ${{ secrets.GO_PRIVATE_TOKEN }}
          CONTRACT_SRC_REF: main
        run: |
          set +e
          make contract-check > drift.txt 2>&1
          status=$?
          cat drift.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Open, update or close the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STATUS: ${{ steps.check.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --state open --label contract-drift --json number --jq '.[0].number // empty')
          if [ "$STATUS" = "0" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "The copies match their sources again: $RUN_URL"
            fi
            exit 0
          fi
          {
            cat <<'MSG'
          A copy in `api/contracts/` differs from its source service's `main`. Nothing is blocked. Refresh the copy and its `SOURCES` line when a route this service calls has changed.
          MSG
            echo
            echo '```'
            cat drift.txt
            echo '```'
            echo
            echo "Run: $RUN_URL"
          } > body.md
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh label create contract-drift --color FBCA04 --description "A contract copy differs from its source" 2>/dev/null || true
            gh issue create --title "Contract copies differ from their sources" --label contract-drift --body-file body.md
          fi
