apiVersion: v1
kind: Service
metadata:
  name: {{ include "workflow-definition-service.fullname" . }}
  labels:
    {{- include "workflow-definition-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.ports.http }}
      targetPort: http
      protocol: TCP
      name: http
      appProtocol: http
    - port: {{ .Values.service.ports.metrics }}
      targetPort: metrics
      protocol: TCP
      name: metrics
      appProtocol: http
  selector:
    {{- include "workflow-definition-service.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
