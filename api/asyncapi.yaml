asyncapi: 3.0.0
info:
  title: workflow-definition-svc events
  version: 1.0.0
  description: Outbound events published to wf-template-events (SNS → SQS fan-out)

channels:
  wf/template/events:
    address: wf-template-events
    bindings:
      sns:
        name: workflow-template-events
    messages:
      WorkflowTemplatePublished:
        $ref: '#/components/messages/WorkflowTemplatePublished'

operations:
  publishTemplateEvents:
    action: send
    channel:
      $ref: '#/channels/wf~1template~1events'
    messages:
      - $ref: '#/channels/wf~1template~1events/messages/WorkflowTemplatePublished'

components:
  messages:
    WorkflowTemplatePublished:
      name: WorkflowTemplatePublished
      title: Workflow template version published
      payload:
        $ref: '#/components/schemas/WorkflowTemplatePublishedPayload'

  schemas:
    # Shared event envelope fields emitted by every outbox event.
    # The envelope is serialised by platform-events; consumers receive a JSON
    # object where these fields appear at the top level alongside `data`.
    EventEnvelope:
      type: object
      required: [id, source, tenant_id, trace_id, schema_version, type, timestamp]
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7 message identifier (used for consumer deduplication)
        source:
          type: string
          const: workflow-definition-svc
        tenant_id:
          type: string
          format: uuid
        trace_id:
          type: string
          description: OTel trace context propagated from the publisher context
        schema_version:
          type: string
          description: Incremented on additive payload schema changes
        type:
          type: string
          description: >
            Dot-separated event type name (e.g. workflow.template.published).
            Also set as the SNS MessageAttribute `event_type` so consumers can
            apply SNS filter policies per queue.
        timestamp:
          type: string
          format: date-time
          description: UTC timestamp at which the event was created
        correlation_id:
          type: string
          description: Optional correlation ID for request tracing across services

    WorkflowTemplatePublishedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [payload]
          properties:
            payload:
              $ref: '#/components/schemas/WorkflowPublishedData'

    WorkflowPublishedData:
      type: object
      required:
        - workflow_id
        - workflow_key
        - version_id
        - version_number
        - artifact_hash
        - published_by
      properties:
        workflow_id:
          type: string
          format: uuid
        workflow_key:
          type: string
          description: business key for the workflow template
        version_id:
          type: string
          format: uuid
        version_number:
          type: integer
          description: Monotonically increasing version counter scoped to the workflow
        artifact_hash:
          type: string
          description: SHA-256 hash of the BPMN XML — consumers use this to verify integrity
        published_by:
          type: string
          format: uuid
          description: User ID of the actor who triggered the publish
        promoted_from_version_id:
          type: string
          format: uuid
          nullable: true
          description: >
            ID of the version that was previously active when this version
            was promoted. Null for the first publish of a workflow.
