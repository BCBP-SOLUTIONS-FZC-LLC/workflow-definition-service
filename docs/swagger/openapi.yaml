      tags: [Versions]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/Departments'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/FeatureFlags'
        - $ref: '#/components/parameters/WorkflowId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        "200":
          description: Version detail.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version_id:         { type: string, format: uuid }
                  workflow_id:        { type: string, format: uuid }
                  version_number:     { type: integer, nullable: true }
                  status:             { $ref: '#/components/schemas/VersionStatus' }
                  is_valid:           { type: boolean }
                  validation_errors:
                    type: array
                    items: { $ref: '#/components/schemas/ValidationError' }
                    nullable: true
                  bpmn_xml:           { type: string }
                  module_bpmn_xmls:   { type: array, items: { type: string }, description: "Called-process BPMNs attached to this version. Empty array if none." }
                  artifact_hash:      { type: string, nullable: true, description: "SHA-256 of the BPMN XML at publish time. Absent on DRAFT versions." }
                  compiled_plan_json: { $ref: '#/components/schemas/CompiledPlan' }
                  created_by_user_id: { type: string, format: uuid }
                  created_at:         { type: string, format: date-time }
                  published_at:       { type: string, format: date-time, nullable: true }
                  record_version:     { type: integer, format: int64, description: "Monotonic counter. Echo on PUT /draft requests." }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/InternalError' }

  # 3.7
  /api/v1/workflows/{id}/versions/{version_id}/publish:
