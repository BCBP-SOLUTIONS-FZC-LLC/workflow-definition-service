{{- if .Values.migrationJob.enabled }}
# Runs `/server migrate` before the main Deployment rolls out. This service has NO
# auto-migration at server boot (cmd/server/main.go special-cases `migrate` as a
# subcommand) — iam-user-profile has no equivalent, since it has no such subcommand.
#
# IMPORTANT: cmd/server/main.go calls config.Load() (full validate()) BEFORE checking
# for the `migrate` subcommand, so this Job needs the exact same required env vars as
# the main Deployment (INTERNAL_API_TOKEN, SNS_TOPIC_ARN, GLUE_REGISTRY_NAME,
# ORG_MEMBERSHIP_BASE_URL, EXECUTION_SERVICE_ADDR, etc.) or config.Load() itself will
# fail before migrations ever run.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "workflow-definition-service.fullname" . }}-migrate
  labels:
    {{- include "workflow-definition-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "workflow-definition-service.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ if .Values.serviceAccount.create }}{{ include "workflow-definition-service.fullname" . }}{{ else }}default{{ end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ include "workflow-definition-service.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: BUILD_VERSION
              value: {{ include "workflow-definition-service.imageTag" . | quote }}
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- $secretName := default (printf "%s-secrets" (include "workflow-definition-service.fullname" .)) .Values.existingSecret }}
            {{- range .Values.envFromSecret }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ . }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
