name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials
      - run: go build -o /dev/null ./cmd/server

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials
      - run: go vet ./...

  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials
      - run: go test -race -count=1 ./...

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials
      - run: |
          mkdir -p .coverage
          go test -race -count=1 -coverprofile=.coverage/coverage.out -covermode=atomic ./...
          go tool cover -func=.coverage/coverage.out | tail -1

  IInt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials
      - run: go build -tags=integration -o /dev/null ./cmd/server

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
