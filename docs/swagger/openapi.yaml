          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  # 3.10
  /api/v1/workflows/{id}/versions/{version_id}/clone:
    post:
      operationId: cloneVersion
      summary: Clone a published version into a new workflow key
      tags: [Versions]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/Departments'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/FeatureFlags'
        - $ref: '#/components/parameters/WorkflowId'
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_key, new_name]
              properties:
                new_key:
                  type: string
                  minLength: 2
                  maxLength: 100
                  pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
                  description: New unique slug for the cloned workflow. Must not already exist for this tenant.
                  example: tender-review-copy
                new_name:
                  type: string
                  minLength: 2
                  maxLength: 255
                  example: "Tender Document Review Process (Cloned)"
                new_description:
                  type: string
                  maxLength: 2000
                  example: Duplicate copy of standard review process
      responses:
        "201":
          description: New workflow created from clone.
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_id:    { type: string, format: uuid }
                  version_id:     { type: string, format: uuid }
                  status:         { $ref: '#/components/schemas/VersionStatus' }
                  version_number: { type: integer, nullable: true }
                  message:        { type: string }
        "400": { $ref: '#/components/responses/UnprocessableEntity' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409":
          description: Business key conflict (cloned key already exists), source version is not PUBLISHED or ARCHIVED, or idempotency key reused with a different payload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              examples:
                duplicate_key:
                  summary: Cloned key already exists
                  value:
                    type: "https://api.workflow.platform/errors/conflict"
                    title: "Duplicate Business Key"
                    status: 409
                    detail: "A workflow with this key already exists for this tenant."
                    instance: "/workflows/8fa88cde-824c-47bc-836b-665cd42c2222/versions/11abcc22-3844-42bc-938b-665cd42c1111/clone"
                    code: "DUPLICATE_BUSINESS_KEY"
                invalid_status:
                  summary: Source version is not in PUBLISHED or ARCHIVED status
                  value:
                    type: "https://api.workflow.platform/errors/conflict"
                    title: "Invalid Version Status"
                    status: 409
                    detail: "Only PUBLISHED or ARCHIVED versions can be cloned."
                    instance: "/workflows/8fa88cde-824c-47bc-836b-665cd42c2222/versions/11abcc22-3844-42bc-938b-665cd42c1111/clone"
                    code: "INVALID_VERSION_STATUS"
        "500": { $ref: '#/components/responses/InternalError' }

  # 3.11
  /api/v1/workflows/{id}/versions/{version_id}/promote:
    post:
      operationId: promoteVersion
      summary: Promote a published version to active (rollback / rollforward)
      tags: [Versions]
