name: Release

"on":
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC
  GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml
    secrets: inherit

  coverage:
    name: Coverage Gate (≥ 95%)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: .coverage
        continue-on-error: true   # artifact may not exist if validate skipped test

      - name: Enforce coverage threshold (≥ 50%)
        run: |
          if [ ! -f .coverage/coverage.out ]; then
            echo "No coverage artifact found — coverage gate skipped on validate-only run"
            exit 0
          fi
          pct=$(go tool cover -func=.coverage/coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { if (p+0 < 50) { print "FAIL: " p "% is below the 50% threshold"; exit 1 } else { print "PASS: " p "%" } }'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [validate, coverage]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Download modules
        run: go mod download

      - name: Build binary
        run: |
          mkdir -p bin
          go build -ldflags "-X main.version=${{ github.ref_name }}" \
            -o bin/server ./cmd/server

      - name: Verify binary
        run: test -x bin/server

      - uses: actions/upload-artifact@v4
        with:
          name: server-linux-amd64
          path: bin/server
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: build
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: server-linux-amd64
          path: bin

      - name: Extract CHANGELOG section for release notes
        run: |
          VERSION="${{ github.ref_name }}"
          # Strip leading 'v' for CHANGELOG lookup (e.g. v1.2.3 → 1.2.3)
          VER=${VERSION#v}
          awk "/^## \\[${VER}\\]/,/^## \\[/" CHANGELOG.md \
            | head -n -1 \
            | tail -n +2 \
            > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG entry found for ${VER} — using tag message as notes"
          fi

      - name: Create GitHub release
        run: |
          NOTES_FLAG="--notes-from-tag"
          if [ -s release-notes.md ]; then
            NOTES_FLAG="--notes-file release-notes.md"
          fi
          gh release create "${{ github.ref_name }}" \
            bin/server \
            --title "${{ github.ref_name }}" \
            $NOTES_FLAG \
            --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
