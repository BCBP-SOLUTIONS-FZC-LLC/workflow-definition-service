                instance: "/workflows/8fa88cde-824c-47bc-836b-665cd42c2222/versions/11abcc22-3844-42bc-938b-665cd42c1111/promote"
                code: "INVALID_VERSION_STATUS"
        "500": { $ref: '#/components/responses/InternalError' }

  # 3.13
  /api/v1/workflows/{id}/versions/{version_id}/validation:
    get:
      operationId: getVersionValidation
      summary: Re-run structural validation against a stored version
      description: >-
        Validates a stored version's own BPMN, in any status, and writes nothing.
        A draft's library calls resolve against the library as it is now; any
        other version's resolve to the module versions in its `module_refs`.
        A validator rule added after a version was published does not
        retroactively invalidate it, so this is how an operator finds a template
        that still holds a defect rather than discovering it when the Execution
        Service refuses to instantiate.
      tags: [Versions]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/Departments'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/FeatureFlags'
        - $ref: '#/components/parameters/WorkflowId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        "200":
          description: Validation result for the stored version.
          content:
            application/json:
              schema:
                type: object
                required: [version_id, status, is_valid, issues]
                properties:
                  version_id: { type: string, format: uuid }
                  status:     { type: string, example: PUBLISHED }
                  is_valid:   { type: boolean }
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        node_id:  { type: string, example: Activity_0abc123 }
                        code:     { type: string, example: CANDIDATE_USERS_EMPTY }
                        message:  { type: string }
                        severity: { type: string, enum: [ERROR, WARNING] }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/v1/workflows/{id}/versions/{version_id}/nodes:
    get:
      operationId: getVersionNodes
      summary: List a published version's human tasks, module tasks included
      description: >-
        Reads a PUBLISHED or ARCHIVED version's stored plan with its calls
        expanded and lists every human task in a department that is not ignored,
        in plan order: the nodes the Execution Service checks for eligibility at
        instance start and keys in override_map. Writes nothing.
      tags: [Versions]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/WorkflowId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        "200":
          description: The version's nodes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionNodes' }
        "400":
          description: An id in the path is not a UUID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409":
          description: The version is a DRAFT, which has no stored plan (INVALID_VERSION_STATUS).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/v1/workflows/{id}/versions/{version_id}/export:
    get:
      operationId: exportBpmn
      summary: Download raw BPMN XML for a version
      tags: [Versions]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/Departments'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/FeatureFlags'
        - $ref: '#/components/parameters/WorkflowId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        "200":
          description: Raw BPMN XML file.
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="workflow-tender-review-v2.bpmn"' }
          content:
            application/xml:
              schema: { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/InternalError' }

  # 3.14
  /api/v1/workflows/{id}/versions/{version_id}/diff/{target_version_id}:
    get:
      operationId: getVersionDiff
      summary: Structural diff between two versions
      tags: [Versions]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/Departments'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/FeatureFlags'
        - $ref: '#/components/parameters/WorkflowId'
        - name: version_id
          in: path
          required: true
          description: Base version ID.
          schema: { type: string, format: uuid }
        - name: target_version_id
          in: path
          required: true
          description: Target version ID.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Diff result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_id:       { type: string, format: uuid }
                  base_version_id:   { type: string, format: uuid }
                  target_version_id: { type: string, format: uuid }
                  change_type:       { $ref: '#/components/schemas/ChangeType' }
                  changes:
                    type: object
                    properties:
                      added_departments:   { type: array, items: { type: string } }
                      removed_departments: { type: array, items: { type: string } }
                      step_changes:
                        type: array
                        items: { $ref: '#/components/schemas/StepChange' }
                      metadata_only: { type: boolean }
        "400": { $ref: '#/components/responses/UnprocessableEntity' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/InternalError' }
  # Health Checks
  /healthz:
    get:
      operationId: healthCheck
      summary: Liveness Probe
      tags: [Health]
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "OK" }
        "500": { $ref: '#/components/responses/InternalError' }

  /readyz:
    get:
      operationId: readinessCheck
      summary: Readiness Probe
      tags: [Health]
      responses:
        "200":
          description: Service is ready to accept traffic.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:         { type: string, example: "OK" }
                  db_utilization: { type: number, example: 0.3, description: "Ratio of acquired connections to max pool size." }
                  db_conns:       { type: integer, example: 3, description: "Current number of acquired connections." }
                  db_max_conns:   { type: integer, example: 10, description: "Configured pool maximum." }
        "503":
          description: Service is not ready — database pool unhealthy or Valkey cache unreachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/service-unavailable"
                title: "Service Unavailable"
                status: 503
                detail: "Database connectivity check failed."
                instance: "/readyz"
                code: "DATABASE_DISCONNECTED"

  /api/v1/bpmn/allowed-elements:
    get:
      operationId: getAllowedBpmnElements
      summary: List the recognized BPMN element vocabulary
      description: >
        Serves the same Tier-1 allowlist the compiler enforces, for the modeler UI's
        palette configuration. UX convenience only — the compiler's own server-side
        422 rejection is the actual enforcement boundary, not this endpoint.
      tags: [BPMN]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
      responses:
        "200":
          description: The recognized element list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  elements:
                    type: array
                    items: { type: string }
              example:
                elements: [definitions, process, userTask, callActivity]
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/v1/connectors/registry:
    get:
      operationId: listConnectorRegistry
      summary: List the connector type registry
      description: >
        Static metadata for every registered connector type (currently storage,
        send-email, rest-call, chat-notify) — field definitions for the modeler
        UI's connector-task configuration form.
      tags: [Connectors]
      security:
        - GatewayTenantContext: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
      responses:
        "200":
          description: The connector registry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  connectors:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        type:         { type: string }
                        display_name: { type: string }
                        description:  { type: string }
                        inputs:
                          type: array
                          items: { $ref: '#/components/schemas/ConnectorRegistryField' }
                        outputs:
                          type: array
                          items: { $ref: '#/components/schemas/ConnectorRegistryField' }
                        retry:
                          type: string
                          enum: [safe, unsafe, conditional]
              example:
                connectors:
                  rest-call:
                    type: rest-call
                    display_name: REST Call
                    description: Invoke an external HTTP endpoint via a pre-registered alias.
                    inputs:
                      - name: provider
                        kind: enum
                        required: false
                        enum_values: [aws-s3, azure-blob, gcp-gcs, google-drive]
                        description: Backend provider for this call. Required — no default.
                    outputs: []
                    retry: conditional
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/v1/connectors/credentials:
    post:
      operationId: writeConnectorCredential
      summary: Write a connector credential field to the secret store
      description: >
        Writes one field of a connector's credential material to OpenBao at
        connectors/<tenantID>/<connector_type>/<field_name>. Requires
        tenant_admin or tenant_owner.
      tags: [Connectors]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connector_type, field_name, value]
              properties:
                connector_type: { type: string, description: Must match a registered connector type. }
                field_name:     { type: string, pattern: '^[a-zA-Z0-9_-]+$' }
                value:          { type: string }
      responses:
        "201":
          description: Credential field written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret_path: { type: string, example: "connectors/018f1a2b-.../rest-call/api_key" }
        "400":
          description: Missing required field, unrecognized connector_type, or invalid field_name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }
        "413":
          description: Payload exceeds 10 MB limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        "415":
          description: Content-Type is not application/json.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503":
          description: The secret store (OpenBao) is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/v1/connectors/credentials/{connector_type}/{field_name}:
    delete:
      operationId: revokeConnectorCredential
      summary: Revoke a connector credential field
      description: >
        Deletes the OpenBao metadata at
        connectors/<tenantID>/<connector_type>/<field_name>, destroying every
        version of that field. This is not a recoverable soft-delete. Rotation
        does not use this endpoint — KV-v2 versions on overwrite, so writing
        the field again is what rotates it. Requires tenant_admin or
        tenant_owner.
      tags: [Connectors]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - in: path
          name: connector_type
          required: true
          schema: { type: string }
          description: Must match a registered connector type.
        - in: path
          name: field_name
          required: true
          schema: { type: string, pattern: '^[a-zA-Z0-9_-]+$' }
      responses:
        "204": { description: Credential field revoked. No response body. }
        "400":
          description: Unrecognized connector_type, or an invalid field_name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/InternalError' }
        "503":
          description: The secret store (OpenBao) is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/v1/modules:
    get:
      operationId: listModules
      summary: List modules visible to the caller (own tenant + global)
      tags: [Modules]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: scope
          schema: { $ref: '#/components/schemas/CatalogScope' }
        - in: query
          name: q
          schema: { type: string }
          description: Fuzzy search on name.
      responses:
        "200":
          description: Paginated module list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  modules:
                    type: array
                    items: { $ref: '#/components/schemas/ModuleSummary' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        "401": { $ref: '#/components/responses/Unauthorized' }

    post:
      operationId: createModule
      summary: Create a module and its first DRAFT version
      description: >
        `scope: global` requires the `platform_operator` role and is written
        through a BYPASSRLS system connection — the ordinary tenant-scoped
        role cannot insert a global-scope row regardless of this check.
      tags: [Modules]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, bpmn_xml]
              properties:
                name:        { type: string, maxLength: 255 }
                description: { type: string, maxLength: 2000 }
                bpmn_xml:
                  type: string
                  description: Must contain exactly one top-level `<bpmn:process>`.
                scope:
                  allOf: [{ $ref: '#/components/schemas/CatalogScope' }]
                  default: tenant
      responses:
        "201":
          description: Module and initial draft version created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  module_id:  { type: string, format: uuid }
                  version_id: { type: string, format: uuid }
                  status:     { $ref: '#/components/schemas/VersionStatus' }
                  message:    { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409":
          description: MODULE_PROCESS_ID_CONFLICT — the process id is used by a module the caller can call, or a new version's process id differs from its module's.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        "422": { $ref: '#/components/responses/UnprocessableEntity' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/v1/modules/{id}:
    get:
      operationId: getModule
      summary: Get a module's metadata and active version
      tags: [Modules]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Module detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleDetail' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

    delete:
      operationId: archiveModule
      summary: Archive a module (clears its active version)
      description: Deleting a `scope=global` module requires the `platform_operator` role.
      tags: [Modules]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Module archived.
          content:
            application/json:
              schema:
                type: object
                properties:
                  module_id: { type: string, format: uuid }
                  status:    { type: string, example: ARCHIVED }
                  message:   { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409":
          description: The module has no active version to archive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/v1/modules/{id}/usages:
    get:
      operationId: listModuleUsages
      summary: Workflow versions that hold a snapshot of a module
      description: >
        The caller's workflow versions whose `module_refs` include this module, with the module
        version each uses and whether the module has a newer active version.
      tags: [Modules]
      security:
        - GatewayTenantContext: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The module's usages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  usages:
                    type: array
                    items: { $ref: '#/components/schemas/ModuleUsage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
  /api/v1/modules/{id}/versions:
    get:
      operationId: listModuleVersions
      summary: List a module's version history
      tags: [Modules]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated version list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items: { $ref: '#/components/schemas/ModuleVersion' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        "401": { $ref: '#/components/responses/Unauthorized' }

    post:
      operationId: addModuleVersion
      summary: Add a new DRAFT version to an existing module
      description: >
        `bpmn_xml` is optional — omit it to copy the current active version's
        content forward, or supply it to author fresh content in the new draft.
      tags: [Modules]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                bpmn_xml: { type: string, nullable: true }
      responses:
        "201":
          description: Draft version created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  module_id:  { type: string, format: uuid }
                  version_id: { type: string, format: uuid }
                  status:     { $ref: '#/components/schemas/VersionStatus' }
                  message:    { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409":
          description: >-
            A DRAFT version already exists for this module (DRAFT_ALREADY_EXISTS),
            or MODULE_PROCESS_ID_CONFLICT: the process id is used by a module the
            caller can call, or a new version's process id differs from its module's.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        "422": { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/modules/{id}/versions/{version_id}:
    get:
      operationId: getModuleVersion
      summary: Get a specific module version, including its BPMN XML
      tags: [Modules]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: version_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Module version detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleVersion' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/modules/{id}/versions/{version_id}/contract:
    get:
      operationId: getModuleContract
      summary: Get what a call of the module version binds and names
      description: >-
        Compiles the module version, in any status, with its own process as the
        root, its open lanes allowed and its library calls resolved against the
        library as it is now. Returns its slots, every human task by the key a
        call's Assignees takes and the slot it runs in, its messages and error
        codes, and whether it names users. Writes nothing.
      tags: [Modules]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: version_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The module version's contract.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleContract' }
        "400":
          description: An id in the path is not a UUID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/UnprocessableEntity' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/v1/modules/{id}/versions/{version_id}/publish:
    post:
      operationId: publishModuleVersion
      summary: Publish a DRAFT module version
      tags: [Modules]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: version_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Version published and set as the module's active version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  module_id:      { type: string, format: uuid }
                  version_id:     { type: string, format: uuid }
                  status:         { $ref: '#/components/schemas/VersionStatus' }
                  version_number: { type: integer }
                  message:        { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409":
          description: The version is not in DRAFT status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        "422": { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/starters:
    get:
      operationId: listStarters
      summary: List starter templates visible to the caller (own tenant + global)
      tags: [Starters]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: scope
          schema: { $ref: '#/components/schemas/CatalogScope' }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string }
          description: Fuzzy search on name.
      responses:
        "200":
          description: Paginated starter list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  starters:
                    type: array
                    items: { $ref: '#/components/schemas/StarterTemplate' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        "401": { $ref: '#/components/responses/Unauthorized' }

    post:
      operationId: createStarter
      summary: Create a starter template directly from raw BPMN XML
      description: >
        Runs through the same parser/element-allowlist validation as any BPMN upload.
        `scope: global` requires the `platform_operator` role.
      tags: [Starters]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, bpmn_xml]
              properties:
                name:        { type: string, maxLength: 255 }
                description: { type: string, maxLength: 2000 }
                category:    { type: string, maxLength: 64 }
                bpmn_xml:    { type: string }
                scope:
                  allOf: [{ $ref: '#/components/schemas/CatalogScope' }]
                  default: tenant
      responses:
        "201":
          description: Starter created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StarterTemplate' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/starters/from-workflow-version/{version_id}:
    post:
      operationId: createStarterFromWorkflowVersion
      summary: Snapshot one of the caller's own workflow versions into a tenant-scoped starter
      description: >
        The source version must be the caller's own (enforced by the same tenant-scoped
        read every other endpoint uses) and must be PUBLISHED or ARCHIVED, not DRAFT.
        Always creates a `scope: tenant` starter — the BPMN content is copied, not linked,
        so a later edit to the source workflow never changes the starter.
      tags: [Starters]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: version_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:        { type: string, maxLength: 255 }
                description: { type: string, maxLength: 2000 }
                category:    { type: string, maxLength: 64 }
      responses:
        "201":
          description: Starter created from the source version's current content.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StarterTemplate' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409":
          description: The source version is still in DRAFT status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/v1/starters/{id}:
    get:
      operationId: getStarter
      summary: Get a starter template's metadata and BPMN XML
      tags: [Starters]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Starter detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StarterTemplate' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

    delete:
      operationId: deleteStarter
      summary: Delete a starter template
      description: Deleting a `scope=global` starter requires the `platform_operator` role.
      tags: [Starters]
      security:
        - GatewayTenantContext: []
          AdminRoles: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Starter deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  starter_id: { type: string, format: uuid }
                  message:    { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

tags:
  - name: Workflows
    description: Root workflow template management.
  - name: Drafts
    description: Draft workspace operations (init, save, discard).
  - name: Versions
    description: Version-specific operations (get, publish, clone, promote, export, diff).
  - name: Validation
    description: Stateless BPMN validation.
  - name: Health
    description: Health and readiness checks.
  - name: Modules
    description: Reusable BPMN module library (tenant + platform-authored global catalog).
  - name: Starters
    description: Starter/predesigned workflow templates (tenant + platform-authored global catalog).
  - name: BPMN
    description: BPMN modeler-support endpoints (element allowlist discovery).
  - name: Connectors
    description: Connector type registry and per-tenant credential management.
