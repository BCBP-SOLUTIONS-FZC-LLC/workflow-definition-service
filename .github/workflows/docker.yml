name: Docker

on:
  pull_request:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:

  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  build-image-cache:
    name: Build image (cache)
    runs-on: ubuntu-latest
    needs: lint-dockerfile
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: workflow-definition-service:${{ github.sha }}
          build-args: BUILD_VERSION=${{ github.sha }}
          secrets: go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-cve-scan:
    name: Trivy CVE scan
    runs-on: ubuntu-latest
    needs: build-image-cache
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build image (from cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: workflow-definition-service:${{ github.sha }}
          build-args: BUILD_VERSION=${{ github.sha }}
          secrets: go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}
          cache-from: type=gha

      - uses: aquasecurity/trivy-action@v0.29.0
        with:
          image-ref: workflow-definition-service:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: build-image-cache
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wfdef
          POSTGRES_PASSWORD: wfdef
          POSTGRES_DB: wfdef
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build image (from cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: workflow-definition-service:${{ github.sha }}
          build-args: BUILD_VERSION=${{ github.sha }}
          secrets: go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}
          cache-from: type=gha

      - name: Run migrations
        env:
          DATABASE_URL: postgres://wfdef:wfdef@localhost:5432/wfdef?sslmode=disable
        run: |
          docker run --rm --network=host \
            -e DATABASE_URL \
            workflow-definition-service:${{ github.sha }} /server migrate

      - name: Start service
        env:
          DATABASE_URL: postgres://wfdef:wfdef@localhost:5432/wfdef?sslmode=disable
        run: |
          docker run -d --name svc --network=host \
            -e DATABASE_URL \
            -e AWS_USE_STUB=true \
            -e APP_ENV=ci \
            workflow-definition-service:${{ github.sha }}

      - name: Wait for health
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:8080/healthz && exit 0
            sleep 2
          done
          docker logs svc
          exit 1

      - name: Smoke test (health-only)
        run: bash scripts/smoke-test.sh --health-only

      - name: Service logs on failure
        if: failure()
        run: docker logs svc

  push-image-ghcr:
    name: Push image → GHCR
    runs-on: ubuntu-latest
    needs: build-image-cache
    if: false  # enabled once GHCR credentials are configured
    steps:
      - run: echo "Registry push not yet configured"
