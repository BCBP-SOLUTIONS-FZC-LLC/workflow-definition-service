  # 3.14
  /api/v1/workflows/{id}/versions/{version_id}/diff/{target_version_id}:
    get:
      operationId: getVersionDiff
      summary: Structural diff between two versions
      tags: [Versions]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TenantRoles'
        - $ref: '#/components/parameters/Departments'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/FeatureFlags'
        - $ref: '#/components/parameters/WorkflowId'
        - name: version_id
          in: path
          required: true
          description: Base version ID.
          schema: { type: string, format: uuid }
        - name: target_version_id
          in: path
          required: true
          description: Target version ID.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Diff result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_id:       { type: string, format: uuid }
                  base_version_id:   { type: string, format: uuid }
                  target_version_id: { type: string, format: uuid }
                  change_type:       { $ref: '#/components/schemas/ChangeType' }
                  changes:
                    type: object
                    properties:
                      added_departments:   { type: array, items: { type: string } }
                      removed_departments: { type: array, items: { type: string } }
                      step_changes:
                        type: array
                        items: { $ref: '#/components/schemas/StepChange' }
                      metadata_only: { type: boolean }
        "400": { $ref: '#/components/responses/UnprocessableEntity' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/InternalError' }
  # Health Checks
  /healthz:
    get:
      operationId: healthCheck
      summary: Liveness Probe
      tags: [Health]
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "OK" }
        "500": { $ref: '#/components/responses/InternalError' }

  /readyz:
    get:
      operationId: readinessCheck
      summary: Readiness Probe
      tags: [Health]
      responses:
        "200":
          description: Service is ready to accept traffic.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:         { type: string, example: "OK" }
                  db_utilization: { type: number, example: 0.3, description: "Ratio of acquired connections to max pool size." }
                  db_conns:       { type: integer, example: 3, description: "Current number of acquired connections." }
                  db_max_conns:   { type: integer, example: 10, description: "Configured pool maximum." }
        "503":
          description: Service is not ready — database pool unhealthy or Valkey cache unreachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api.workflow.platform/errors/service-unavailable"
                title: "Service Unavailable"
                status: 503
                detail: "Database connectivity check failed."
                instance: "/readyz"
                code: "DATABASE_DISCONNECTED"

  /internal/events:
    post:
      operationId: ingestInternalEvent
      summary: Ingest a forwarded domain-event envelope
      description: >
        Service-to-service ingest endpoint called by the shared workflow-events consumer (which
        consumes the SQS queues, e.g. membership-wf-q). Accepts a single event envelope, sets the
        RLS GUC from the envelope tenant_id, and dispatches by type — currently
        DepartmentMembershipRevoked → template invalidation (see LLD §7.4). Idempotent: a repeated
        envelope id returns 2xx with no side effects. This route is internal-only — it is not
        exposed on the public Envoy gateway and carries no gateway identity headers.
      tags: [Internal]
      security:
        - InternalServiceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventEnvelope' }
      responses:
        "200":
          description: Event processed, or an idempotent no-op for an already-seen envelope id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "processed", enum: [processed, deduplicated, ignored] }
        "204":
          description: Event accepted with no response body (alternative to 200).
        "400":
          description: Malformed envelope or payload (non-retryable — the consumer routes to its DLQ).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        "401":
          description: Missing or invalid internal service credential.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        "500":
          description: Transient processing failure (DB/transaction). The consumer retries and eventually DLQs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /internal/connector-aliases/rest:
    post:
      operationId: writeConnectorRestAlias
      summary: Create or update a REST-call connector alias
      tags: [Internal]
      security:
        - InternalServiceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alias, method, baseURL, pathTemplate]
              properties:
                alias:        { type: string }
                method:       { type: string, description: HTTP method. }
                baseURL:      { type: string }
                pathTemplate: { type: string }
                timeoutMs:
                  type: integer
                  format: int64
                  description: Request timeout in milliseconds. Non-positive or omitted defaults to 5000ms.
      responses:
        "204": { description: Alias written. No response body. }
        "400":
          description: Missing required field, or a domain validation failure (e.g. invalid method).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        "401":
          description: Missing or invalid internal service credential.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        "500": { $ref: '#/components/responses/InternalError' }

